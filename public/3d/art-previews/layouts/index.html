<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bladefall · Campaign layouts</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui;background:#171c20;color:#e5dfd1}body{max-width:1100px;margin:auto;padding:22px 16px 60px}h1,h2{font-family:Georgia;font-weight:500;color:#dac08b}h1{font-size:32px;margin-bottom:8px}a{color:#e1c792}p{max-width:750px;color:#bfc3c3}select,button{font:inherit;padding:11px;background:#252d32;color:#eee;border:1px solid #5f6261;border-radius:6px;min-height:46px}select{width:100%;max-width:610px}nav{display:flex;gap:10px;align-items:center;margin:18px 0}button:focus-visible,select:focus-visible{outline:2px solid #e1c792;outline-offset:3px}figure{margin:18px 0}img{display:block;width:100%;height:auto;border-radius:8px;background:#242a2d}figcaption{font-size:13px;color:#aeb7ba;margin:10px 0}summary{cursor:pointer;padding:12px 0;color:#e1c792}svg{display:block;width:100%;max-height:750px;background:#20282c;border-radius:8px}ol{columns:2;padding-left:25px}li{break-inside:avoid;padding:4px 0}.legend{display:flex;gap:18px;font-size:14px}.legend span:first-child{color:#86cbb0}.legend span:last-child{color:#e2bc76}@media(max-width:500px){h1{font-size:27px}ol{columns:1}nav{flex-wrap:wrap}select{flex-basis:100%}}
</style>
<body>
<a href="../../?mute=1">Play the preview</a> · <a href="../">World art gallery</a> · <a href="../enemies/">Enemies</a>
<h1>The campaign, rebuilt</h1>
<p>Sixteen exploration areas and eight boss arenas. Choose a level for its full Blender overview and route map.</p>
<nav aria-label="Preview selection"><select id="level" aria-label="Campaign level"></select><button id="prev" aria-label="Previous level">← Previous</button><button id="next" aria-label="Next level">Next →</button></nav>
<h2 id="title">Loading previews…</h2>
<p id="description"></p>
<figure><a id="full"><img id="preview" width="1600" height="1400" alt=""></a><figcaption>Blender render of the game’s static scenery. Cave roofs are cut away to show the route. Lighting differs from gameplay; enemies, pickups and active hazards appear in the game. Tap the image to open it at full size.</figcaption></figure>
<details><summary>Explore the route map</summary><div class="legend"><span>● Entry</span><span>● Final district</span></div><svg id="map" role="img" aria-label="District route map"></svg><ol id="districts"></ol></details>
<p id="status" aria-live="polite"></p>
<script>
const $=id=>document.getElementById(id),ns='http://www.w3.org/2000/svg';let levels=[];
function shape(tag,attrs,text){const e=document.createElementNS(ns,tag);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);if(text)e.textContent=text;return e;}
function show(){
 const n=+$('level').value,r=levels[n];if(!r)return;history.replaceState(null,'','#'+r.id);$('title').textContent=r.name;$('preview').src=r.id+'.png?v='+(r.layout.revision||1);$('description').textContent=({'campaign-0-0':'Outskirts: The Sleeping Valley. Survey the Watchpost, break the two farm nests in either order, then reawaken the Old Waystone. Explore the caravan trail, millrace and secluded grove along the way.','campaign-1-0':'Hollow Pass: The Wind-carved Pass. Follow the sheltered wash or climb the exposed rim, recover the caravan charter in a hidden alcove, then light the Pass Beacon. Brace windbreaks for a calm crossing.','campaign-1-1':'Dry Wash: The Fossil Aqueduct. Explore the broad fossil basin, discover the buried survey tomb and climb the broken aqueduct to the Hollow Shrine. Two windbreaks calm the exposed upper crossings.'})[r.id]||'';$('preview').alt='Blender overview of '+r.name;$('full').href=$('preview').src;$('status').textContent=(n+1)+' / '+levels.length+' · Campaign layout preview';
 document.querySelector('details').hidden=!r.layout.edges.length;const map=$('map'),nodes=r.layout.nodes;map.replaceChildren();$('districts').replaceChildren();
 const minX=Math.min(...nodes.map(p=>p.x-p.w/2))-160,maxX=Math.max(...nodes.map(p=>p.x+p.w/2))+160,minZ=Math.min(...nodes.map(p=>p.z-p.d/2))-160,maxZ=Math.max(...nodes.map(p=>p.z+p.d/2))+160;map.setAttribute('viewBox',[minX,minZ,maxX-minX,maxZ-minZ].join(' '));
 for(const edge of r.layout.edges){const a=nodes[edge.a],b=nodes[edge.b];map.append(shape('polyline',{points:[a,...(edge.points||[]),b].map(p=>p.x+','+p.z).join(' '),fill:'none',stroke:'#a59472','stroke-width':35,'stroke-linecap':'round'}));}
 nodes.forEach((p,i)=>{const c=i===0?'#86cbb0':i===nodes.length-1?'#e2bc76':'#7c929d';map.append(shape('rect',{x:p.x-p.w/2,y:p.z-p.d/2,width:p.w,height:p.d,rx:35,fill:'#334047',stroke:c,'stroke-width':12}));map.append(shape('text',{x:p.x,y:p.z+26,fill:c,'font-size':88,'text-anchor':'middle'},String(i+1)));const li=document.createElement('li');li.textContent=p.name+(p.y?' · raised '+p.y+' units':'');$('districts').append(li);});
}
$('level').onchange=show;$('prev').onclick=()=>{$('level').value=(+$('level').value+levels.length-1)%levels.length;show();};$('next').onclick=()=>{$('level').value=(+$('level').value+1)%levels.length;show();};
fetch('levels.json').then(r=>{if(!r.ok)throw Error('Unable to load the gallery');return r.json();}).then(data=>{levels=data;data.forEach((r,i)=>{const o=document.createElement('option');o.value=i;o.textContent=r.name;$('level').append(o);});const found=data.findIndex(r=>'#'+r.id===location.hash);$('level').value=Math.max(0,found);show();}).catch(e=>{$('title').textContent='Preview unavailable';$('status').textContent=e.message;});
</script>
</body></html>
