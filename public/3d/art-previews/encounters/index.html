<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bladefall — Named encounters</title><style>body{margin:0;background:#11131b;color:#eee6d2;font:16px/1.5 system-ui}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:28px}h2{font-size:21px}small{display:block;color:#c8b78f;font-size:14px}figure{margin:30px 0}img{display:block;width:100%;height:auto;border:1px solid #706045;box-sizing:border-box}figcaption{padding:12px 0;color:#dccaa5}a{color:#ecd09a}</style><main><h1>Named encounters</h1><p>Four staged in-game previews of the new attack warnings. Tap a picture to view it full size. Each attack locks its aim and leaves an opening after it finishes.</p><figure><h2>Raid leader <small>Briar Town</small></h2><a href="raid.webp"><img src="raid.webp" alt="Raid leader attack warning in Briar Town" width="1200" height="800" loading="lazy"></a><figcaption>Step behind the wide sweep.</figcaption></figure><figure><h2>Forge captain <small>Emberdeep</small></h2><a href="forge.webp"><img src="forge.webp" alt="Forge captain attack warning in Emberdeep" width="1200" height="800" loading="lazy"></a><figcaption>Jump the moving ground pulse, or move outside its reach.</figcaption></figure><figure><h2>Shore raider <small>Storm Coast</small></h2><a href="shore.webp"><img src="shore.webp" alt="Shore raider attack warning in Storm Coast" width="1200" height="800" loading="lazy"></a><figcaption>Move between the three aim lines. The archer stands on the wide beach approach.</figcaption></figure><figure><h2>Tower captain <small>Castle Duskmoor</small></h2><a href="tower.webp"><img src="tower.webp" alt="Tower captain attack warning in Castle Duskmoor" width="1200" height="800" loading="lazy"></a><figcaption>Move into a diagonal gap between the crossing lanes.</figcaption></figure><p><a href="../../">Play Bladefall</a></p></main></html>
