<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BLADEFALL — 3D Vertical Slice</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#08090c;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8dcc6;overscroll-behavior:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}

  #load{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;
    background:radial-gradient(circle at 50% 40%,#181420,#08090c 70%);z-index:50;text-align:center;padding:20px}
  #load h1{font-family:Georgia,serif;letter-spacing:.14em;margin:0;font-size:clamp(22px,5vw,34px);color:#e8c07a}
  #load p{margin:0;color:#8d8474;font-size:13px}
  .spin{width:34px;height:34px;border:3px solid #3a3020;border-top-color:#e8a33d;border-radius:50%;
    animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #bar{width:min(280px,70vw);height:4px;background:#241f18;border-radius:3px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a9762a,#f0c070);transition:width .3s}

  .hud{position:fixed;z-index:20;pointer-events:none}
  #top{top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    display:flex;gap:8px;align-items:flex-start;justify-content:space-between;
    background:linear-gradient(180deg,rgba(6,7,10,.82),transparent)}
  #brand{font-family:Georgia,serif;font-size:13px;letter-spacing:.16em;color:#e8c07a;text-transform:uppercase}
  #brand small{display:block;letter-spacing:.05em;text-transform:none;color:#8d8474;font-size:10.5px;font-family:system-ui}
  #classes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
  .cbtn{background:linear-gradient(180deg,rgba(38,30,20,.95),rgba(16,14,18,.95));border:1px solid #4a3c26;
    color:#d8c8a8;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:9px;cursor:pointer;
    letter-spacing:.03em;transition:.14s}
  .cbtn:hover{border-color:#e8a33d;color:#fff}
  .cbtn.sel{border-color:#e8a33d;color:#ffd89a;box-shadow:0 0 14px rgba(232,163,61,.28)}
  .cbtn:focus-visible{outline:2px solid #e8a33d;outline-offset:2px}

  #skins{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
  .sbtn{display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,rgba(30,26,20,.95),rgba(14,12,16,.95));
    border:1px solid #3d3830;color:#bdb3a0;font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:8px;
    cursor:pointer;letter-spacing:.03em;transition:.14s}
  .sbtn:hover{border-color:#e8a33d;color:#fff}
  .sbtn.sel{border-color:#e8a33d;color:#ffd89a;box-shadow:0 0 10px rgba(232,163,61,.25)}
  .sbtn i{width:9px;height:9px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.5) inset}
  .sbtn:focus-visible{outline:2px solid #e8a33d;outline-offset:2px}

  #hint{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;
    font-size:11.5px;color:#8d8474;line-height:1.7;pointer-events:none;text-shadow:0 1px 3px #000}
  #hint b{color:#d8c8a8}
  #fps{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;
    font:600 11px ui-monospace,monospace;color:#6f6858;pointer-events:none}
  #perf{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 96px);z-index:23;
    font:600 11px/1.55 ui-monospace,monospace;color:#bfe6ff;background:rgba(6,8,14,.82);
    border:1px solid #2b3a4a;border-radius:9px;padding:8px 11px;pointer-events:none;white-space:pre}
  #perf.hide{display:none}
  #perf b{color:#ffd24a}
  #perf .bad{color:#ff7a6a}
  #kills{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 30px);z-index:20;
    font:700 12px system-ui;color:#e8c07a;pointer-events:none;text-shadow:0 1px 3px #000}

  #custom{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 96px);z-index:24;
    width:206px;max-height:66vh;overflow-y:auto;background:rgba(10,10,15,.93);
    border:1px solid #3d3830;border-radius:11px;padding:10px 11px;pointer-events:auto;
    font-size:11px;color:#cfc6b4;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  #custom.hide{display:none}
  #custom h4{margin:9px 0 5px;font:800 9.5px system-ui;letter-spacing:.13em;
    text-transform:uppercase;color:#8d8474}
  #custom h4:first-child{margin-top:0}
  #custom .row{display:flex;flex-wrap:wrap;gap:4px}
  #custom .opt{background:linear-gradient(180deg,rgba(34,29,22,.95),rgba(15,13,18,.95));
    border:1px solid #46402f;color:#c8bda8;font-size:10px;font-weight:700;padding:4px 7px;
    border-radius:6px;cursor:pointer}
  #custom .opt.sel{border-color:#e8a33d;color:#ffd89a}
  #custom .sw{width:22px;height:22px;border-radius:50%;border:2px solid #3a352c;cursor:pointer;padding:0}
  #custom .sw.sel{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.5)}
  #custBtn{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 62px);z-index:24;
    background:linear-gradient(180deg,rgba(38,30,20,.95),rgba(16,14,18,.95));border:1px solid #4a3c26;
    color:#d8c8a8;font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
  #custBtn:hover{border-color:#e8a33d;color:#fff}

  #hpwrap{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 58px);
    z-index:20;display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none}
  #hpbar{width:min(240px,52vw);height:13px;background:rgba(10,8,12,.8);border:1px solid #5a4a30;
    border-radius:7px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.5)}
  #hpbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4fae5c,#7ad06a);
    transition:width .18s ease-out}
  #hptxt{font:700 10.5px ui-monospace,monospace;color:#cbbfa5;text-shadow:0 1px 3px #000}

  #skillbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);
    z-index:21;display:flex;gap:8px;pointer-events:auto}
  .skb{position:relative;width:60px;height:60px;border-radius:12px;overflow:hidden;cursor:pointer;
    background:linear-gradient(180deg,rgba(34,28,20,.96),rgba(14,12,17,.96));border:1.5px solid #4a3c26;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
    transition:border-color .14s,transform .08s;user-select:none}
  .skb:hover{border-color:#e8a33d}
  .skb:active{transform:scale(.94)}
  .skb .k{font:800 9px ui-monospace,monospace;color:#8d8474;letter-spacing:.08em}
  .skb .n{font:700 8.5px system-ui;color:#e0d2b4;text-align:center;line-height:1.1;padding:0 3px}
  .skb .cd{position:absolute;inset:0;background:rgba(6,6,10,.72);pointer-events:none;
    transform-origin:bottom;transition:none}
  .skb.ready{border-color:#8a6f34}
  @media(max-width:560px){ .skb{width:52px;height:52px} .skb .n{font-size:7.5px} }

  /* On a phone the class bar (16 entries) wrapped over the whole screen and buried the
     character. Collapse it behind a single tap target, opened as a scrollable sheet. */
  #clsToggle{display:none}
  body.touch #clsToggle{display:block;background:linear-gradient(180deg,rgba(38,30,20,.96),rgba(16,14,18,.96));
    border:1px solid #8a6f34;color:#ffd89a;font:800 12px system-ui;letter-spacing:.05em;
    padding:9px 14px;border-radius:9px;pointer-events:auto}
  body.touch #classes{display:none;position:fixed;left:8px;right:8px;top:52px;max-height:46vh;overflow-y:auto;
    background:rgba(10,9,13,.97);border:1px solid #4a3c26;border-radius:12px;padding:10px;
    justify-content:flex-start;z-index:30;-webkit-overflow-scrolling:touch}
  body.touch #classes.open{display:flex}
  body.touch .cbtn{font-size:13px;padding:9px 12px}
  /* keep the top-right stack from covering the character on a phone */
  body.touch #skins,body.touch #custom{max-height:32vh;overflow-y:auto}

  /* keyboard hints are noise on a phone, and the skill bar sat on top of the stick */
  body.touch #hint{display:none}
  body.touch #skillbar{bottom:calc(env(safe-area-inset-bottom) + 168px);justify-content:center}

  /* eye tuner — sliders, because placement has to be judged by someone who can see it */
  #eyep{position:fixed;left:10px;top:10px;z-index:40;width:236px;max-height:86vh;overflow-y:auto;display:none;
    background:rgba(10,9,13,.96);border:1px solid #4a3c26;border-radius:12px;padding:11px 12px;
    font:600 11px system-ui;color:#e0d2b4;-webkit-overflow-scrolling:touch}
  #eyep.open{display:block}
  #eyep h5{margin:0 0 8px;font:800 11px system-ui;letter-spacing:.09em;color:#e8a33d;text-transform:uppercase}
  #eyep label{display:block;margin:7px 0 2px;color:#a89c84;font-size:10px;letter-spacing:.04em}
  #eyep .rw{display:flex;align-items:center;gap:7px}
  #eyep input[type=range]{flex:1;min-width:0;accent-color:#e8a33d}
  #eyep .v{width:42px;text-align:right;font:700 10px ui-monospace,monospace;color:#ffd89a}
  #eyep input[type=color]{width:100%;height:22px;border:1px solid #4a3c26;border-radius:5px;background:none;padding:0}
  #eyep .shapes{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  #eyep .shapes button{flex:0 0 auto;padding:5px 8px;font-size:10px;border-radius:6px;
    border:1px solid #4a3c26;color:#c9bda2;background:rgba(30,25,18,.9)}
  #eyep .shapes button.sel{border-color:#e8a33d;color:#ffd89a}
  #eyep hr{border:0;border-top:1px solid #33291c;margin:12px 0 4px}
  #eyep .btns{display:flex;gap:6px;margin-top:10px}
  #eyep button{flex:1;background:linear-gradient(180deg,rgba(38,30,20,.96),rgba(16,14,18,.96));
    border:1px solid #8a6f34;color:#ffd89a;font:800 10px system-ui;padding:7px 4px;border-radius:7px}
  #creator{position:fixed;left:10px;top:52px;z-index:41;width:246px;max-height:82vh;overflow-y:auto;display:none;
    background:rgba(12,10,16,.97);border:1px solid #6a5330;border-radius:12px;padding:12px 13px;
    font:600 11px system-ui;color:#e0d2b4}
  #creator.open{display:block}
  #creator h5{margin:0 0 8px;font:800 11px system-ui;letter-spacing:.09em;color:#e8a33d;text-transform:uppercase}
  #creator label{display:block;margin:8px 0 2px;color:#a89c84;font-size:10px;letter-spacing:.04em}
  #creator .rw{display:flex;align-items:center;gap:7px}
  #creator input[type=range]{flex:1;min-width:0;accent-color:#e8a33d}
  #creator .shapes{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
  #creator .shapes button{padding:5px 8px;font-size:10px;border-radius:6px;border:1px solid #4a3c26;
    color:#c9bda2;background:rgba(30,25,18,.9)}
  #creator .shapes button.sel{border-color:#e8a33d;color:#ffd89a}
  #creator .sw2{width:24px;height:24px;border-radius:50%;padding:0;border:2px solid #4a3c26}
  #creator .sw2.sel{border-color:#e8a33d}
  #creator .btns{display:flex;gap:6px;margin-top:12px}
  #creator .btns button{flex:1;background:linear-gradient(180deg,rgba(38,30,20,.96),rgba(16,14,18,.96));
    border:1px solid #8a6f34;color:#ffd89a;font:800 10px system-ui;padding:8px 4px;border-radius:7px}
  #animbar{position:fixed;right:10px;bottom:120px;z-index:41;width:220px;max-height:58vh;overflow-y:auto;
    display:none;background:rgba(12,10,16,.97);border:1px solid #6a5330;border-radius:12px;padding:10px;
    -webkit-overflow-scrolling:touch}
  #animbar.open{display:block}
  #animbar b{display:block;font:800 10px system-ui;letter-spacing:.09em;color:#e8a33d;margin-bottom:7px}
  #animbar button{display:block;width:100%;text-align:left;margin-bottom:4px;padding:6px 9px;
    font:700 10.5px system-ui;border-radius:6px;border:1px solid #4a3c26;color:#c9bda2;
    background:rgba(30,25,18,.9)}
  #animbar button.sel{border-color:#e8a33d;color:#ffd89a}
  #animBtn{position:fixed;right:10px;bottom:120px;z-index:39;
    background:linear-gradient(180deg,rgba(38,30,20,.96),rgba(16,14,18,.96));
    border:1px solid #8a6f34;color:#ffd89a;font:800 11px system-ui;padding:8px 12px;border-radius:8px}
  #creatorBtn{position:fixed;left:10px;top:52px;z-index:39;
    background:linear-gradient(180deg,rgba(48,36,20,.96),rgba(20,16,22,.96));
    border:1px solid #b0873a;color:#ffd89a;font:800 11px system-ui;padding:8px 12px;border-radius:8px}
  #eyeBtn{position:fixed;left:10px;top:10px;z-index:39;background:linear-gradient(180deg,rgba(38,30,20,.96),rgba(16,14,18,.96));
    border:1px solid #8a6f34;color:#ffd89a;font:800 11px system-ui;padding:8px 12px;border-radius:8px}

  /* touch controls */
  #touch{position:fixed;inset:0;z-index:22;display:none;pointer-events:none}
  body.touch #touch{display:block}
  #stick{position:absolute;left:calc(env(safe-area-inset-left) + 22px);bottom:calc(env(safe-area-inset-bottom) + 26px);
    width:124px;height:124px;border-radius:50%;background:rgba(20,18,24,.42);border:1.5px solid rgba(200,170,110,.28);
    pointer-events:auto;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;
    background:radial-gradient(circle at 40% 35%,#5a4a30,#241d14);border:1.5px solid rgba(230,190,120,.5)}
  #abtns{position:absolute;right:calc(env(safe-area-inset-right) + 20px);bottom:calc(env(safe-area-inset-bottom) + 30px);
    display:grid;gap:12px;justify-items:center;pointer-events:auto}
  .ab{width:74px;height:74px;border-radius:50%;border:2px solid;display:grid;place-content:center;
    font-weight:800;font-size:12px;letter-spacing:.06em;cursor:pointer;touch-action:none;user-select:none}
  #bAtk{background:radial-gradient(circle at 40% 35%,#7a2420,#2a0f0e);border-color:#c0533f;color:#ffd0c0}
  #bSkill{background:radial-gradient(circle at 40% 35%,#5a3a10,#2a1c08);border-color:#e8a33d;color:#ffe0a8;
    width:64px;height:64px;font-size:11px}
  #bRoll{background:radial-gradient(circle at 40% 35%,#20344a,#0e1620);border-color:#5f8fb8;color:#cfe4f5;
    width:58px;height:58px;font-size:10.5px}
  #bJump{background:radial-gradient(circle at 40% 35%,#1f4a34,#0b1a13);border-color:#54a87a;color:#ccf0dc;
    width:58px;height:58px;font-size:10.5px}
  .ab:active{filter:brightness(1.35)}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="load">
  <h1>BLADEFALL</h1>
  <div class="spin"></div>
  <div id="bar"><i></i></div>
  <p id="lmsg">Loading 3D vertical slice…</p>
</div>

<div class="hud" id="top">
  <div id="brand">Bladefall<small>3D slice · Quaternius + Kenney (CC0)</small></div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">
    <button id="clsToggle">CLASS ▾</button>
  <div id="classes"></div>
    <div id="skins"></div>
  </div>
</div>

<div id="hint">
  <b>WASD</b> move · <b>Shift</b> sprint · <b>Space</b> jump · <b>C</b> roll<br>
  <b>P</b> profiler · <b>J</b>/click attack · <b>1-4</b> skills · <b>Drag</b> orbit · <b>Scroll</b> zoom
</div>
<button id="animBtn">ANIMS</button>
<div id="animbar"></div>
<button id="creatorBtn">CUSTOMISE</button>
<div id="creator"></div>
<button id="eyeBtn">FACE</button>
<div id="eyep"></div>
<button id="custBtn">🎨 Customise</button>
<div id="custom" class="hide"></div>
<div id="safeTag" style="position:fixed;left:50%;transform:translateX(-50%);bottom:14px;z-index:24;padding:6px 14px;border-radius:8px;background:rgba(10,30,20,.86);border:1px solid #4d9a74;color:#9affd0;font:800 11px system-ui;letter-spacing:.08em;display:none">SAFE ZONE</div>
<div id="hpwrap"><div id="hpbar"><i id="hpfill"></i></div><span id="hptxt">100 / 100</span></div>
<div id="skillbar"></div>
<div id="fps"></div>
<div id="perf" class="hide"></div>
<div id="kills"></div>

<div id="touch">
  <div id="stick"><div id="knob"></div></div>
  <div id="abtns">
    <div class="ab" id="bSkill">SKILL</div>
    <div class="ab" id="bJump">JUMP</div>
    <div class="ab" id="bRoll">ROLL</div>
    <div class="ab" id="bAtk">ATTACK</div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "./three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './jsm/loaders/GLTFLoader.js';
import { FBXLoader } from './jsm/loaders/FBXLoader.js';
import * as SkeletonUtils from './jsm/utils/SkeletonUtils.js';

/* ─────────────────────────────────────────────────────────────
   BLADEFALL — 3D vertical slice
   Purpose: judge the Quaternius art direction in motion, with the
   real game verbs (move / sprint / roll / attack / skill) before
   committing to a full rebuild. Art: Quaternius + Kenney, all CC0.
   ───────────────────────────────────────────────────────────── */

const HERO_H = 1.75;
const ATK_SPEED = 1.85;   // swing playback rate — higher = snappier
// Face placement — tune live via __SLICE.faceTune({...}); values bake in here.
const FACE = { enabled:false, bandLo:0.72, bandHi:0.90, eyeY:0.34, eyeX:0.38, size:0.17, lift:1.0 };
let MOB_SCALE = 1.0;   // global mob-size dial (see __SLICE.mobScale)                 // metres — everything is normalised to this
const clock  = new THREE.Clock();
const canvas = document.getElementById('c');

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.34;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#171a24');
scene.fog = new THREE.FogExp2('#171a24', 0.013);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 300);

/* ── Lighting: moody but READABLE — atmosphere shouldn't cost you the art. ── */
// Ambient floor so no surface ever reads as a black silhouette — these stylised
// textures are dark, and without it the characters lose all their detail.
scene.add(new THREE.AmbientLight('#9fb0d0', 0.95));
scene.add(new THREE.HemisphereLight('#9fb4dd', '#5a4a3a', 1.5));
const moon = new THREE.DirectionalLight('#cfe0ff', 1.5);
moon.position.set(-8, 14, -6);
moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
moon.shadow.camera.near = 1; moon.shadow.camera.far = 60;
moon.shadow.camera.left = -22; moon.shadow.camera.right = 22;
moon.shadow.camera.top = 22;  moon.shadow.camera.bottom = -22;
moon.shadow.bias = -0.0016;
scene.add(moon);

const heroLamp = new THREE.PointLight('#ffc888', 2.6, 18, 2);   // keeps the hero readable in the gloom
scene.add(heroLamp);

// flickering braziers, placed after we know the room size
const torches = [];
function addTorch(x, z){
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.08,1.1,7),
    new THREE.MeshStandardMaterial({ color:'#2b2119', roughness:.95 }));
  post.position.y = 0.55; g.add(post);
  const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.11,0.16,9),
    new THREE.MeshStandardMaterial({ color:'#3a2c1e', roughness:.9 }));
  bowl.position.y = 1.16; g.add(bowl);
  const flame = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16,0),
    new THREE.MeshBasicMaterial({ color:'#ffb44a' }));
  flame.position.y = 1.32; g.add(flame);
  scene.add(g);
  torches.push({ li:null, flame, base:3.6, seed: Math.random()*7 });   // flame glows via emissive; no light
}

/* ── Loading ── */
const loader = new GLTFLoader();
const bar = document.querySelector('#bar i');
const lmsg = document.getElementById('lmsg');
let loadedCount = 0, loadTotal = 1;
const bump = () => { loadedCount++; bar.style.width = Math.round(100*loadedCount/loadTotal)+'%'; };
const load = url => new Promise((res, rej) => loader.load(url, g => { bump(); res(g); }, undefined, rej));

// Quaternius + Kenney ship KHR_materials_unlit, which GLTFLoader turns into MeshBasicMaterial —
// those ignore every light, so torches/shadows would do nothing. Re-light them as Lambert
// (cheap, and the flat stylised look survives) while keeping the baked colour map.
function relight(m){
  if(!m || !m.isMeshBasicMaterial) return m;
  const lit = new THREE.MeshLambertMaterial({

/* ─────────────  SKINS  ─────────────
   The Quaternius atlases are genuinely dark (the Warrior's plate is #3d3d3d at 24%
   brightness), which is why the stock models read as silhouettes. Rather than ship a
   second set of textures, we repaint the atlas on a canvas at load time:
     · desaturated pixels  → the armour/metal colour  (luminance preserved)
     · dark warm-brown     → the leather/cloth colour
     · everything else     → untouched, so skin, hair and eyes survive
   `lift` raises overall brightness. This is the same trick that gives one sword mesh
   a whole rarity ladder, so it doubles as a test of that idea. */
function hexRGB(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgb2hsv(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0; if(d){ h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h*=60; }
  return [h, mx?d/mx:0, mx];
}
function tintPixel(out, i, target, lum){
  // paint `target` at the pixel's own luminance so shading/detail survives
  const [tr,tg,tb] = target;
  out[i]   = Math.min(255, tr * lum);
  out[i+1] = Math.min(255, tg * lum);
  out[i+2] = Math.min(255, tb * lum);
}
const _skinCache = new Map();
function repaintTexture(srcTex, skin){
  const img = srcTex.image;
  if(!img || !img.width) return srcTex;
  const key = (srcTex.uuid || '') + '|' + skin.id;
  if(_skinCache.has(key)) return _skinCache.get(key);

  const cvs = document.createElement('canvas');
  cvs.width = img.width; cvs.height = img.height;
  const ctx = cvs.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0,0,cvs.width,cvs.height);
  const px = data.data;
  const metal   = hexRGB(skin.metal);
  const leather = hexRGB(skin.leather);
  const lift    = skin.lift || 1.0;

  for(let i=0;i<px.length;i+=4){
    if(px[i+3] < 8) continue;
    const [h,s,v] = rgb2hsv(px[i],px[i+1],px[i+2]);
    // luminance normalised so mid-greys land mid-tone, then lifted
    const lum = Math.min(1.9, (0.35 + v * 1.25) * lift);
    if(s < 0.20){                                     // steel / plate / cloth-grey
      tintPixel(px, i, metal, lum);
    } else if(h >= 12 && h <= 52 && v < 0.52){        // dark leather + straps
      tintPixel(px, i, leather, lum);
    } else {                                          // skin, hair, eyes, accents
      px[i]   = Math.min(255, px[i]   * lift);
      px[i+1] = Math.min(255, px[i+1] * lift);
      px[i+2] = Math.min(255, px[i+2] * lift);
    }
  }
  ctx.putImageData(data, 0, 0);
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.flipY = srcTex.flipY;
  tex.wrapS = srcTex.wrapS; tex.wrapT = srcTex.wrapT;
  tex.needsUpdate = true;
  _skinCache.set(key, tex);
  return tex;
}

async function applyClassLook(key){
  const L = CLASS_LOOKS[key]; if(!L || !hero) return;

    if(base){ await switchClass(base); await new Promise(r => setTimeout(r, 60)); }

  // Armour must go on the BARE BODY. The character otherwise loads wearing the full
  // assembled Ranger outfit, so every 'class' came out identical with a hood baked in.
  const baseIdx = (heroDef.outfits || []).findIndex(o => /Base Body/i.test(o.name));
  if(baseIdx >= 0 && (outfitIdx[heroDef.id] || 0) !== baseIdx){
    outfitIdx[heroDef.id] = baseIdx;

    await switchClass(d);
    await new Promise(r => setTimeout(r, 60));

  for(const s of L.wear){ EQUIP_SLOTS[s] = armourFile(s); await equipPart(hero, s); }

  actor.root.traverse(o => { if(!skel && o.isSkinnedMesh) skel = o.skeleton; });
  if(!skel) return;

  const added = [];
  g.scene.traverse(o => {
    if(!o.isSkinnedMesh) return;
    const m = new THREE.SkinnedMesh(o.geometry, o.material);
    m.castShadow = true; m.receiveShadow = true;
    m.material = Array.isArray(o.material) ? o.material.map(relight) : relight(o.material);
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    for(const mm of mats){ if(mm && mm.map) mm.map.colorSpace = THREE.SRGBColorSpace; }
    // THE WHOLE TRICK: reuse the character's skeleton + the part's own bind matrix.
    m.bind(skel, o.bindMatrix);
    actor.model.add(m);
    added.push(m);
  });
  (actor._equip = actor._equip || {})[slot] = added;
  return added;
}
function unequipPart(actor, slot){
  const list = actor && actor._equip && actor._equip[slot];
  if(!list) return;
  for(const m of list){ if(m.parent) m.parent.remove(m); }
  delete actor._equip[slot];
}

/* ── customisation: hair style + colours, all via the proven modular/tint paths ── */
const HAIR_STYLES = [
  { name:'Parted', slot:'hair',      file:'hair/Hair_SimpleParted' },
  { name:'Long',   slot:'hair',      file:'hair/Hair_Long' },
  { name:'Buns',   slot:'hair',      file:'hair/Hair_Buns' },
  { name:'Buzzed', slot:'hair',      file:'hair/Hair_Buzzed' },
  { name:'Bald',   slot:'hair',      file:null },
];
const HAIR_COLS   = ['#2b1f18','#4a3122','#7a5230','#b98a4a','#d8cbb0','#8f8f96','#5a2a2a','#2a3350'];
const OUTFIT_COLS = ['#ffffff','#8f4a3a','#4a6a8f','#4a7a52','#7a5a2a','#5a4a6a','#2f2f36','#a08a5a'];
const SKIN_COLS   = ['#ffffff','#f0c9a8','#d9a377','#b57a4d','#8a5a34','#5f3d24'];

/* ── RIGID GEAR ───────────────────────────────────────────────────────────────
   Free plate armour that isn't skinned to our rig, bolted on anyway.

   Why this is legitimate rather than a hack: real plate armour IS rigid. A steel
   cuirass does not deform with the torso, a helm does not deform with the skull.
   So parenting a solid mesh to a bone is physically what armour does. It only
   breaks down for cloth (skirts, capes), which must be skinned.

   The pieces here are loot ICONS from the RPG Items pack — authored to sit in a
   chest, not on a body — so nothing about their scale or offset is meaningful.
   Rather than hand-tune constants (which is what made face placement so fragile:
   any constant is wrong the moment a parent scale changes), every piece is fitted
   by MEASUREMENT at runtime: attach it, look at how wide it actually came out in
   world space, and correct. Offsets are expressed as fractions of the wearer's own
   measured body width, so they survive any change of character or scale. */
const RIGID_GEAR = {
  cuirass:  { file:'gear/Armor_Metal',   bone:/^(spine_03|Torso)$/i, wide:1.06, y: 0.02, z: 0.01 },
  cuirass2: { file:'gear/Armor_Metal2',  bone:/^(spine_03|Torso)$/i, wide:1.06, y: 0.00, z: 0.01 },
  cuirass3: { file:'gear/Armor_Black',   bone:/^(spine_03|Torso)$/i, wide:1.06, y: 0.00, z: 0.01 },
  cuirass4: { file:'gear/Armor_Golden',  bone:/^(spine_03|Torso)$/i, wide:1.06, y: 0.00, z: 0.01 },
  cuirass5: { file:'gear/Armor_Leather', bone:/^(spine_03|Torso)$/i, wide:1.02, y: 0.00, z: 0.01 },
  helm:     { file:'gear/Crown',         bone:/^Head$/i,     wide:0.46, y: 0.10, z: 0.00 },
  helm2:    { file:'gear/Crown2',        bone:/^Head$/i,     wide:0.48, y: 0.10, z: 0.00 },
  shield:   { file:'gear/Shield_Heater', bone:/^(hand_l|FistL)$/i,   wide:0.55, y: 0.00, z: 0.00,
              rot:[0, Math.PI/2, 0] },
  shield2:  { file:'gear/Shield_Round',  bone:/^(hand_l|FistL)$/i,   wide:0.52, y: 0.00, z: 0.00,
              rot:[0, Math.PI/2, 0] },
};

/* The wearer's shoulder width, in world metres.

   Measured from BONES, not from mesh bounds. A SkinnedMesh's geometry.boundingBox is
   the BIND pose — arms straight out — so bounding the mesh returns the arm span, not
   the shoulder width. That read 1.78m on a 1.75m character, which would have scaled
   every breastplate to roughly the size of the whole man. Bone world positions are
   driven by the live animation and have no such problem. */
function bodyWidth(actor){
  let L = null, R = null;
  actor.root.traverse(o => {
    if(!o.isBone) return;
    if(!L && /^(upperarm_l|UpperArmL)$/i.test(o.name)) L = o;
    if(!R && /^(upperarm_r|UpperArmR)$/i.test(o.name)) R = o;
  });
  if(!L || !R) return 0.45;
  actor.root.updateMatrixWorld(true);
  const a = new THREE.Vector3().setFromMatrixPosition(L.matrixWorld);
  const b = new THREE.Vector3().setFromMatrixPosition(R.matrixWorld);
  // shoulder-joint separation is narrower than the body; widen to a torso measure
  return Math.max(0.15, a.distanceTo(b) * 1.35);
}

async function equipRigid(actor, key){
  if(!actor) return;
  unequipRigid(actor, key);
  const C = RIGID_GEAR[key]; if(!C) return;
  const g = await load(`assets/${C.file}.glb`).catch(()=>null);
  if(!g) return;

  let bone = null;
  actor.root.traverse(o => { if(!bone && o.isBone && C.bone.test(o.name)) bone = o; });
  if(!bone) return;

  const piece = new THREE.Group();
  g.scene.traverse(o => {
    if(!o.isMesh) return;
    const m = new THREE.Mesh(o.geometry, relight(o.material.clone()));
    m.castShadow = true; m.receiveShadow = true;
    m.userData._gear = true;
    o.updateWorldMatrix(true, false);
    m.applyMatrix4(o.matrixWorld);          // bake the prop's own internal transform
    piece.add(m);
  });
  if(!piece.children.length) return;

  // Recentre the prop on its own bounding box, so 'position' means what it says
  // rather than being offset by wherever the artist happened to place the origin.
  const local = new THREE.Box3().setFromObject(piece);
  const mid = local.getCenter(new THREE.Vector3());
  for(const c of piece.children) c.position.sub(mid);

  if(C.rot) piece.rotation.set(C.rot[0], C.rot[1], C.rot[2]);
  bone.add(piece);
  actor.root.updateMatrixWorld(true);

  // MEASURE, then correct. We do not predict what the nested bone/bind/model scales
  // will do to this mesh — we attach it, look at the result in world space, and
  // divide. That makes the fit independent of every transform above it.
  const target = bodyWidth(actor) * C.wide;
  const now = new THREE.Box3().setFromObject(piece);
  const w = Math.max(1e-4, now.max.x - now.min.x);
  piece.scale.multiplyScalar(target / w);

  // Same trick for placement: nudge in WORLD metres, converted into bone-local space.
  actor.root.updateMatrixWorld(true);
  const off = new THREE.Vector3(0, C.y || 0, C.z || 0);
  if(off.lengthSq() > 0){
    const inv = new THREE.Matrix4().copy(bone.matrixWorld).invert();
    const o0 = new THREE.Vector3(0,0,0).applyMatrix4(bone.matrixWorld);
    const o1 = o0.clone().add(off);
    piece.position.copy(o1.applyMatrix4(inv));
  }
  (actor._rigid = actor._rigid || {})[key] = piece;
  return piece;
}
function unequipRigid(actor, key){
  const p = actor && actor._rigid && actor._rigid[key];
  if(!p) return;
  if(p.parent) p.parent.remove(p);
  delete actor._rigid[key];
}

function tintMats(actor, matchName, hex){
  if(!actor) return;
  const col = new THREE.Color(hex);
  actor.root.traverse(o => {
    if(!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for(const m of mats){
      if(!m || !m.name || !matchName.test(m.name)) continue;
      if(!m.userData._baseCol) m.userData._baseCol = m.color ? m.color.clone() : new THREE.Color('#fff');
      if(m.color){ m.color.copy(col); m.needsUpdate = true; }
    }
  });
}
async function applyCustom(){
  if(!hero) return;
  const st = HAIR_STYLES[CUSTOM.hair] || HAIR_STYLES[0];
  unequipPart(hero, 'hair');
  if(st.file){ EQUIP_SLOTS.hair = st.file; await equipPart(hero, 'hair'); }
  unequipPart(hero, 'beard');
  if(CUSTOM.beard){ await equipPart(hero, 'beard'); }
  tintMats(hero, /hair/i,            CUSTOM.hairCol);
  tintMats(hero, /ranger|peasant|MI_Ranger|MI_Peasant/i, CUSTOM.outfitCol);
  tintMats(hero, /regular|superhero/i, CUSTOM.skinCol);
}
function buildCustomPanel(){
  const el = document.getElementById('custom'); if(!el) return;
  const sec = (title, inner) => `<h4>${title}</h4><div class="row">${inner}</div>`;
  const opts = (list, cur, act) => list.map((o,i)=>
    `<button class="opt${i===cur?' sel':''}" data-act="${act}" data-i="${i}">${o.name||o}</button>`).join('');
  const sws = (list, cur, act) => list.map(c=>
    `<button class="sw${c===cur?' sel':''}" style="background:${c}" data-act="${act}" data-c="${c}"></button>`).join('');
  el.innerHTML =
    sec('Hair style', opts(HAIR_STYLES, CUSTOM.hair, 'hair')) +
    sec('Hair colour', sws(HAIR_COLS, CUSTOM.hairCol, 'hairCol')) +
    sec('Outfit tint', sws(OUTFIT_COLS, CUSTOM.outfitCol, 'outfitCol')) +
    sec('Skin tone',  sws(SKIN_COLS, CUSTOM.skinCol, 'skinCol')) +
    sec('Extras', `<button class="opt${CUSTOM.beard?' sel':''}" data-act="beard">Beard</button>`) +
    sec('Class preset', Object.keys(CLASS_LOOKS).map(k=>
      `<button class="opt${CUSTOM.look===k?' sel':''}" data-act="look" data-k="${k}">${CLASS_LOOKS[k].label}</button>`).join('')) +
    sec('Armour slots', ARMOUR_SLOTS.map(k=>
      `<button class="opt${(hero&&hero._equip&&hero._equip[k])?' sel':''}" data-act="equip" data-k="${k}">${k}</button>`).join('')) +
    sec('Plate (rigid)', Object.keys(RIGID_GEAR).map(k=>
      `<button class="opt${(hero&&hero._rigid&&hero._rigid[k])?' sel':''}" data-act="rigid" data-k="${k}">${k}</button>`).join(''));
  el.querySelectorAll('button').forEach(b => b.onclick = async () => {
    const a = b.dataset.act;
    if(a==='hair'){ CUSTOM.hair = +b.dataset.i; await applyCustom(); }
    else if(a==='beard'){ CUSTOM.beard = !CUSTOM.beard; await applyCustom(); }
    else if(a==='look'){ await applyClassLook(b.dataset.k); return; }
    else if(a==='equip'){ const k=b.dataset.k;
      if(hero && hero._equip && hero._equip[k]) unequipPart(hero,k);
      else { EQUIP_SLOTS[k] = armourFile(k); await equipPart(hero,k); }
      await applyCustom(); }
    else if(a==='rigid'){ const k=b.dataset.k;
      if(hero && hero._rigid && hero._rigid[k]) unequipRigid(hero,k);
      else await equipRigid(hero,k); }
    else { CUSTOM[a] = b.dataset.c; await applyCustom(); }
    buildCustomPanel();
  });
}

/* ─────────────  FACES  ─────────────
   The Quaternius atlases have NO facial features painted anywhere — the characters are
   deliberately blank-faced, and their UVs are scattered across the sheet so painting a
   face into the texture isn't reliable. So we build one from geometry and bind it to
   the head bone, which means it animates with the character. */
/* Paint the face INTO THE TEXTURE.
   Geometry eyes were a mistake: they read fine head-on but protrude as visible blobs
   from any other angle, because a flat feature set can't follow a curved skull. Painted
   pixels are part of the surface, so they cannot float, cannot poke through, and cost
   nothing to render.
   The trick is finding WHERE on the atlas the face lives: we take the head mesh's
   front-facing vertices, and for each feature's 3D position we look up the UV of the
   nearest vertex. That maps a point on the model to a point on the texture. */
/* Face as a FLAT DECAL on the head plane.
   Two dead ends got us here, both worth recording:
     - Sphere/box features PROTRUDE. They read fine head-on but from any other angle they
       are visibly detached blobs floating off the skull.
     - Painting into the texture is IMPOSSIBLE on these models: they are flat-shaded atlas
       samplers whose head UVs span the whole sheet (u .002-.990, v .035-.998), so each
       polygon grabs one solid swatch. There is no contiguous face region to draw on.
   What works: these heads are flat-fronted low-poly, so a single ZERO-THICKNESS quad laid
   on the face plane and aligned to its normal has no volume to stick out, and carries the
   whole face as one drawn texture. */
function faceDecalTexture(opt){
  const S = 256;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.clearRect(0,0,S,S);
  const eyeY = S*0.42, eyeDX = S*0.20, R = S*0.085;
  const drawEye = (cx) => {
    x.fillStyle = opt.sclera || '#f6f2e8';
    x.beginPath(); x.ellipse(cx, eyeY, R*1.15, R*0.86, 0, 0, Math.PI*2); x.fill();
    x.fillStyle = opt.pupil || '#1d1712';
    x.beginPath(); x.ellipse(cx, eyeY + R*0.05, R*0.46, R*0.56, 0, 0, Math.PI*2); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.9)';
    x.beginPath(); x.arc(cx - R*0.24, eyeY - R*0.26, R*0.15, 0, Math.PI*2); x.fill();
  };
  drawEye(S/2 - eyeDX); drawEye(S/2 + eyeDX);
  x.strokeStyle = opt.brow || '#3a2a1c';
  x.lineWidth = R*0.40; x.lineCap = 'round';
  for(const sgn of [-1,1]){
    const cx = S/2 + sgn*eyeDX;
    x.beginPath();
    x.moveTo(cx - R*1.25, eyeY - R*1.65);
    x.lineTo(cx + R*1.15, eyeY - R*1.95);
    x.stroke();
  }
  x.strokeStyle = opt.pupil || '#241c16';
  x.lineWidth = R*0.34;
  x.beginPath(); x.moveTo(S/2 - R*0.85, eyeY + R*2.5); x.lineTo(S/2 + R*0.85, eyeY + R*2.5); x.stroke();
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true;
  return t;
}
let _faceTex = null;
function addFace(actor, opt){
  opt = opt || {};
  if(!FACE.enabled) return;            // off by default — see faceTune({enabled:true})
  if(!actor || actor._face) return;
  const head = findBone(actor, 'head');
  if(!head) return;
  actor.root.updateMatrixWorld(true);

  const toLocal = new THREE.Matrix4().copy(actor.root.matrixWorld).invert();
  const box = new THREE.Box3().setFromObject(actor.root).applyMatrix4(toLocal);
  const H = box.max.y - box.min.y;
  const lo = box.min.y + H*FACE.bandLo, hi = box.min.y + H*FACE.bandHi;
  const SKIP = /(sword|axe|bow|staff|dagger|shield|weapon|pad|pauldron|cape)/i;

  let headMesh = null, best = 0;
  const v = new THREE.Vector3();
  actor.root.traverse(o => {
    if(!o.isMesh || !o.geometry || !o.geometry.attributes.position) return;
    if(SKIP.test(o.name||'')) return;
    const pos = o.geometry.attributes.position; let n = 0;
    const st = Math.max(1, Math.floor(pos.count/600));
    for(let i=0;i<pos.count;i+=st){
      v.fromBufferAttribute(pos,i).applyMatrix4(o.matrixWorld).applyMatrix4(toLocal);
      if(v.y>=lo && v.y<=hi) n++;
    }
    if(n>best){ best=n; headMesh=o; }
  });
  if(!headMesh || !headMesh.geometry.attributes.normal) return;

  // average the front-facing head surface: its centre, its normal, its width
  const pos = headMesh.geometry.attributes.position, nor = headMesh.geometry.attributes.normal;
  const nmat = new THREE.Matrix3().getNormalMatrix(headMesh.matrixWorld);
  const nv = new THREE.Vector3(), acc = new THREE.Vector3(), nAcc = new THREE.Vector3();
  let n = 0, halfW = 0, minY = Infinity, maxY = -Infinity, frontZ = -Infinity;
  for(let i=0;i<pos.count;i++){
    v.fromBufferAttribute(pos,i).applyMatrix4(headMesh.matrixWorld).applyMatrix4(toLocal);
    if(v.y < lo || v.y > hi) continue;
    nv.fromBufferAttribute(nor,i).applyMatrix3(nmat).normalize();
    if(nv.z < 0.45) continue;                        // the flat front plate only
    acc.add(v); nAcc.add(nv); n++;
    halfW = Math.max(halfW, Math.abs(v.x));
    minY = Math.min(minY, v.y); maxY = Math.max(maxY, v.y);
    frontZ = Math.max(frontZ, v.z);
  }
  if(n < 6) return;
  acc.divideScalar(n); nAcc.divideScalar(n).normalize();

  const wide = halfW * 1.65 * (FACE.size / 0.17);
  if(!_faceTex) _faceTex = faceDecalTexture(opt);
  const m = new THREE.Mesh(
    new THREE.PlaneGeometry(wide, wide),
    new THREE.MeshBasicMaterial({ map:_faceTex, transparent:true, depthWrite:false,
      polygonOffset:true, polygonOffsetFactor:-2, polygonOffsetUnits:-2 }));

  // sit ON the front plane, aligned to its normal — zero thickness, so nothing protrudes
  const localPos = new THREE.Vector3(
    acc.x,
    minY + (maxY - minY) * FACE.eyeY + wide*0.06,
    frontZ + 0.0015);
  const worldPos = localPos.applyMatrix4(actor.root.matrixWorld);
  const worldNrm = nAcc.clone().transformDirection(actor.root.matrixWorld).normalize();
  const ws = head.getWorldScale(new THREE.Vector3()).x || 1;
  m.position.copy(head.worldToLocal(worldPos.clone()));
  m.scale.multiplyScalar(1/ws);
  head.add(m);
  m.updateMatrixWorld(true);
  m.lookAt(worldPos.clone().add(worldNrm));          // world-space target, parented first

  actor._face = m;
  return m;
}
function removeFace(actor){
  if(!actor || !actor._face) return;
  const m = actor._face;
  if(m.parent) m.parent.remove(m);
  if(m.geometry) m.geometry.dispose();
  actor._face = null;
}

/* ─────────────  MOB RESKINS  ─────────────
   One base mesh → several genuinely different creatures, for the many Bladefall mobs
   that share a silhouette (rock/ice/marble/iron constructs).

   The catch with these packs: flat-colour models collapse every UV to a single point,
   so a texture map does nothing — every vertex samples one pixel. So we GENERATE UVs
   from object-space position (a cheap triplanar-ish projection), then paint a real
   procedural surface: lava fissures, ice facets, marble veining, corroded iron. That,
   plus per-slot materials, added geometry and emissive light, is a new creature rather
   than a recolour. */
function reprojectUVs(root){
  root.traverse(o => {
    if(!o.isMesh || !o.geometry) return;
    const g = o.geometry;
    if(g.userData._uvFixed) return;
    const pos = g.attributes.position, nor = g.attributes.normal;
    if(!pos) return;
    g.computeBoundingBox();
    const bb = g.boundingBox, sz = new THREE.Vector3().subVectors(bb.max, bb.min);
    const sx = sz.x||1, sy = sz.y||1, sz2 = sz.z||1;
    const uv = new Float32Array(pos.count*2);
    for(let i=0;i<pos.count;i++){
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      let nx=0, ny=1, nz=0;
      if(nor){ nx=Math.abs(nor.getX(i)); ny=Math.abs(nor.getY(i)); nz=Math.abs(nor.getZ(i)); }
      let u, v;
      if(ny >= nx && ny >= nz){ u = (x-bb.min.x)/sx; v = (z-bb.min.z)/sz2; }   // top/bottom
      else if(nx >= nz){        u = (z-bb.min.z)/sz2; v = (y-bb.min.y)/sy; }   // sides
      else {                    u = (x-bb.min.x)/sx;  v = (y-bb.min.y)/sy; }   // front/back
      uv[i*2] = u; uv[i*2+1] = v;
    }
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.userData._uvFixed = true;
  });
}
// procedural surfaces — drawn, not tinted
function surfaceTex(kind, A, B, C){
  const S = 512;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.fillStyle = A; x.fillRect(0,0,S,S);
  const rnd = (() => { let s = 99173; return () => (s = (s*1664525+1013904223)&0x7fffffff)/0x7fffffff; })();

  if(kind === 'lava'){
    // cooled obsidian crust with molten fissures forced through it
    for(let i=0;i<220;i++){                                    // crust mottling
      x.globalAlpha = 0.05+rnd()*0.18; x.fillStyle = B;
      const r = S*(0.01+rnd()*0.06);
      x.beginPath(); x.arc(rnd()*S, rnd()*S, r, 0, 7); x.fill();
    }
    x.globalAlpha = 1;
    for(let f=0; f<16; f++){                                   // branching fissures
      let px = rnd()*S, py = rnd()*S, a = rnd()*7;
      for(let step=0; step<70; step++){
        const w = 5.5*(1-step/70) + 0.6;
        const g = x.createLinearGradient(px-w,py-w,px+w,py+w);
        g.addColorStop(0, C); g.addColorStop(1, B);
        x.fillStyle = g; x.globalAlpha = 0.85;
        x.beginPath(); x.arc(px, py, w, 0, 7); x.fill();
        a += (rnd()-0.5)*0.85; px += Math.cos(a)*5; py += Math.sin(a)*5;
        if(px<0||px>S||py<0||py>S) break;
      }
    }
  } else if(kind === 'ice'){
    // faceted glacial planes + frozen fractures
    for(let i=0;i<80;i++){
      x.globalAlpha = 0.10+rnd()*0.30; x.fillStyle = rnd()<0.5 ? B : C;
      x.beginPath();
      const cx = rnd()*S, cy = rnd()*S, r = S*(0.04+rnd()*0.14), n = 3+((rnd()*3)|0);
      for(let k=0;k<n;k++){ const a=(k/n)*7+rnd()*0.4;
        x[k?'lineTo':'moveTo'](cx+Math.cos(a)*r, cy+Math.sin(a)*r); }
      x.closePath(); x.fill();
    }
    x.globalAlpha = 0.9; x.strokeStyle = C; x.lineWidth = 1.6;
    for(let i=0;i<40;i++){                                     // fracture lines
      x.beginPath(); let px=rnd()*S, py=rnd()*S; x.moveTo(px,py);
      for(let k=0;k<5;k++){ px += (rnd()-0.5)*S*0.22; py += (rnd()-0.5)*S*0.22; x.lineTo(px,py); }
      x.stroke();
    }
  } else if(kind === 'marble'){
    // polished stone with mineral veining
    for(let i=0;i<26;i++){
      x.globalAlpha = 0.10+rnd()*0.2; x.fillStyle = B;
      x.beginPath(); x.arc(rnd()*S, rnd()*S, S*(0.08+rnd()*0.22), 0, 7); x.fill();
    }
    for(let v=0; v<22; v++){                                   // gold/grey veins
      x.globalAlpha = 0.35+rnd()*0.5;
      x.strokeStyle = rnd()<0.35 ? C : B;
      x.lineWidth = 0.8 + rnd()*2.6;
      x.beginPath();
      let px = rnd()*S, py = rnd()*S, a = rnd()*7;
      x.moveTo(px,py);
      for(let k=0;k<26;k++){ a += (rnd()-0.5)*0.8; px += Math.cos(a)*S*0.045; py += Math.sin(a)*S*0.045; x.lineTo(px,py); }
      x.stroke();

      x.beginPath(); x.arc(rnd()*S, rnd()*S, S*(0.004+rnd()*0.05), 0, 7); x.fill();
    }
    x.globalAlpha = 0.4; x.strokeStyle = B; x.lineWidth = 2.5;
    for(let i=0;i<34;i++){                                     // weep streaks
      const px = rnd()*S, py = rnd()*S;
      x.beginPath(); x.moveTo(px,py); x.lineTo(px + (rnd()-0.5)*10, py + S*(0.06+rnd()*0.2)); x.stroke();
    }
    x.globalAlpha = 0.85;
    for(let i=0;i<26;i++){                                     // rivets
      const px=rnd()*S, py=rnd()*S, r=S*0.011;
      const g=x.createRadialGradient(px-r*0.3,py-r*0.3,0,px,py,r);
      g.addColorStop(0,C); g.addColorStop(1,A);
      x.fillStyle=g; x.beginPath(); x.arc(px,py,r,0,7); x.fill();
    }

  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.repeat.set(2.2, 2.2);

}
const _mobTexCache = new Map();
function getSurface(kind, A, B, C){
  const k = [kind,A,B,C].join('|');
  if(!_mobTexCache.has(k)) _mobTexCache.set(k, surfaceTex(kind, A, B, C));
  return _mobTexCache.get(k);
}

function applyMobSkin(actor, key){
  const S = MOB_SKINS[key];
  if(!S || !actor) return;
  reprojectUVs(actor.root);
  actor.root.traverse(o => {
    if(!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    const out = mats.map(m => {
      const n = (m && m.name || '').toLowerCase();
      let d;
      if(n.includes('eye_black'))      d = new THREE.MeshBasicMaterial({ color:'#0a0a0c' });
      else if(n.includes('eye'))       d = new THREE.MeshBasicMaterial({ color:S.eye });
      else if(n.includes('second'))    d = new THREE.MeshStandardMaterial({
        color:S.second.color, emissive:S.second.emissive, emissiveIntensity:S.second.ei,
        roughness:0.75, metalness:0.15 });
      else                             d = new THREE.MeshStandardMaterial({
        map:getSurface(S.main.kind, S.main.A, S.main.B, S.main.C),
        color:'#ffffff', emissive:S.main.emissive, emissiveIntensity:S.main.ei,
        roughness: S.main.kind==='marble' ? 0.35 : S.main.kind==='ice' ? 0.18 : 0.85,
        metalness: S.main.kind==='rust' ? 0.55 : 0.1 });
      if(S.main.kind === 'ice' && !n.includes('eye')){ d.transparent = true; d.opacity = 0.94; }
      return d;
    });
    o.material = out.length === 1 ? out[0] : out;
  });
  // per-creature light
  // no per-mob PointLight: emissive materials + particles carry the read, and a light
  // per enemy scales the shader cost of the whole scene.
  // added geometry: spikes / rings / rivets
  const H = actor.targetH;
  if(S.spikes){
    for(let i=0;i<S.spikes.n;i++){
      const a = (i/S.spikes.n)*Math.PI*2;
      const len = S.spikes.len * (0.65 + Math.random()*0.7);
      const sp = new THREE.Mesh(
        new THREE.ConeGeometry(S.spikes.rad, len, S.spikes.sharp?5:6),
        new THREE.MeshStandardMaterial({ color:S.spikes.color, emissive:S.spikes.glow,
          emissiveIntensity: S.spikes.sharp?0.35:0.55, roughness:0.5,
          transparent:S.spikes.sharp, opacity:S.spikes.sharp?0.9:1 }));
      sp.position.set(Math.cos(a)*H*0.26, H*(0.52 + Math.random()*0.34), Math.sin(a)*H*0.26);
      sp.rotation.set((Math.random()-0.5)*0.9, a, (Math.random()-0.5)*0.9 + 0.3);
      actor.root.add(sp);
    }
  }
  if(S.rings){
    for(let i=0;i<S.rings.n;i++){
      const r = new THREE.Mesh(new THREE.TorusGeometry(H*0.20, H*0.016, 6, 20),
        new THREE.MeshStandardMaterial({ color:S.rings.color, emissive:S.rings.color,
          emissiveIntensity:0.35, metalness:0.7, roughness:0.3 }));
      r.rotation.x = Math.PI/2;
      r.position.y = H*(0.32 + i*0.22);
      actor.root.add(r);
    }
  }
  if(S.rivets){
    for(let i=0;i<10;i++){
      const b = new THREE.Mesh(new THREE.SphereGeometry(H*0.022, 6, 5),
        new THREE.MeshStandardMaterial({ color:'#9aa0a6', metalness:0.85, roughness:0.35 }));
      const a = Math.random()*Math.PI*2;
      b.position.set(Math.cos(a)*H*0.23, H*(0.30+Math.random()*0.5), Math.sin(a)*H*0.23);
      actor.root.add(b);
    }
  }
  actor.mobSkin = S;
}
// ambient particles for skinned mobs (embers rising / frost drifting / steam)
function mobParticles(dt){
  for(const e of enemies){
    if(e.dead || !e.mobSkin || !e.mobSkin.embers) continue;
    const E = e.mobSkin.embers;
    e._emT = (e._emT || 0) + dt;
    if(e._emT < Math.max(0.45, E.rate*3)) continue;
    e._emT = 0;
    const sp = new THREE.Sprite(addMat(E.color, TEX.mote, 0.9));
    const s = E.size || 0.22; sp.scale.setScalar(s);
    sp.position.copy(e.root.position).add(new THREE.Vector3(
      (Math.random()-0.5)*0.7, 0.35 + Math.random()*0.9, (Math.random()-0.5)*0.7));
    scene.add(sp);
    const rise = (E.up==null?1.5:E.up) * (0.6+Math.random()*0.8);
    push({ life:0.95, t:0, step(k, d){
      sp.position.y += rise*d;
      sp.material.opacity = 0.9*(1-k);
      const q = s*(1 + k*0.5); sp.scale.setScalar(q);
    }, done(){ killObj(sp); } });
  }
}

/* ─────────────  FULL REDESIGNS  ─────────────
   Beyond recolouring: these build NEW geometry onto the rig (horns, capes, pauldron
   spikes, orbiting shards, auras) and bind it to real bones so it animates with the
   character, plus paint pattern detail — trim, runes, wear — onto the atlas rather
   than only shifting its hue. This is what "redesign" means vs "retint". */
function findBone(actor, ...names){
  let hit = null;
  actor.root.traverse(o => {
    if(hit || !o.isBone) return;
    const n = (o.name||'').toLowerCase();
    if(names.some(x => n.includes(x))) hit = o;
  });
  return hit;
}
function glowMat(color, opacity){
  return new THREE.MeshBasicMaterial({ color:new THREE.Color(color), transparent:true,
    opacity:opacity==null?1:opacity, blending:THREE.AdditiveBlending, depthWrite:false });
}
function solidMat(color, rough){
  return new THREE.MeshLambertMaterial({ color:new THREE.Color(color) });
}
// paint pattern detail into the atlas: trim bands, rune glyphs, edge wear
function repaintDetailed(srcTex, skin){
  const img = srcTex.image;
  if(!img || !img.width) return srcTex;
  const key = (srcTex.uuid||'') + '|D|' + skin.id;
  if(_skinCache.has(key)) return _skinCache.get(key);
  const cvs = document.createElement('canvas');
  cvs.width = img.width; cvs.height = img.height;
  const ctx = cvs.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(img, 0, 0);
  // base recolour first
  const data = ctx.getImageData(0,0,cvs.width,cvs.height), px = data.data;
  const metal = hexRGB(skin.metal), leather = hexRGB(skin.leather), lift = skin.lift||1;
  for(let i=0;i<px.length;i+=4){
    if(px[i+3] < 8) continue;
    const [h,s,v] = rgb2hsv(px[i],px[i+1],px[i+2]);
    const lum = Math.min(1.9, (0.35 + v*1.25) * lift);
    if(s < 0.20) tintPixel(px,i,metal,lum);
    else if(h>=12 && h<=52 && v<0.52) tintPixel(px,i,leather,lum);
    else { px[i]*=lift; px[i+1]*=lift; px[i+2]*=lift; }
  }
  ctx.putImageData(data,0,0);
  // then PAINT on top — this is the part a hue shift can't do
  const S = cvs.width;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  if(skin.paint === 'runes'){
    ctx.strokeStyle = skin.accent; ctx.lineWidth = S*0.004;
    for(let i=0;i<70;i++){
      const x = Math.random()*S, y = Math.random()*S, r = S*(0.008+Math.random()*0.02);
      ctx.globalAlpha = 0.25 + Math.random()*0.5;
      ctx.beginPath();
      const sides = 3 + ((Math.random()*4)|0);
      for(let k=0;k<sides;k++){
        const a = (k/sides)*Math.PI*2;
        ctx[k?'lineTo':'moveTo'](x+Math.cos(a)*r, y+Math.sin(a)*r);
      }
      ctx.closePath(); ctx.stroke();
    }
  } else if(skin.paint === 'trim'){
    ctx.strokeStyle = skin.accent; ctx.lineWidth = S*0.006;
    for(let i=0;i<46;i++){
      ctx.globalAlpha = 0.3 + Math.random()*0.45;
      const y = Math.random()*S, x = Math.random()*S, w = S*(0.03+Math.random()*0.12);
      ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x+w, y + (Math.random()-0.5)*S*0.02); ctx.stroke();
    }
  } else if(skin.paint === 'astral'){
    for(let i=0;i<260;i++){
      const x = Math.random()*S, y = Math.random()*S, r = S*(0.0015+Math.random()*0.005);
      ctx.globalAlpha = 0.2 + Math.random()*0.7;
      ctx.fillStyle = Math.random()<0.25 ? skin.accent : '#ffffff';
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.fill();
    }
  }
  ctx.restore();
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace; tex.flipY = srcTex.flipY;
  tex.wrapS = srcTex.wrapS; tex.wrapT = srcTex.wrapT; tex.needsUpdate = true;
  _skinCache.set(key, tex);
  return tex;
}
// each redesign returns a list of {obj, bone|null, offset, spin} attachments
const REDESIGNS = {
  // ── WARRIOR → DREAD KNIGHT: horned helm, tattered cape, spiked pauldrons, ember eyes
  dreadknight(actor, sk){
    const out = [];

    const H = actor.targetH;
    // horns

      const horn = new THREE.Mesh(new THREE.ConeGeometry(0.055, 0.34, 7), solidMat('#2a2028'));
      horn.position.set(side*0.10, 0.16, -0.02);

      const tip = new THREE.Mesh(new THREE.ConeGeometry(0.03, 0.10, 6), glowMat(sk.accent, 0.95));
      tip.position.set(side*0.155, 0.30, -0.06); tip.rotation.set(-0.5,0,side*0.55);

    }
    // crown band
    const band = new THREE.Mesh(new THREE.TorusGeometry(0.115, 0.018, 6, 16), solidMat('#3a3040'));
    band.rotation.x = Math.PI/2; band.position.set(0, 0.10, 0);

    for(const side of [-1,1]){

      eye.position.set(side*0.042, 0.03, 0.105);

    }
    // tattered cape (root-attached, sways in update)
    const cape = new THREE.Group();
    for(let i=0;i<7;i++){
      const w = 0.5 - Math.abs(i-3)*0.05;
      const len = 0.95 - Math.abs(i-3)*0.12;
      const strip = new THREE.Mesh(new THREE.PlaneGeometry(w*0.19, len), solidMat(sk.metal));
      strip.position.set((i-3)*0.075, H*0.66 - len/2, -0.13);

      cape.add(strip);
    }
    out.push({ obj:cape, bone:null, sway:true });
    // pauldron spikes
    for(const side of [-1,1]){
      for(let i=0;i<3;i++){

        sp.position.set(side*0.26, H*0.80 + i*0.045, -0.05 + i*0.05);
        sp.rotation.z = side*(0.9 - i*0.12);

  // ── WIZARD → ARCHON: halo, orbiting shards, robe starfield, staff corona
  archon(actor, sk){
    const out = [];
    const H = actor.targetH;

    halo.rotation.x = Math.PI/2;
    out.push({ obj:halo, bone:null, haloY:H*1.10, spin:1.1 });
    const shards = new THREE.Group();
    for(let i=0;i<6;i++){
      const sh = new THREE.Mesh(new THREE.OctahedronGeometry(0.075, 0), glowMat(sk.accent, 0.85));
      const a = (i/6)*Math.PI*2;
      sh.position.set(Math.cos(a)*0.62, 0, Math.sin(a)*0.62);
      sh.userData.a = a;
      shards.add(sh);
    }
    out.push({ obj:shards, bone:null, orbit:true, orbitY:H*0.72 });
    const aura = new THREE.Sprite(addMat(sk.accent, TEX.mote, 0.30));
    aura.scale.set(2.0, 2.0, 1);
    out.push({ obj:aura, bone:null, auraY:H*0.5 });
    return out;
  },
  // ── ROGUE → WRAITHBLADE: shadow shroud, hood-glow, twin trailing ribbons
  wraithblade(actor, sk){
    const out = [];
    const H = actor.targetH;
    const head = findBone(actor, 'head', 'neck');
    for(const side of [-1,1]){
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.024, 8, 6), glowMat(sk.accent, 1));
      eye.position.set(side*0.04, 0.02, 0.10);
      out.push({ obj:eye, bone:head, fallbackY:H*0.9 });
    }
    // shroud: layered dark planes that sway
    const shroud = new THREE.Group();
    for(let i=0;i<9;i++){
      const a = (i/9)*Math.PI*2;
      const p = new THREE.Mesh(new THREE.PlaneGeometry(0.14, 0.8), solidMat('#161320'));
      p.position.set(Math.cos(a)*0.20, H*0.52, Math.sin(a)*0.20);
      p.lookAt(0, H*0.52, 0);
      shroud.add(p);
    }
    out.push({ obj:shroud, bone:null, sway:true });
    // ground shadow pool
    const pool = groundQuad(TEX.mote, sk.accent, 1.5, 0.42);
    out.push({ obj:pool, bone:null, poolY:0.03 });
    // trailing motes
    const trail = new THREE.Group();
    for(let i=0;i<5;i++){
      const m = new THREE.Sprite(addMat(sk.accent, TEX.mote, 0.6));
      m.scale.setScalar(0.28); m.userData.i = i;
      trail.add(m);
    }
    out.push({ obj:trail, bone:null, trail:true, trailY:H*0.55 });
