  ]);

  // ROOM — measure it, scale it to a comfortable arena, sit it at y=0
  const rm = room.scene; prep(rm, { shadow:false });
  let rb = boxOf(rm); let rs = rb.getSize(new THREE.Vector3());
  const target = 26;                                  // metres across
  const rscale = target / Math.max(rs.x, rs.z);
  rm.scale.setScalar(rscale);
  rb = boxOf(rm); rs = rb.getSize(new THREE.Vector3());
  rm.position.y -= rb.min.y;
  rm.position.x -= (rb.min.x + rb.max.x)/2;
  rm.position.z -= (rb.min.z + rb.max.z)/2;
  scene.add(rm);
  roomHalf = Math.min(rs.x, rs.z)/2 - 1.4;

  // a floor plane under everything so there's never a visual hole
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(80,80),
    new THREE.MeshStandardMaterial({ color:'#332c38', roughness:.98 }));
  floor.rotation.x = -Math.PI/2; floor.position.y = -0.02; floor.receiveShadow = true; scene.add(floor);
  buildSafeZone(scene);

  // braziers in the corners of the play space
  const t = roomHalf * 0.74;
  addTorch(-t,-t); addTorch(t,-t); addTorch(-t,t); addTorch(t,t);

  // a couple of gate props for silhouette interest
  if(torchProp){
    const g = torchProp.scene; prep(g);
    const gb = boxOf(g), gs = gb.getSize(new THREE.Vector3());
    g.scale.setScalar(2.6/Math.max(gs.x,gs.y,gs.z));
    const g2 = g.clone();
    g.position.set(0, 0, -roomHalf+0.2);
    g2.position.set(0, 0, roomHalf-0.2); g2.rotation.y = Math.PI;
    scene.add(g, g2);
  }

  // HERO + ENEMY
  lmsg.textContent = 'Loading characters…';
  // Route the STARTING hero through loadRPGChar too. Built directly from the Warrior gltf
  // it only carried that model's own 13 clips, so the first character on screen silently
  // had half the library until you switched class.
  const gW = await loadRPGChar(CLASSES[0]);
  hero = new Actor(gW, CLASSES[0]);
  addFace(hero);
  addEyes(hero); addMouth(hero);
  scene.add(hero.root);
  buildAnimBar();

  lmsg.textContent = 'Dressing the crypt…';
  await scatterProps();

  lmsg.textContent = 'Summoning foes…';
  for(const spot of ENEMY_SPOTS) await spawnEnemy(spot.x, spot.z, spot.m);

  buildClassBar();
  buildSkinBar();
  paintSkillBar();
  buildCustomPanel();
  { const cb = document.getElementById('custBtn');
    if(cb) cb.onclick = () => { const el=document.getElementById('custom');
      el.classList.toggle('hide'); if(!el.classList.contains('hide')) buildCustomPanel(); }; }
  lmsg.textContent = 'Warming shaders…';
  await warmupVFX();

  document.getElementById('load').style.display = 'none';
}

function paintSkillBar(){
  const bar = document.getElementById('skillbar'); if(!bar) return;
  const kit = SKILLS[heroDef.id] || SKILLS.Warrior;
  if(bar.dataset.cls !== heroDef.id){
    bar.dataset.cls = heroDef.id;
    bar.innerHTML = '';
    kit.forEach((S,i) => {
      const b = document.createElement('div');
      b.className = 'skb ready';
      b.innerHTML = `<span class="k">${i+1}</span><span class="n">${S.name}</span><span class="cd"></span>`;
      b.onclick = () => castSkill(i);
      b.addEventListener('pointerdown', e => { e.preventDefault(); castSkill(i); });
      bar.appendChild(b);
    });
  }
  [...bar.children].forEach((b,i) => {
    const S = kit[i]; if(!S) return;
    const cd = b.querySelector('.cd');
    const f = skillCd[i] > 0 ? (skillCd[i] / S.cd) : 0;
    cd.style.transform = 'scaleY(' + f.toFixed(3) + ')';
    b.classList.toggle('ready', f === 0);
  });
}
function buildSkinBar(){
  const bar = document.getElementById('skins');
  if(!bar) return;
  // UAL characters swap OUTFIT MODELS rather than repainting a texture
  if(heroDef.outfits){
    bar.innerHTML = '';
    heroDef.outfits.forEach((o,i) => {
      const b = document.createElement('button');
      b.className = 'sbtn' + (i === (outfitIdx[heroDef.id]||0) ? ' sel' : '');
      b.innerHTML = `<i style="background:${['#6b8f4e','#9a7f52','#c8a888'][i]||'#888'}"></i>${o.name}`;
      b.onclick = async () => {
        if(switching) return;
        outfitIdx[heroDef.id] = i;
        [...bar.children].forEach((c,j)=>c.classList.toggle('sel', j===i));
        const d = heroDef; heroDef = { id:'__reload' };   // force switchClass to re-run
        await switchClass(d);
      };
      bar.appendChild(b);
    });
    return;
  }
  const list = SKINS[heroDef.id] || [];
  bar.innerHTML = '';
  list.forEach((sk, i) => {
    const b = document.createElement('button');
    b.className = 'sbtn' + (i === skinIdx[heroDef.id] ? ' sel' : '');
    b.innerHTML = `<i style="background:${sk.stock ? '#5a5f6b' : sk.metal}"></i>${sk.name}`;
    b.onclick = () => {
      skinIdx[heroDef.id] = i;
      applySkin(hero, heroDef.id, sk);
      [...bar.children].forEach((c,j) => c.classList.toggle('sel', j === i));
    };
    bar.appendChild(b);
  });
}
function buildClassBar(){
  const bar = document.getElementById('classes');
  bar.innerHTML = '';
  for(const c of CLASSES){
    const b = document.createElement('button');
    b.className = 'cbtn' + (c.id===heroDef.id ? ' sel' : '');
    b.textContent = c.label; b.dataset.id = c.id;
    b.onclick = () => switchClass(c);
    bar.appendChild(b);
  }
}
let switching = false;
async function switchClass(def){
  if(def.id === heroDef.id || !hero || switching) return;
  switching = true;
  document.querySelectorAll('.cbtn').forEach(b=>b.disabled = true);
  // IMPORTANT: re-LOAD rather than .clone(). Cloning a glTF rigs the copy's SkinnedMesh
  // to the ORIGINAL skeleton, so the body collapses out of view while bone-parented props
  // (shoulder pads, sword, hair) keep rendering — the "invisible character" bug. The file
  // is HTTP-cached, so a fresh parse is cheap and gives a correctly-bound skeleton.
  const g = def.mixamo ? await loadMixamoChar(def)
          : def.ual     ? await loadBaseChar(def)
                        : await loadRPGChar(def);
  if(g){
    const pos = hero.root.position.clone(), rot = hero.root.rotation.y;
    clearRedesign();
    scene.remove(hero.root);
    disposeTree(hero.root);
    hero = new Actor(g, def);
    if(def.ual){ equipPart(hero, 'brows'); applyCustom(); }
    addFace(hero);
    hero.root.position.copy(pos); hero.root.rotation.y = rot;
    scene.add(hero.root);
    heroDef = def;
    applySkin(hero, def.id, (SKINS[def.id]||[])[skinIdx[def.id]||0]);
    console.log('DIAG eyes ' + def.id + ' ' + JSON.stringify(addEyes(hero)) +
                ' mouth ' + JSON.stringify(addMouth(hero)));
    equipWeapon(hero).then(r => console.log('DIAG weapon ' + JSON.stringify(r)));
    if(window.__eyeRebuild) window.__eyeRebuild();
    buildAnimBar();
    buildSkinBar();
    paintSkillBar();
    buildCustomPanel();
  }
  document.querySelectorAll('.cbtn').forEach(b=>{
    b.disabled = false; b.classList.toggle('sel', b.dataset.id===heroDef.id);
  });
  switching = false;
}
function disposeTree(root){
  root.traverse(o => {
    if(!o.isMesh) return;
    if(o.geometry) o.geometry.dispose();
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for(const m of mats){ if(m) m.dispose(); }
  });
}

/* ─────────────  LOOP  ───────────── */
const camTarget = new THREE.Vector3();
let fpsT = 0, frames = 0, perfOn = false, worstMs = 0, lastMs = performance.now(), perfT = 0;
const fpsEl = document.getElementById('fps');

function tick(){
  requestAnimationFrame(tick);
  const dt = Math.min(0.05, clock.getDelta());
  const t  = clock.elapsedTime;

  if(hurtCd > 0) hurtCd -= dt;
  for(let i=0;i<4;i++) if(skillCd[i] > 0){ skillCd[i] = Math.max(0, skillCd[i]-dt); /* bar repaints on its own throttle */ }
  if(camShake > 0) camShake = Math.max(0, camShake - dt*2.4);

  if(hero){
    // ── movement ──
    const dir = moveDir();
    const sprint = keys.ShiftLeft || keys.ShiftRight || touchVec.length() > 0.86;
    const speed = sprint ? 5.6 : 3.0;

    if(rollT > 0){
      rollT -= dt;
      const rs = 7.4 * Math.max(.25, rollT/0.62);
      vel.copy(rollDir).multiplyScalar(rs);
    } else if(dir.lengthSq() > 0.004){
      vel.lerp(dir.clone().multiplyScalar(speed), 0.22);
      const want = Math.atan2(dir.x, dir.z);
      let d = want - hero.root.rotation.y;
      while(d >  Math.PI) d -= Math.PI*2;
      while(d < -Math.PI) d += Math.PI*2;
      hero.root.rotation.y += d * Math.min(1, dt*14);
    } else {
      vel.multiplyScalar(0.80);
    }
    hero.root.position.addScaledVector(vel, dt);

    // ── gravity / jump ──
    vy -= GRAV * dt;
    hero.root.position.y += vy * dt;
    if(hero.root.position.y <= 0){ hero.root.position.y = 0; vy = 0; grounded = true; }
    else grounded = false;

    // keep inside the room
    hero.root.position.x = Math.max(-roomHalf, Math.min(roomHalf, hero.root.position.x));
    hero.root.position.z = Math.max(-roomHalf, Math.min(roomHalf, hero.root.position.z));

    // ── animation state ──
    if(hero.swingT > 0) hero.swingT -= dt;
    if(rollT <= 0 && hero.locked <= 0){
      const sp = vel.length();
      if(!grounded)     hero.play('jump', { speed: 1.0 });   // falls back to a run/idle pose if the rig has no jump clip
      else if(sp > 3.6) hero.play('run',  { speed: 1.0 });
      else if(sp > 0.5) hero.play('walk', { speed: Math.max(.75, sp/2.4) });
      else              hero.play('idle');
    }
    hero.update(dt);

    // ── camera ──
    camTarget.copy(hero.root.position).add(new THREE.Vector3(0, 1.15, 0));
    const cp = Math.cos(camPitch), sp2 = Math.sin(camPitch);
    camera.position.lerp(new THREE.Vector3(
      camTarget.x + Math.sin(camYaw) * camDist * cp,
      camTarget.y + camDist * sp2,
      camTarget.z + Math.cos(camYaw) * camDist * cp
    ), Math.min(1, dt*9));
    if(camShake > 0){
      camera.position.x += (Math.random()-.5)*camShake*0.34;
      camera.position.y += (Math.random()-.5)*camShake*0.26;
      camera.position.z += (Math.random()-.5)*camShake*0.34;
    }
    camera.lookAt(camTarget);
    heroLamp.position.copy(hero.root.position).add(new THREE.Vector3(0, 2.0, 0));
  }

  { const tag = document.getElementById('safeTag');
    if(tag) tag.style.display = (hero && inSafeZone(hero.root.position)) ? 'block' : 'none'; }
  for(const e of enemies){
    e.update(dt);
    if(e.dead){ e.root.position.y = Math.max(-0.4, e.root.position.y - dt*0.6); continue; }
    if(e.def2 && e.def2.flyY){                                   // bob in the air
      e.root.position.y = e.def2.flyY + Math.sin(t*2 + e.root.position.x)*0.14;
    }   // sink as it dies
    if(e.locked <= 0) e.play('idle');
    if(e.hitFlash > 0) e.hitFlash -= dt;
    if(hero){                                            // face the player, and close in when near — feels alive
      const dx = hero.root.position.x - e.root.position.x;
      const dz = hero.root.position.z - e.root.position.z;
      const dist = Math.hypot(dx, dz);
      const want = Math.atan2(dx, dz);
      let d = want - e.root.rotation.y;
      while(d >  Math.PI) d -= Math.PI*2;
      while(d < -Math.PI) d += Math.PI*2;
      e.root.rotation.y += d * Math.min(1, dt*3.6);
      const spd = (e.def2 && e.def2.speed) || 1.5;
      const safe = inSafeZone(hero.root.position);
      if(!safe && dist < 10 && dist > 1.7 && e.locked <= 0){   // stalk the player
        e.root.position.x += (dx/dist) * spd * dt;
        e.root.position.z += (dz/dist) * spd * dt;
        e.play(spd > 2.2 ? 'run' : 'walk', { speed:.95 });
      }
      // ...and swing once in reach
      e.swingCd -= dt;
      if(!safe && dist <= 2.0 && e.locked <= 0 && e.swingCd <= 0){
        e.swingCd = 1.5 + Math.random()*1.2;
        e.once('attack', 1.0);
        setTimeout(() => {                                 // connect mid-swing
          if(e.dead || !hero) return;
          const d2 = Math.hypot(hero.root.position.x - e.root.position.x,
                                hero.root.position.z - e.root.position.z);
          if(d2 <= 2.4 && rollT <= 0 && !inSafeZone(hero.root.position))
            hurtHero((e.def2 && e.def2.dmg) || 7);
        }, 320);
      }
    }
  }

  // floating damage numbers rise and fade
  for(let i=dmgTexts.length-1; i>=0; i--){
    const d = dmgTexts[i]; d.t += dt;
    d.spr.position.y += d.vy * dt; d.vy = Math.max(0.2, d.vy - dt*1.8);
    const o = Math.max(0, 1 - d.t/d.life);
    d.spr.children.forEach(c => { c.material.opacity = o; });
    if(d.t >= d.life){
      scene.remove(d.spr);
      d.spr.children.forEach(c => c.material.dispose());   // map is shared, never disposed
      dmgTexts.splice(i,1);
    }
  }

  // torch + brazier flicker
  for(const tc of torches.concat(braziers)){
    const f = 0.72 + Math.sin(t*11 + tc.seed)*0.14 + Math.sin(t*27 + tc.seed*2)*0.08 + Math.random()*0.06;
    if(tc.li) tc.li.intensity = tc.base * f;
    tc.flame.scale.setScalar(0.85 + f*0.3);
    tc.flame.rotation.y += 2.4*dt;
  }

  tryOpenChests();
  mobParticles(dt);
  _sbT += dt;
  updateRedesign(t, dt);
  if(_sbT > 0.08){ _sbT = 0; paintSkillBar(); }
  stepVFX(dt);
  renderer.render(scene, camera);

  // frame-time watch: a stall shows as one huge frame, which an fps average hides
  { const now = performance.now(); const ms = now - lastMs; lastMs = now;
    if(ms > worstMs) worstMs = ms; }
  frames++; fpsT += dt; perfT += dt;
  if(fpsT >= 0.5){ fpsEl.textContent = Math.round(frames/fpsT) + ' fps'; frames = 0; fpsT = 0; }
  if(perfOn && perfT >= 0.25){
    perfT = 0;
    const I = renderer.info, cls = worstMs > 60 ? ' class="bad"' : '';
    let live = 0; scene.traverse(o=>{ if(o.isLight && o.visible && o.intensity > 0) live++; });
    document.getElementById('perf').innerHTML = [
      'fps      <b>' + Math.round(1/Math.max(0.0001,dt)) + '</b>',
      'worst    <span' + cls + '>' + worstMs.toFixed(0) + ' ms</span>',
      'draws    <b>' + I.render.calls + '</b>',
      'tris     ' + Math.round(I.render.triangles/1000) + 'k',
      'geoms    ' + I.memory.geometries,
      'textures ' + I.memory.textures,
      'programs ' + (I.programs ? I.programs.length : '?'),
      'lights   ' + live,
      'vfx      ' + vfx.length,
    ].join('<br>');
    worstMs = 0;
  }
}

function resize(){
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false);
}
addEventListener('resize', resize); resize();

    const rows = [];
    hero.root.traverse(o => {
      if(!o.isMesh) return;
      const m = Array.isArray(o.material) ? o.material[0] : o.material;
      rows.push({
        mesh: o.name || '(unnamed)', type: o.type,
        mat: m ? m.type : 'none',
        map: m && m.map ? (m.map.image ? `${m.map.image.width}x${m.map.image.height}` : 'no-image') : 'NONE',
        color: m && m.color ? '#'+m.color.getHexString() : '-',
        visible: o.visible, opacity: m ? m.opacity : '-',
        scale: +o.getWorldScale(new THREE.Vector3()).y.toFixed(3)
      });
    });
    return { cls: heroDef.id, heightM: +new THREE.Box3().setFromObject(hero.root).getSize(new THREE.Vector3()).y.toFixed(3), rows };
  }
};

build().then(tick).catch(err => {
  lmsg.textContent = 'Load failed: ' + err.message;
  console.error(err);
});
</script>
</body>
</html>
