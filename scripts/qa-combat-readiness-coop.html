<!doctype html><meta charset="utf-8"><title>Campaign boss co-op checks</title>
<style>body{background:#172b3b;color:#fff;font:14px system-ui}button{padding:10px}iframe{width:48%;height:340px}pre{white-space:pre-wrap}textarea{width:95%;height:50px}</style>
<h1>Eight boss encounters: real co-op handlers</h1><button id="run">Check boss co-op</button><pre id="result">Ready</pre><textarea id="evidence" aria-label="Evidence JSON"></textarea>
<iframe id="host" title="Host" src="/3d/.qa-combat-current.html?mute=1"></iframe><iframe id="guest" title="Guest" src="/3d/.qa-combat-current.html?mute=1"></iframe>
<script>
document.getElementById('run').onclick=async()=>{
 const out=document.getElementById('result'),results=[],h=host.contentWindow,g=guest.contentWindow,wait=ms=>new Promise(r=>setTimeout(r,ms));let hb,gb;
 document.getElementById('run').disabled=true;
 try{
  while(!h.combatQA||!g.combatQA)await wait(100);
  for(let z=0;z<8;z++){
   hb=await h.combatQA.fresh(z,'warrior');gb=await g.combatQA.fresh(z,'ranger');const hq=[],gq=[],handlers={},checks=[],ok=(name,value)=>{checks.push({name,pass:!!value});if(!value)throw Error('Boss '+z+': '+name);};
   Object.assign(hb.MP,{active:true,isHost:true,myId:'h',zone:z,conns:[]});hb.MP.onEnter(z);hb.MP.wireGuest({open:true,send:d=>hq.push(JSON.parse(JSON.stringify(d))),on:(k,f)=>handlers[k]=f});handlers.open();
   Object.assign(gb.MP,{active:true,isHost:false,myId:'g',zone:z,hostConn:{open:true,send:d=>gq.push(JSON.parse(JSON.stringify(d)))}});
   const flush=()=>{for(let j=0;j<4;j++){for(const p of gq.splice(0))handlers.data(p);for(const p of hq.splice(0))gb.MP.onGuestData(p);}},broadcast=()=>{hb.MP.broadcast();flush();};
   handlers.data({t:'hello',p:gb.MP.selfState()});flush();await wait(100);flush();
   ok('same boss area',gb.G.zone===z&&gb.G.area===-1&&gb.G.enemies.some(e=>e.mid===hb.G.boss.mid&&e.type===hb.G.boss.type));
   const he=hb.G.boss,ge=gb.G.enemies.find(e=>e.mid===he.mid);const start={x:hb.G.p.x,y:hb.G.p.y,z:hb.G.p.z};
   g.combatQA.place(gb,he.x+150,he.z,he.y);gb.MP.hostConn.send({t:'pos',p:gb.MP.selfState()});flush();
   if(z<3){h.combatQA.place(hb,he.x+2500,he.z,he.y);he.active=false;he.dropT=.01;h.combatQA.pump(hb,15);h.combatQA.place(hb,start.x,start.z,start.y);ok('guest arrival activates host boss',he.active);broadcast();ok('activation reaches guest',ge.active);}
   const damage=he.dmg;hb.syncCampaignPartyHealth();broadcast();ok('co-op increases HP without multiplying damage',he.partyHealthMul>1&&he.partyHealthMul<2&&he.dmg===damage);
   if(z===5){const arena=hb.G.hydraArena;arena.attackDamage+=1;arena.revision++;broadcast();ok('Hydra attack damage replicated '+JSON.stringify({host:arena.attackDamage,guest:gb.G.hydraArena.attackDamage,hostEpoch:hb.briarPacket()?.epoch,guestEpoch:gb.briarPacket()?.epoch,hostRevision:arena.revision,guestRevision:gb.G.hydraArena.revision}),gb.G.hydraArena.attackDamage===arena.attackDamage);const damage=arena.attackDamage;for(const e of [...hb.G.enemies])hb.killEnemy(e);hb.updateHydra(.05);broadcast();gb.updateHydra(.05);ok('Hydra mercy exit shared',gb.G.hydraArena.freed&&gb.G.hydraArena.broken.length===3&&!!gb.G.portal);const paid=gb.meta.gold;broadcast();gb.updateHydra(.05);ok('Hydra guest reward once',gb.meta.gold===paid);ok('Hydra damage independent of party HP',arena.attackDamage===damage);}
   else{
    const keys=[['bruteState','bruteClock'],['markState','markClock'],['fallState','fallClock'],['offState','offClock'],['fcState','fcClock'],[],['mcState','mcClock'],['akState','akClock']][z];
    // Staged warning isolates snapshot replication and authority from full-fight skill.
    he[keys[0]]='wind';he[keys[1]]=.7;he.active=true;he.dropT=0;broadcast();ok('warning phase replicated',ge[keys[0]]==='wind');const clock=ge[keys[1]];g.combatQA.pump(gb,4);ok('guest does not invent boss phases',ge[keys[0]]==='wind'&&ge[keys[1]]===clock);
   }
   results.push({z,checks});hb.MP.active=false;gb.MP.active=false;hb.MP.conns=[];gb.MP.conns=[];out.textContent=JSON.stringify(results.map(r=>({z:r.z,checks:r.checks.length})),null,2);
  }
  evidence.value=JSON.stringify({results,transport:'Production host/guest handlers with locally serialized packets; not an internet/WebRTC latency test.',errors:[...h.combatQA.errors,...g.combatQA.errors]});out.textContent='PASS '+results.reduce((n,r)=>n+r.checks.length,0)+' assertions across eight encounters.';
 }catch(e){out.textContent='FAIL '+e.stack;evidence.value=JSON.stringify({results,error:e.message,errors:[...(h.combatQA?.errors||[]),...(g.combatQA?.errors||[])]});}
 finally{for(const b of [hb,gb])if(b){b.MP.active=false;b.MP.conns=[];}document.getElementById('run').disabled=false;}
};
</script>
