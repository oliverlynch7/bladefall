<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bladefall — Save recovery</title><style>body{margin:0;min-height:100dvh;display:grid;place-items:center;background:#15222c;color:#f6ead2;font:18px/1.6 system-ui}main{max-width:520px;padding:28px}h1{line-height:1.2}button,a{font:inherit;padding:12px 20px;border-radius:9px;display:inline-block}button{background:#ecaa43;color:#21180d;border:0;cursor:pointer}a{color:#ffe0a0}#result{color:#ffe0a0}</style><main><h1>Save recovery</h1><p>If an old save stops Bladefall from opening, you can start fresh here.</p><p>This clears all three character slots and dungeon saves in this browser. It does not affect other players.</p><button id="resetSaves">Reset Bladefall saves</button><p id="result" role="status"></p><a id="returnGame" href="./?recovered=1">Return to Bladefall</a></main><script>
document.getElementById('resetSaves').onclick=()=>{try{const keys=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith('bladefall3d_')||k==='bladefall_v1'||k==='bf3_slot')keys.push(k);}for(const k of keys)localStorage.removeItem(k);for(const p of ['','s1_','s2_']){localStorage.setItem('bladefall3d_'+p+'generation',Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));localStorage.setItem('bladefall3d_'+p+'global','{}');}localStorage.setItem('bf3_slot','0');const sk=[];for(let i=0;i<sessionStorage.length;i++){const k=sessionStorage.key(i);if(k.startsWith('bf3_'))sk.push(k);}sk.forEach(k=>sessionStorage.removeItem(k));document.getElementById('result').textContent='Saves cleared. You can create a new character now.';document.getElementById('resetSaves').disabled=true;}catch(e){document.getElementById('result').textContent='Browser storage is unavailable. Allow site storage, then retry.';}};
</script></html>
