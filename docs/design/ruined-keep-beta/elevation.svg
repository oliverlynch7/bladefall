<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="Side view of cargo lift, counterweight service stop and separated refuge"><style>text{font-family:Arial,sans-serif;fill:#e7edf1;font-size:15px}.head{font-size:20px;font-weight:700;fill:#efca81}.small{font-size:12px;fill:#bacbd5}</style><rect width="100%" height="100%" fill="#121d27"/><text class="head" x="25" y="34">ELEVATION · one mechanism, two uses</text><path d="M30 335H460 M460 110H660 M720 225H925" fill="none" stroke="#8298a8" stroke-width="14"/><path d="M460 335V75H670V335" fill="none" stroke="#d8c394" stroke-width="5"/><rect x="435" y="315" width="120" height="20" fill="#d7aa58"/><rect x="630" y="206" width="80" height="20" fill="#99d6cc"/><path d="M490 292V135" stroke="#efca81" stroke-width="5" stroke-dasharray="9 8"/><text x="30" y="315">Lower cells / loading</text><text x="460" y="96">Upper dock → refuge</text><text x="740" y="205">Service gallery</text><text x="550" y="269">Lift ↑</text><text x="720" y="280">Counterweight ↓</text><text class="small" x="30" y="375">Diagram shows separated heights, not simultaneous positions: the cage meets the gallery at mid-stop.</text><text class="small" x="30" y="398">Lift low → weight high. Both mid → service bridge. Lift high → weight low. Upper dock requires snag cleared.</text></svg>