<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1080" role="img" aria-label="Three-floor overhead proposal. Lower cells and lift; isolated service puzzle; upper refuge and boss approach."><style>text{font-family:Arial,sans-serif;fill:#e7edf1;font-size:15px}.head{font-size:20px;font-weight:700;fill:#efca81}.small{font-size:12px;fill:#bacbd5}</style><rect width="100%" height="100%" fill="#121d27"/><text class="head" x="26" y="34">OVERHEAD PLAN · north ↑ · adjacency and floor separation</text><text class="small" x="26" y="59">Not a construction drawing. Room dimensions and jump gaps are tested in the plain 3D prototype.</text><text class="head" x="26" y="101">LOWER FLOOR · elevation 0</text><path d="M 190 169 H 320 M 410 210 V 270 H 265 M 265 315 H 440 M 500 315 H 920 V 210" fill="none" stroke="#efca81" stroke-width="9"/><path d="M 490 170 H 790" fill="none" stroke="#99d6cc" stroke-width="9"/><rect x="25" y="125" width="170" height="85" rx="7" fill="#315361" stroke="#85a6b5"/><text x="37" y="155" font-weight="bold">A · Intake</text><text class="small" x="37" y="179">Entry from Broken Walls</text><rect x="320" y="125" width="185" height="85" rx="7" fill="#315361" stroke="#85a6b5"/><text x="332" y="155" font-weight="bold">B · Guard desk</text><text class="small" x="332" y="179">Cells visible beyond bars</text><rect x="685" y="125" width="240" height="85" rx="7" fill="#315361" stroke="#85a6b5"/><text x="697" y="155" font-weight="bold">D · Winch room</text><text class="small" x="697" y="179">Visible load + chain diagram</text><rect x="25" y="270" width="240" height="95" rx="7" fill="#315361" stroke="#85a6b5"/><text x="37" y="300" font-weight="bold">C · Holding cells</text><text class="small" x="37" y="324">Walter, captives; Sly nearby</text><rect x="440" y="270" width="170" height="95" rx="7" fill="#605032" stroke="#85a6b5"/><text x="452" y="300" font-weight="bold">L · Cargo lift</text><text class="small" x="452" y="324">Lower loading dock</text><text class="small" x="670" y="275">E · Maintenance climb ↑</text><text class="small" x="670" y="295">Broken ledges to service floor</text><text class="small" x="290" y="349">Clear escort lane</text><text class="small" x="35" y="398">Gold: rescue movement. Teal: player preparation route. Machinery is adjacent to the lift.</text><text class="head" x="26" y="445">SERVICE FLOOR · elevation +3 · isolated from refuge</text><path d="M 795 544 H 670 M 595 544 H 535" fill="none" stroke="#99d6cc" stroke-width="9" stroke-dasharray="12 8"/><rect x="735" y="493" width="190" height="95" rx="7" fill="#315361" stroke="#85a6b5"/><text x="747" y="523" font-weight="bold">E · Broken access</text><text class="small" x="747" y="547">Climb from winch room</text><rect x="590" y="510" width="85" height="70" rx="7" fill="#605032" stroke="#85a6b5"/><text x="602" y="540" font-weight="bold">W</text><text class="small" x="602" y="564">Weight cage</text><rect x="300" y="493" width="235" height="95" rx="7" fill="#315361" stroke="#85a6b5"/><text x="312" y="523" font-weight="bold">F · Brake gallery</text><text class="small" x="312" y="547">Remove visible chain snag</text><text class="small" x="309" y="613">No door or stair from here to the upper refuge.</text><text class="small" x="560" y="638">W bridges the gap only at the service stop.</text><text class="small" x="35" y="669">Dashed teal: deliberate jumps. The cage locks while occupied; it is not a moving co-op trap.</text><text class="head" x="26" y="721">UPPER FLOOR · elevation +6</text><path d="M 525 905 V 826 H 260 M 260 780 V 755" fill="none" stroke="#efca81" stroke-width="9"/><rect x="440" y="870" width="170" height="85" rx="7" fill="#605032" stroke="#85a6b5"/><text x="452" y="900" font-weight="bold">L · Cargo lift</text><text class="small" x="452" y="924">Same shaft; upper dock</text><rect x="170" y="765" width="240" height="90" rx="7" fill="#315361" stroke="#85a6b5"/><text x="182" y="795" font-weight="bold">G · Refuge</text><text class="small" x="182" y="819">Protected arrival; beta ends</text><rect x="665" y="765" width="260" height="90" rx="7" fill="#343b45" stroke="#85a6b5"/><text x="677" y="795" font-weight="bold">H · Release hall →</text><text class="small" x="677" y="819">The Fallen; outside this slice</text><path d="M 410 807 H 665" fill="none" stroke="#89939c" stroke-width="9" stroke-dasharray="12 8"/><text class="small" x="455" y="995">No service staircase reaches this floor.</text><text class="small" x="35" y="1037">The lift is the only traversable connection from lower floor to refuge. H is context, not another beta task.</text></svg>