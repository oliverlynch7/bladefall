<section style="position:fixed;left:8px;bottom:8px;z-index:200001;background:#102331;color:white;padding:8px;font:11px system-ui;max-width:540px;max-height:200px;overflow:auto"><button id="perfBriar">Briar start</button><button id="perfVillage">Village</button><button id="perfMill">Mill</button><button id="perfWoods">Black Woods</button><button id="perfMeasure">Measure</button><button id="perfHideMobs">Toggle mob art</button><button id="perfHideNpc">Toggle NPC art</button><pre id="perfResult">Loading</pre></section><script>
(async()=>{const wait=()=>new Promise(r=>setTimeout(r,50));while(!window.__BF3||!window.HERO3D?.ready)await wait();const b=__BF3;await b.briarReady;b.loadMode('rl');b.meta.classId='warrior';b.meta.classUnlocked.warrior=true;b.meta.originSeen=true;b.meta.introSeen=true;b.meta.hubTutDone=true;b.meta.tutOff=true;b.meta.autoAttack=false;b.meta.camMode='shoulder';let samples=[],until=0,label='',offMobs=false,offNpc=false;
window.__QA_PERF=s=>{if(!until)return;samples.push(s);if(performance.now()>=until){until=0;document.getElementById('perfResult').dataset.measured=label;const avg=k=>samples.reduce((n,s)=>n+(+s[k]||0),0)/samples.length,quant=k=>[...samples].sort((a,b)=>a[k]-b[k])[Math.floor(samples.length*.95)][k];document.getElementById('perfResult').textContent=JSON.stringify({label,frames:samples.length,gapMean:avg('gap'),gapP95:quant('gap'),main:avg('main'),update:avg('update'),base:avg('base'),hero:avg('hero'),boxes:avg('boxes'),last:samples.at(-1)},null,2);}};
async function place(area,x,z){b.enterZone(0);if(area)b.nextArea();await wait();while(BF_LOADING.active)await wait();b.G._tutorialSafe=true;Object.assign(b.G.p,{x,y:0,z,vx:0,vy:0,vz:0,onGround:true,yaw:Math.PI});b.G.camYaw=Math.PI;b.G.camPitch=.14;label=area?'woods':z===420?'briar-start':z===-1450?'village':'mill';document.getElementById('perfResult').textContent='Ready: '+label;document.getElementById('perfResult').dataset.label=label;}
document.getElementById('perfBriar').onclick=()=>place(0,0,420);document.getElementById('perfVillage').onclick=()=>place(0,0,-1450);document.getElementById('perfMill').onclick=()=>place(0,-600,-2350);document.getElementById('perfWoods').onclick=()=>place(1,0,420);document.getElementById('perfMeasure').onclick=()=>{samples=[];delete document.getElementById('perfResult').dataset.measured;until=performance.now()+4500;document.getElementById('perfResult').textContent='Measuring '+label;};document.getElementById('perfHideMobs').onclick=()=>{offMobs=!offMobs;window.__mob3dEnabled(!offMobs);};document.getElementById('perfHideNpc').onclick=()=>{offNpc=!offNpc;const g=window.__hero3dScene?.().getObjectByName('Waystation citizens');if(g)g.visible=!offNpc;};document.getElementById('perfResult').textContent='Ready'; const params=new URLSearchParams(location.search),testCase=params.get('case')||'start';
 if(testCase==='save'){Object.assign(b.meta,structuredClone(window.__QA_OLD_SAVE));b.continueRun();await new Promise(r=>setTimeout(r,1800));document.getElementById('perfResult').textContent=JSON.stringify({oldSave:true,mode:b.mode,level:b.G.p.level,xp:b.G.p.xp,class:b.classState(b.meta.classId),gold:b.meta.gold,zone:b.G.zone,area:b.G.area,mob:window.__mob3d?.(),world:window.__world3d?.()?.err});return;}
 if(testCase==='transition'){await place(0,0,420);await new Promise(r=>setTimeout(r,1800));const old=window.__hero3dScene().getObjectByName('mob3d').children.slice(),before=window.__mob3d();b.nextArea();await new Promise(r=>setTimeout(r,2200));document.getElementById('perfResult').textContent=JSON.stringify({transition:true,oldActors:old.length,oldActorsDetached:old.every(n=>!n.parent),before:{pooled:before.pooled,live:before.live},after:window.__mob3d(),area:b.G.area,worldError:window.__world3d().err});return;}
 b.meta.camMode=params.get('camera')||'shoulder'; await place(testCase==='woods'?1:0,testCase==='mill'?-600:0,testCase==='village'?-1450:testCase==='mill'?-2350:420); if(testCase==='near'){const e=b.G.enemies.find(e=>!e.dead);Object.assign(b.G.p,{x:e.x,y:e.y||0,z:e.z+130});}
 await new Promise(r=>setTimeout(r,1800)); samples=[];until=performance.now()+4500;})();</script>
