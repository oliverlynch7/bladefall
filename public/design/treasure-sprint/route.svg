<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520"><rect width="1100" height="520" fill="#153141"/><g fill="#f6e5b7" font-family="system-ui"><text x="40" y="54" font-size="28">TREASURE SPRINT · ROUTE CONTRACT</text><text x="40" y="85" font-size="16">Wide launch → climb with turns → timing crossing → balance / descent → finish vault</text></g><path d="M110 285 L300 200 L500 280 L700 180 L930 270" fill="none" stroke="#f1bd61" stroke-width="9"/><g fill="#90ccd2" stroke="#e8c57a" stroke-width="3"><rect x="55" y="245" width="110" height="80" rx="10"/><rect x="245" y="160" width="110" height="80" rx="10"/><rect x="445" y="240" width="110" height="80" rx="10"/><rect x="645" y="140" width="110" height="80" rx="10"/><rect x="875" y="230" width="140" height="80" rx="10"/></g><g font-family="system-ui" font-size="17" text-anchor="middle" fill="#102431"><text x="110" y="290">LAUNCH</text><text x="300" y="205">CLIMB</text><text x="500" y="285">CROSS</text><text x="700" y="185">BALANCE</text><text x="945" y="275">FINISH</text></g><g fill="#f6e5b7" font-family="system-ui" font-size="17"><text x="45" y="390">Stable checkpoint pads separate each movement challenge. No required class skill.</text><text x="45" y="425">Gold = permanent landing · Violet = moving · Coral cracks = fragile · Cyan = timed</text><text x="45" y="460">Fall: return to last safe pad, +3s score · Retry: same seed · New course: new seed</text></g></svg>