<!doctype html><meta charset="utf-8"><title>Bladefall party transition checks</title><style>body{background:#102331;color:#fff;font:15px system-ui}iframe{width:48%;height:330px}pre{white-space:pre-wrap}button{padding:12px}</style><h1>Party transition checks</h1><button id="run">Run actual host and guest checks</button><pre id="result">Ready</pre><textarea id="evidence" hidden></textarea><iframe id="host" title="Host" src="/3d/.qa-runtime-profile.html?mute=1"></iframe><iframe id="guest" title="Guest" src="/3d/.qa-runtime-profile.html?mute=1"></iframe><script>
document.querySelector('#run').onclick=async()=>{
 const hw=document.querySelector('#host').contentWindow,gw=document.querySelector('#guest').contentWindow,rows=[],out=document.querySelector('#result'),clone=x=>JSON.parse(JSON.stringify(x)),wait=ms=>new Promise(r=>setTimeout(r,ms));let hb,gb;
 const ok=(label,value)=>{rows.push({label,pass:!!value});if(!value)throw Error(label);out.textContent='Passed '+rows.length+': '+label;};
 async function until(fn){const end=Date.now()+45000;while(!fn()){if(Date.now()>end)throw Error('Timed out waiting for fixture');await wait(100);}}
 try{await until(()=>hw.__BF3&&gw.__BF3&&hw.HERO3D?.ready&&gw.HERO3D?.ready);hb=hw.__BF3;gb=gw.__BF3;await Promise.all([hb.briarReady,gb.briarReady]);
 for(const b of [hb,gb]){b.loadMode('rl');Object.assign(b.meta,{hero:null,run:null,bank:null,originSeen:true,introSeen:true,hubTutDone:true,tutOff:true,classId:'warrior',dialogueTTS:false});b.meta.classUnlocked.warrior=true;b.enterZone(0);}
 await until(()=>!hw.BF_LOADING.active&&!gw.BF_LOADING.active);
 const hq=[],gq=[],handlers={};Object.assign(hb.MP,{active:true,isHost:true,myId:'runtime-host',conns:[],zone:0});hb.MP.onEnter(0);hb.MP.wireGuest({open:true,send:d=>hq.push(clone(d)),on:(k,f)=>handlers[k]=f});handlers.open();Object.assign(gb.MP,{active:true,isHost:false,myId:'runtime-guest',zone:0,hostConn:{open:true,send:d=>gq.push(clone(d))}});
 const flush=()=>{for(let i=0;i<5;i++){for(const d of gq.splice(0))handlers.data(d);for(const d of hq.splice(0))gb.MP.onGuestData(d);}},broadcast=()=>{hb.MP.broadcast();flush();};handlers.data({t:'hello',p:gb.MP.selfState()});flush();await until(()=>!hw.BF_LOADING.active&&!gw.BF_LOADING.active);ok('Guest adopts the host run identity',hb.G.runSeed===gb.G.runSeed&&hb.G.area===gb.G.area);
 for(const b of [hb,gb]){b.G.enemies.forEach(e=>e.stunT=99999);Object.assign(b.G.p,{x:0,y:0,z:420,invuln:99999,vx:0,vy:0,vz:0,onGround:true});b.meta.autoSellEquipment=false;}
 const hc={x:0,y:0,z:420,rarity:'common',enemyReward:true,bob:0,dropReadyAt:0};hb.G.chests.push(hc);hb.MP._chestSentWorld=null;broadcast();const gc=gb.G.chests.find(c=>c.rewardKey===hc.rewardKey);ok('Enemy chest is shared with its stable reward key',!!gc);
 const hn=hb.meta.stash.length,gn=gb.meta.stash.length;hb.openChest(hc);ok('Host opening leaves guest chest available',hc.opened&&!gc.opened);gb.openChest(gc);await wait(2500);broadcast();ok('Both players receive a personal item',hb.meta.stash.length===hn+1&&gb.meta.stash.length===gn+1);hb.openChest(hc);gb.openChest(gc);ok('Repeated collection cannot duplicate either item',hb.meta.stash.length===hn+1&&gb.meta.stash.length===gn+1);
 const staleState=clone(hq.find(d=>d.t==='state')||(()=>{let result;hb.MP.conns.push({open:true,send:d=>{if(d.t==='state')result=clone(d)}});hb.MP.broadcast();hb.MP.conns.pop();return result})()),oldScene=hb.MP.combatScene();
 hb.G.area=1;hb.loadArea();hb.MP.onEnter(0);flush();await until(()=>!hw.BF_LOADING.active&&!gw.BF_LOADING.active);ok('Both clients rebuild Black Woods',hb.G.area===1&&gb.G.area===1);const world=gb.G,enemies=gb.G.enemies;gb.MP.onGuestData(staleState);ok('Delayed Homefields snapshot cannot replace Black Woods',gb.G===world&&gb.G.enemies===enemies&&gb.G.area===1);
 for(const b of [hb,gb]){b.G.p.hp=1;b.G.p.mana=0;}hb.openHub();flush();await until(()=>!hw.BF_LOADING.active&&!gw.BF_LOADING.active);ok('Both clients return to a clean hub',hb.G.hub&&gb.G.hub&&hb.G.enemies.every(e=>e.dummy||e.practice)&&gb.G.enemies.every(e=>e.dummy||e.practice));for(const [b,label]of [[hb,'Host'],[gb,'Guest']]){ok(label+' returns at full HP and mana',b.G.p.hp===b.effMaxHp(b.G.p)&&b.G.p.mana===b.G.p.maxMana);}
 const hub=gb.G;for(const packet of [staleState,{t:'wipe'},{t:'wipe',scene:oldScene},{t:'wipe',scene:gb.MP.combatScene()},{t:'revive',id:gb.MP.myId}])gb.MP.onGuestData(packet);ok('Hub rejects old state and unscoped/current-hub wipe messages',gb.G===hub&&!gb.G.p.dead&&!gb.G.p.downed&&gb.mode==='play');
 hb.enterZone(0);flush();await until(()=>!hw.BF_LOADING.active&&!gw.BF_LOADING.active);for(const b of [hb,gb]){b.G.enemies.forEach(e=>e.stunT=99999);Object.assign(b.G.p,{x:0,y:0,z:420,hp:100,invuln:99999,vx:0,vz:0,vy:0,onGround:true});}
 gb.MP.goDown();handlers.data({t:'pos',p:gb.MP.selfState()});ok('Guest has a reachable timed downed body',gb.G.p.downed&&!gb.G.p.spectating&&gb.G.p.downT>0&&gb.G.p.y>=0);ok('Host can complete the real revive relay',hb.MP.routeRevive(gb.MP.myId,hb.MP.myId));flush();ok('Guest stands up once with restored health',!gb.G.p.downed&&gb.G.p.hp>0);const hp=gb.G.p.hp;flush();ok('Duplicate packets do not heal again',gb.G.p.hp===hp);
 gb.MP.goDown();gb.G.p.downT=0;gb.MP.survivalTick(.1);gb.MP.onGuestData({t:'revive',id:gb.MP.myId,scene:gb.MP.combatScene()});ok('Expired revive window stays spectating',gb.G.p.downed&&gb.G.p.spectating&&gb.G.p.hp===0);
 const result={checks:rows,pass:true,errors:[...hw.runtimeErrors,...gw.runtimeErrors],scope:'Actual game host/guest handlers over an isolated local serialized relay; staged world/loot/downed states, not Internet transport or human campaign play.'};document.querySelector('#evidence').value=JSON.stringify(result);out.textContent='PASS '+rows.length+' checks';
 }catch(e){out.textContent='FAILED '+e.stack;document.querySelector('#evidence').value=JSON.stringify({checks:rows,error:String(e.stack)});}finally{for(const b of [hb,gb])if(b){b.MP.active=false;b.MP.conns=[];b.MP.hostConn=null;}}
};</script>
