</style></head><body><header><h1>Campaign model workshop</h1><p>59 reusable models · eight regional palettes.<br>Drag to orbit. Scroll or pinch to zoom. The campaign uses these same meshes.</p></header><a id="back" href="../../3d/">Back to Bladefall</a><div id="stats" aria-live="polite"></div><div id="failure" role="alert"></div>

<script type="importmap">{"imports":{"three":"../../3d/three.module.js"}}</script><script type="module">
import * as T from '../../3d/three.module.js';
import {createCraftModel,CRAFT_MODEL_NAMES,CRAFT_PALETTES} from '../../3d/campaign-craft-models.js?v=2186c';
try{
const scene=new T.Scene();scene.background=new T.Color('#344b54');const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const camera=new T.PerspectiveCamera(38,innerWidth/innerHeight,1,5000),target=new T.Vector3(),points=new Map();let yaw=.55,pitch=.32,distance=400,baseDistance=400,actor=null,spin=false,damaged=false;
scene.add(new T.HemisphereLight('#e4f1ff','#7b6845',2));const sun=new T.DirectionalLight('#fff2d1',3.2);sun.position.set(-220,380,300);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-260,right:260,bottom:-220,top:220,near:1,far:1000});sun.shadow.normalBias=.6;scene.add(sun);const rim=new T.DirectionalLight('#a6d9ff',1.4);rim.position.set(200,190,-300);scene.add(rim);
const ground=new T.Mesh(new T.PlaneGeometry(5000,5000),new T.MeshStandardMaterial({color:'#5d7070',roughness:.95}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const model=document.querySelector('#model'),theme=document.querySelector('#theme'),title=s=>s.replaceAll('-',' ').replace(/\b\w/g,c=>c.toUpperCase());for(const name of CRAFT_MODEL_NAMES)model.add(new Option(title(name),name));const names={briar:'Briar Town',hollow:'Hollow Pass',keep:'Ruined Keep',frost:'Frostfell',ember:'Emberdeep',coast:'Stormcoast',palace:'Sunspire',castle:'Castle Duskmoor'};for(const key of Object.keys(CRAFT_PALETTES))theme.add(new Option(names[key],key));model.value='cottage';
function reset(){yaw=.55;pitch=.32;distance=baseDistance/Math.min(1,camera.aspect*1.2);}
function show(){actor?.removeFromParent();const sizes={cottage:[320,200,240],furnace:[280,200,150],wreck:[310,120,460],throne:[145,230,100],bridge:[150,18,320],'rope-bridge':[150,18,320],'stone-bridge':[180,95,280],scaffold:[180,250,180],tent:[240,150,180],crane:[330,240,120],waterwheel:[200,200,60],bookshelf:[160,240,60],wall:[280,180,50],cliff:[300,200,240],bank:[300,50,180],shelf:[300,120,190],arch:[200,240,60],'cave-mouth':[360,280,80],gatehouse:[330,300,80]};const [w,h,d]=sizes[model.value]||[160,145,110];const options={w,h,d,damaged};if(['waterwheel','mirror','pulley','valve'].includes(model.value))options.d=24;actor=createCraftModel(model.value,theme.value,options);scene.add(actor);const box=new T.Box3().setFromObject(actor);actor.position.y=-box.min.y;box.setFromObject(actor);box.getCenter(target);const size=box.getSize(new T.Vector3());baseDistance=Math.max(size.x,size.y,size.z)*3.1;document.querySelector('#wear').disabled=model.value!=='cottage';const counts={triangles:0,meshes:0};actor.traverse(o=>{if(o.isMesh){counts.meshes++;counts.triangles+=o.geometry.attributes.position.count/3;}});document.querySelector('#stats').textContent=title(model.value)+' · '+names[theme.value]+' · '+counts.triangles.toLocaleString()+' triangles · '+counts.meshes+' material batches';window.__craftViewer={model:model.value,theme:theme.value,...counts};reset();}
model.addEventListener('change',show);theme.addEventListener('change',show);document.querySelector('#wear').onclick=e=>{damaged=!damaged;e.currentTarget.setAttribute('aria-pressed',String(damaged));show();};document.querySelector('#spin').onclick=e=>{spin=!spin;e.currentTarget.setAttribute('aria-pressed',String(spin));};document.querySelector('#reset').onclick=reset;
const canvas=renderer.domElement;canvas.addEventListener('pointerdown',e=>{points.set(e.pointerId,[e.clientX,e.clientY]);canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{const old=points.get(e.pointerId);if(!old)return;if(points.size===1){yaw-=(e.clientX-old[0])*.007;pitch=Math.max(-.1,Math.min(1.45,pitch+(e.clientY-old[1])*.007));}else{const other=[...points].find(([id])=>id!==e.pointerId)[1],a=Math.hypot(old[0]-other[0],old[1]-other[1]),b=Math.hypot(e.clientX-other[0],e.clientY-other[1]);if(b>0)distance=Math.max(80,Math.min(2400,distance*a/b));}points.set(e.pointerId,[e.clientX,e.clientY]);});for(const type of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(type,e=>points.delete(e.pointerId));canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(80,Math.min(2400,distance*Math.exp(e.deltaY*.001)))},{passive:false});window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);reset();};
show();let last=performance.now();function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(spin)yaw+=dt*.25;camera.position.set(target.x+Math.sin(yaw)*distance*Math.cos(pitch),target.y+Math.sin(pitch)*distance,target.z+Math.cos(yaw)*distance*Math.cos(pitch));camera.lookAt(target);renderer.render(scene,camera);requestAnimationFrame(frame);}requestAnimationFrame(frame);
}catch(e){const message=document.querySelector('#failure');message.textContent='The 3D workshop could not load. '+e.message;message.style.display='block';throw e;}
