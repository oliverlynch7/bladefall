<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>BLADEFALL — 3D Vertical Slice</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:#08090c;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#e8dcc6;overscroll-behavior:none}
  canvas{display:block;width:100vw;height:100vh;touch-action:none}

  #load{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:16px;
    background:radial-gradient(circle at 50% 40%,#181420,#08090c 70%);z-index:50;text-align:center;padding:20px}
  #load h1{font-family:Georgia,serif;letter-spacing:.14em;margin:0;font-size:clamp(22px,5vw,34px);color:#e8c07a}
  #load p{margin:0;color:#8d8474;font-size:13px}
  .spin{width:34px;height:34px;border:3px solid #3a3020;border-top-color:#e8a33d;border-radius:50%;
    animation:sp 1s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  #bar{width:min(280px,70vw);height:4px;background:#241f18;border-radius:3px;overflow:hidden}
  #bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#a9762a,#f0c070);transition:width .3s}

  .hud{position:fixed;z-index:20;pointer-events:none}
  #top{top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    display:flex;gap:8px;align-items:flex-start;justify-content:space-between;
    background:linear-gradient(180deg,rgba(6,7,10,.82),transparent)}
  #brand{font-family:Georgia,serif;font-size:13px;letter-spacing:.16em;color:#e8c07a;text-transform:uppercase}
  #brand small{display:block;letter-spacing:.05em;text-transform:none;color:#8d8474;font-size:10.5px;font-family:system-ui}
  #classes{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
  .cbtn{background:linear-gradient(180deg,rgba(38,30,20,.95),rgba(16,14,18,.95));border:1px solid #4a3c26;
    color:#d8c8a8;font-size:11.5px;font-weight:700;padding:7px 11px;border-radius:9px;cursor:pointer;
    letter-spacing:.03em;transition:.14s}
  .cbtn:hover{border-color:#e8a33d;color:#fff}
  .cbtn.sel{border-color:#e8a33d;color:#ffd89a;box-shadow:0 0 14px rgba(232,163,61,.28)}
  .cbtn:focus-visible{outline:2px solid #e8a33d;outline-offset:2px}

  #skins{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
  .sbtn{display:flex;align-items:center;gap:5px;background:linear-gradient(180deg,rgba(30,26,20,.95),rgba(14,12,16,.95));
    border:1px solid #3d3830;color:#bdb3a0;font-size:10.5px;font-weight:700;padding:5px 9px;border-radius:8px;
    cursor:pointer;letter-spacing:.03em;transition:.14s}
  .sbtn:hover{border-color:#e8a33d;color:#fff}
  .sbtn.sel{border-color:#e8a33d;color:#ffd89a;box-shadow:0 0 10px rgba(232,163,61,.25)}
  .sbtn i{width:9px;height:9px;border-radius:50%;display:block;box-shadow:0 0 0 1px rgba(0,0,0,.5) inset}
  .sbtn:focus-visible{outline:2px solid #e8a33d;outline-offset:2px}

  #hint{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;
    font-size:11.5px;color:#8d8474;line-height:1.7;pointer-events:none;text-shadow:0 1px 3px #000}
  #hint b{color:#d8c8a8}
  #fps{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:20;
    font:600 11px ui-monospace,monospace;color:#6f6858;pointer-events:none}
  #perf{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 96px);z-index:23;
    font:600 11px/1.55 ui-monospace,monospace;color:#bfe6ff;background:rgba(6,8,14,.82);
    border:1px solid #2b3a4a;border-radius:9px;padding:8px 11px;pointer-events:none;white-space:pre}
  #perf.hide{display:none}
  #perf b{color:#ffd24a}
  #perf .bad{color:#ff7a6a}
  #kills{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom) + 30px);z-index:20;
    font:700 12px system-ui;color:#e8c07a;pointer-events:none;text-shadow:0 1px 3px #000}

  #custom{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 96px);z-index:24;

    font-size:11px;color:#cfc6b4;box-shadow:0 10px 30px rgba(0,0,0,.55)}
  #custom.hide{display:none}
  #custom h4{margin:9px 0 5px;font:800 9.5px system-ui;letter-spacing:.13em;
    text-transform:uppercase;color:#8d8474}
  #custom h4:first-child{margin-top:0}
  #custom .row{display:flex;flex-wrap:wrap;gap:4px}
  #custom .opt{background:linear-gradient(180deg,rgba(34,29,22,.95),rgba(15,13,18,.95));
    border:1px solid #46402f;color:#c8bda8;font-size:10px;font-weight:700;padding:4px 7px;
    border-radius:6px;cursor:pointer}
  #custom .opt.sel{border-color:#e8a33d;color:#ffd89a}
  #custom .sw{width:22px;height:22px;border-radius:50%;border:2px solid #3a352c;cursor:pointer;padding:0}
  #custom .sw.sel{border-color:#fff;box-shadow:0 0 8px rgba(255,255,255,.5)}
  #custBtn{position:fixed;left:12px;top:calc(env(safe-area-inset-top) + 62px);z-index:24;
    background:linear-gradient(180deg,rgba(38,30,20,.95),rgba(16,14,18,.95));border:1px solid #4a3c26;
    color:#d8c8a8;font-size:11px;font-weight:700;padding:6px 10px;border-radius:8px;cursor:pointer}
  #custBtn:hover{border-color:#e8a33d;color:#fff}

  #hpwrap{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 58px);

  #skillbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);

  .skb{position:relative;width:60px;height:60px;border-radius:12px;overflow:hidden;cursor:pointer;

  /* touch controls */
  #touch{position:fixed;inset:0;z-index:22;display:none;pointer-events:none}

  #abtns{position:absolute;right:calc(env(safe-area-inset-right) + 20px);bottom:calc(env(safe-area-inset-bottom) + 30px);

  .ab{width:74px;height:74px;border-radius:50%;border:2px solid;display:grid;place-content:center;

  #bAtk{background:radial-gradient(circle at 40% 35%,#7a2420,#2a0f0e);border-color:#c0533f;color:#ffd0c0}
  #bSkill{background:radial-gradient(circle at 40% 35%,#5a3a10,#2a1c08);border-color:#e8a33d;color:#ffe0a8;
    width:64px;height:64px;font-size:11px}
  #bRoll{background:radial-gradient(circle at 40% 35%,#20344a,#0e1620);border-color:#5f8fb8;color:#cfe4f5;
    width:58px;height:58px;font-size:10.5px}
  #bJump{background:radial-gradient(circle at 40% 35%,#1f4a34,#0b1a13);border-color:#54a87a;color:#ccf0dc;
    width:58px;height:58px;font-size:10.5px}
  .ab:active{filter:brightness(1.35)}
</style>

<canvas id="c"></canvas>

<div id="load">
  <h1>BLADEFALL</h1>
  <div class="spin"></div>
  <div id="bar"><i></i></div>
  <p id="lmsg">Loading 3D vertical slice…</p>
</div>

<div class="hud" id="top">
  <div id="brand">Bladefall<small>3D slice · Quaternius + Kenney (CC0)</small></div>
  <div style="display:flex;flex-direction:column;gap:6px;align-items:flex-end">

    <div id="skins"></div>

</div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from './jsm/loaders/GLTFLoader.js';
import { FBXLoader } from './jsm/loaders/FBXLoader.js';

/* ─────────────────────────────────────────────────────────────
   BLADEFALL — 3D vertical slice
   Purpose: judge the Quaternius art direction in motion, with the
   real game verbs (move / sprint / roll / attack / skill) before
   committing to a full rebuild. Art: Quaternius + Kenney, all CC0.
   ───────────────────────────────────────────────────────────── */

const HERO_H = 1.75;
const ATK_SPEED = 1.85;   // swing playback rate — higher = snappier
// Face placement — tune live via __SLICE.faceTune({...}); values bake in here.
const FACE = { enabled:false, bandLo:0.72, bandHi:0.90, eyeY:0.34, eyeX:0.38, size:0.17, lift:1.0 };
let MOB_SCALE = 1.0;   // global mob-size dial (see __SLICE.mobScale)                 // metres — everything is normalised to this
const clock  = new THREE.Clock();
const canvas = document.getElementById('c');

const renderer = new THREE.WebGLRenderer({ canvas, antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.34;
renderer.outputColorSpace = THREE.SRGBColorSpace;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#171a24');
scene.fog = new THREE.FogExp2('#171a24', 0.013);

const camera = new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.1, 300);

/* ── Lighting: moody but READABLE — atmosphere shouldn't cost you the art. ── */
// Ambient floor so no surface ever reads as a black silhouette — these stylised
// textures are dark, and without it the characters lose all their detail.
scene.add(new THREE.AmbientLight('#9fb0d0', 0.95));
scene.add(new THREE.HemisphereLight('#9fb4dd', '#5a4a3a', 1.5));
const moon = new THREE.DirectionalLight('#cfe0ff', 1.5);
moon.position.set(-8, 14, -6);
moon.castShadow = true;
moon.shadow.mapSize.set(1024, 1024);
moon.shadow.camera.near = 1; moon.shadow.camera.far = 60;
moon.shadow.camera.left = -22; moon.shadow.camera.right = 22;
moon.shadow.camera.top = 22;  moon.shadow.camera.bottom = -22;
moon.shadow.bias = -0.0016;
scene.add(moon);

const heroLamp = new THREE.PointLight('#ffc888', 2.6, 18, 2);   // keeps the hero readable in the gloom
scene.add(heroLamp);

// flickering braziers, placed after we know the room size
const torches = [];
function addTorch(x, z){
  const g = new THREE.Group(); g.position.set(x, 0, z);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.08,1.1,7),
    new THREE.MeshStandardMaterial({ color:'#2b2119', roughness:.95 }));
  post.position.y = 0.55; g.add(post);
  const bowl = new THREE.Mesh(new THREE.CylinderGeometry(0.19,0.11,0.16,9),
    new THREE.MeshStandardMaterial({ color:'#3a2c1e', roughness:.9 }));
  bowl.position.y = 1.16; g.add(bowl);
  const flame = new THREE.Mesh(new THREE.IcosahedronGeometry(0.16,0),
    new THREE.MeshBasicMaterial({ color:'#ffb44a' }));
  flame.position.y = 1.32; g.add(flame);
  scene.add(g);
  torches.push({ li:null, flame, base:3.6, seed: Math.random()*7 });   // flame glows via emissive; no light
}

/* ── Loading ── */
const loader = new GLTFLoader();
const bar = document.querySelector('#bar i');
const lmsg = document.getElementById('lmsg');
let loadedCount = 0, loadTotal = 1;
const bump = () => { loadedCount++; bar.style.width = Math.round(100*loadedCount/loadTotal)+'%'; };
const load = url => new Promise((res, rej) => loader.load(url, g => { bump(); res(g); }, undefined, rej));

// Quaternius + Kenney ship KHR_materials_unlit, which GLTFLoader turns into MeshBasicMaterial —
// those ignore every light, so torches/shadows would do nothing. Re-light them as Lambert
// (cheap, and the flat stylised look survives) while keeping the baked colour map.
function relight(m){
  if(!m || !m.isMeshBasicMaterial) return m;
  const lit = new THREE.MeshLambertMaterial({
    map: m.map || null,
    color: m.color ? m.color.clone() : new THREE.Color('#ffffff'),
    transparent: m.transparent, opacity: m.opacity,
    alphaTest: m.alphaTest, side: m.side, vertexColors: m.vertexColors
  });
  lit.name = m.name;
  return lit;
}
function prep(obj, { shadow=false } = {}){
  obj.traverse(o => {
    if(!o.isMesh) return;
    o.castShadow = shadow; o.receiveShadow = true;
    o.material = Array.isArray(o.material) ? o.material.map(relight) : relight(o.material);
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for(const m of mats){ if(m && m.map) m.map.colorSpace = THREE.SRGBColorSpace; }
  });
  return obj;
}
const boxOf = o => new THREE.Box3().setFromObject(o);

/* ─────────────  CLASSES  ─────────────
   Clip names verified from the Quaternius glTF files. Each class maps the
   game's verbs onto whatever that model actually ships, with fallbacks. */
const CLASSES = [
  { id:'Warrior', label:'Warrior', tint:'#d8b26a',
    clips:{ idle:['Idle_Weapon','Idle'], walk:['Walk'], run:['Run_Weapon','Run'], roll:['Roll'], jump:['Idle_Weapon','Idle'],
            attack:['Sword_Attack','Sword_Attack2'], skill:['Sword_Attack2','Sword_Attack'], hit:['RecieveHit'], death:['Death'] },
    skill:{ name:'Earthshatter', kind:'nova', color:'#ffb347', color2:'#ff5a2a' } },
  { id:'Rogue', label:'Rogue', tint:'#8fd0a8',
    clips:{ idle:['Idle'], walk:['Walk'], run:['Run'], roll:['Roll'], jump:['Idle'],
            attack:['Dagger_Attack','Dagger_Attack2'], skill:['Dagger_Attack2','Dagger_Attack'], hit:['RecieveHit','RecieveHit_2'], death:['Death'] },
    skill:{ name:'Venom Burst', kind:'nova', color:'#8dff9a', color2:'#2ea84a' } },
  // ── Universal Base Characters + Universal Animation Library (Quaternius) ──
  // UE-standard 65-joint skeleton; UAL1+UAL2 (86 clips) bind by bone NAME with zero
  // retargeting, which is why these get a far richer move set than the RPG rigs.
  // ── Mixamo (free, commercial-use, rigged, textured, with faces) ──
  // Our 86 UAL clips reach these through UE->mixamorig track renaming; see retargetClips.
  { id:'Paladin', label:'Paladin ★', mixamo:true, file:'Paladin', tint:'#d9c48a',
    clips:{ idle:['Sword_Idle','Idle_Loop'], walk:['Walk_Loop'], run:['Sprint_Loop','Jog_Fwd_Loop'],
            roll:['Roll'], jump:['Jump_Loop','Jump_Start'],
            attack:['Sword_Regular_A','Sword_Regular_B','Sword_Regular_C'],
            skill:['Sword_Heavy_Combo'], hit:['Hit_Chest'], death:['Death01'] },
    skill:{ name:'Judgement', kind:'nova', color:'#ffe6a0', color2:'#ffa42a' } },
  { id:'Arissa', label:'Arissa ★', mixamo:true, file:'Arissa', tint:'#c98fa8',
    clips:{ idle:['Idle_Loop','Sword_Idle'], walk:['Walk_Loop'], run:['Sprint_Loop','Jog_Fwd_Loop'],
            roll:['Roll'], jump:['Jump_Loop','Jump_Start'],
            attack:['Sword_Regular_B','Sword_Regular_C','Sword_Regular_A'],
            skill:['Sword_Dash'], hit:['Hit_Chest'], death:['Death01'] },
    skill:{ name:'Bladestorm', kind:'nova', color:'#ff8fc0', color2:'#a02a6a' } },
  { id:'Maria', label:'Maria ★', mixamo:true, file:'Maria', tint:'#8fb8d9',
    clips:{ idle:['Idle_Loop','Sword_Idle'], walk:['Walk_Loop'], run:['Sprint_Loop','Jog_Fwd_Loop'],
            roll:['Roll'], jump:['Jump_Loop','Jump_Start'],
            attack:['Sword_Regular_C','Sword_Regular_A'],
            skill:['Spell_Simple_Shoot'], hit:['Hit_Chest'], death:['Death01'] },
    skill:{ name:'Frostbind', kind:'nova', color:'#a8e0ff', color2:'#2a6aa0' } },
  { id:'BaseM', label:'Human ♂', ual:true, tint:'#cbb28a',
    outfits:[ {name:'Ranger',  file:'outfits/Male_Ranger'},
              {name:'Peasant', file:'outfits/Male_Peasant'},
              {name:'Base Body', file:'base/Superhero_Male_FullBody'} ],
    clips:{ idle:['Sword_Idle','Idle_Loop'], walk:['Walk_Loop'], run:['Sprint_Loop','Jog_Fwd_Loop'],
            roll:['Roll'], jump:['Jump_Loop','Jump_Start'],
            attack:['Sword_Regular_A','Sword_Regular_B','Sword_Regular_C'],
            skill:['Sword_Heavy_Combo'], hit:['Hit_Chest'], death:['Death01'] },
    skill:{ name:'Heavy Combo', kind:'nova', color:'#ffb347', color2:'#ff5a2a' } },
  { id:'BaseF', label:'Human ♀', ual:true, tint:'#e8c0a8',
    outfits:[ {name:'Ranger',  file:'outfits/Female_Ranger'},
              {name:'Peasant', file:'outfits/Female_Peasant'},
              {name:'Base Body', file:'base/Superhero_Female_FullBody'} ],
    clips:{ idle:['Idle_Loop','Sword_Idle'], walk:['Walk_Loop'], run:['Sprint_Loop','Jog_Fwd_Loop'],
            roll:['Roll'], jump:['Jump_Loop','Jump_Start'],
            attack:['Sword_Regular_B','Sword_Regular_C','Sword_Regular_A'],
            skill:['Spell_Simple_Shoot'], hit:['Hit_Chest'], death:['Death01'] },
    skill:{ name:'Arc Nova', kind:'bolt', color:'#9ad4ff', color2:'#5f8fff' } },
  { id:'Wizard', label:'Wizard', tint:'#9ab8ff',
    clips:{ idle:['Idle_Weapon','Idle'], walk:['Walk'], run:['Run_Weapon','Run'], roll:['Roll'], jump:['Idle_Weapon','Idle'],
            attack:['Staff_Attack','Spell1'], skill:['Spell2','Spell1'], hit:['RecieveHit','RecieveHit_2'], death:['Death'] },
    skill:{ name:'Arc Nova', kind:'bolt', color:'#9ad4ff', color2:'#5f8fff' } },
];

/* ─────────────  SKINS  ─────────────
   The Quaternius atlases are genuinely dark (the Warrior's plate is #3d3d3d at 24%
   brightness), which is why the stock models read as silhouettes. Rather than ship a
   second set of textures, we repaint the atlas on a canvas at load time:
     · desaturated pixels  → the armour/metal colour  (luminance preserved)
     · dark warm-brown     → the leather/cloth colour
     · everything else     → untouched, so skin, hair and eyes survive
   `lift` raises overall brightness. This is the same trick that gives one sword mesh
   a whole rarity ladder, so it doubles as a test of that idea. */
function hexRGB(h){ const n = parseInt(h.slice(1),16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function rgb2hsv(r,g,b){
  r/=255; g/=255; b/=255;
  const mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn;
  let h=0; if(d){ h = mx===r ? ((g-b)/d+(g<b?6:0)) : mx===g ? ((b-r)/d+2) : ((r-g)/d+4); h*=60; }
  return [h, mx?d/mx:0, mx];
}
function tintPixel(out, i, target, lum){
  // paint `target` at the pixel's own luminance so shading/detail survives
  const [tr,tg,tb] = target;
  out[i]   = Math.min(255, tr * lum);
  out[i+1] = Math.min(255, tg * lum);
  out[i+2] = Math.min(255, tb * lum);
}
const _skinCache = new Map();
function repaintTexture(srcTex, skin){
  const img = srcTex.image;
  if(!img || !img.width) return srcTex;
  const key = (srcTex.uuid || '') + '|' + skin.id;
  if(_skinCache.has(key)) return _skinCache.get(key);

  const cvs = document.createElement('canvas');
  cvs.width = img.width; cvs.height = img.height;
  const ctx = cvs.getContext('2d', { willReadFrequently:true });
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0,0,cvs.width,cvs.height);
  const px = data.data;
  const metal   = hexRGB(skin.metal);
  const leather = hexRGB(skin.leather);
  const lift    = skin.lift || 1.0;

  for(let i=0;i<px.length;i+=4){
    if(px[i+3] < 8) continue;
    const [h,s,v] = rgb2hsv(px[i],px[i+1],px[i+2]);
    // luminance normalised so mid-greys land mid-tone, then lifted
    const lum = Math.min(1.9, (0.35 + v * 1.25) * lift);
    if(s < 0.20){                                     // steel / plate / cloth-grey
      tintPixel(px, i, metal, lum);
    } else if(h >= 12 && h <= 52 && v < 0.52){        // dark leather + straps
      tintPixel(px, i, leather, lum);
    } else {                                          // skin, hair, eyes, accents
      px[i]   = Math.min(255, px[i]   * lift);
      px[i+1] = Math.min(255, px[i+1] * lift);
      px[i+2] = Math.min(255, px[i+2] * lift);
    }
  }
  ctx.putImageData(data, 0, 0);
  const tex = new THREE.CanvasTexture(cvs);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.flipY = srcTex.flipY;
  tex.wrapS = srcTex.wrapS; tex.wrapT = srcTex.wrapT;
  tex.needsUpdate = true;
  _skinCache.set(key, tex);
  return tex;
}

/* ─────────────  MODULAR EQUIPMENT  ─────────────
   The lesson from the face fiasco: DON'T bolt geometry onto a model that wasn't authored
   for it. Every attempt to guess a position produced something that floated, clipped or
   showed through from an angle I hadn't checked.

   Armour is the same class of problem — but it has a clean answer, because these outfit
   packs are authored modularly. Every part (body, arms, legs, boots, hood, pauldrons)
   ships with the IDENTICAL 65-joint skeleton, already positioned and weighted by the
   artist. So equipping is not placement at all: rebind the part's SkinnedMesh to the
   character's existing skeleton and it is correct by construction — right position, right
   deformation, animates with everything else. Nothing to guess, nothing to tune.  */
/* Armour SLOTS. Honest limitation: the Standard tier of the outfit pack ships only
   Ranger and Peasant sets — there is no plate/knight geometry. So a 'knight' here is the
   ranger pieces tinted to steel, which reads as armour but is not true plate. The slot
   STRUCTURE (head/chest/legs/shoulders/arms/feet) is real and would take proper plate
   meshes unchanged the day we have them. */
const ARMOUR_SLOTS = ['helmet','chest','legs','shoulders','arms','boots'];
const ARMOUR_SETS = {
  M: { helmet:'outfits/Male_Ranger_Head_Hood', chest:'outfits/Male_Ranger_Body',
       legs:'outfits/Male_Ranger_Legs', shoulders:'outfits/Male_Ranger_Acc_Pauldron',
       arms:'outfits/Male_Ranger_Arms', boots:'outfits/Male_Ranger_Feet_Boots' },
  F: { helmet:'outfits/Female_Ranger_Head_Hood', chest:'outfits/Female_Ranger_Body',
       legs:'outfits/Female_Ranger_Legs', shoulders:'outfits/Female_Ranger_Acc_Pauldrons',
       arms:'outfits/Female_Ranger_Arms', boots:'outfits/Female_Ranger_Feet' },
};
function armourFile(slot){
  const sex = (heroDef && heroDef.id === 'BaseF') ? 'F' : 'M';
  return ARMOUR_SETS[sex][slot] || ARMOUR_SETS.M[slot];
}
/* The three Bladefall archetypes, expressed through what the pack actually provides:
   which slots are worn, and how they're tinted. */
const CLASS_LOOKS = {
  warrior: { label:'Warrior', wear:['chest','legs','arms','boots','shoulders'],
             outfit:'#c8ced6', skin:'#ffffff', hair:2, hairCol:'#4a3122', beard:true },
  ranger:  { label:'Ranger',  wear:['chest','legs','arms','boots','helmet'],

  wizard:  { label:'Wizard',  wear:['chest','legs','arms','boots','helmet'],

async function applyClassLook(key){
  const L = CLASS_LOOKS[key]; if(!L || !hero) return;
  /* The outfit parts are skinned to the 65-bone base rig. The RPG-pack characters use a
     completely different 32-bone rig (Root/Body/Abdomen/UpperArmL/WeaponR). Binding a
     65-bone part to a 32-bone skeleton leaves most of its bone indices pointing at
     nothing — three then throws on every bounds computation and the mesh skins to
     garbage. So a class look only makes sense on a base character; switch to one first. */
  if(!/^Base/.test(heroDef.id || '')){
    const base = CLASSES.find(c => c.id === 'BaseM');
    if(base){ await switchClass(base); await new Promise(r => setTimeout(r, 60)); }
  }
  // Armour must go on the BARE BODY. The character otherwise loads wearing the full
  // assembled Ranger outfit, so every 'class' came out identical with a hood baked in.
  const baseIdx = (heroDef.outfits || []).findIndex(o => /Base Body/i.test(o.name));
  if(baseIdx >= 0 && (outfitIdx[heroDef.id] || 0) !== baseIdx){
    outfitIdx[heroDef.id] = baseIdx;
    const d = heroDef; heroDef = { id:'__reload' };
    await switchClass(d);
    await new Promise(r => setTimeout(r, 60));
  }
  for(const s of ARMOUR_SLOTS) unequipPart(hero, s);
  for(const s of L.wear){ EQUIP_SLOTS[s] = armourFile(s); await equipPart(hero, s); }
  CUSTOM.hair = L.hair; CUSTOM.hairCol = L.hairCol;
  CUSTOM.outfitCol = L.outfit; CUSTOM.skinCol = L.skin; CUSTOM.beard = L.beard;
  await applyCustom();
  CUSTOM.look = key;
  buildCustomPanel();
}
const EQUIP_SLOTS = {
  // Hair ships in two variants; we use 'Rigged to Head Bone', which is skinned to the
  // same 65 joints — so it equips through the identical path as armour, no placement code.
  hair:      'hair/Hair_SimpleParted',
  hair_long: 'hair/Hair_Long',
  hair_buns: 'hair/Hair_Buns',
  buzzed:    'hair/Hair_Buzzed',
  beard:     'hair/Hair_Beard',
  brows:     'hair/Eyebrows_Regular',
  hood:      'outfits/Male_Ranger_Head_Hood',
  pauldrons: 'outfits/Male_Ranger_Acc_Pauldron',
  arms:      'outfits/Male_Ranger_Arms',
  legs:      'outfits/Male_Ranger_Legs',
  boots:     'outfits/Male_Ranger_Feet_Boots',
};
async function equipPart(actor, slot){
  if(!actor || actor._equip && actor._equip[slot]) return;
  const file = EQUIP_SLOTS[slot]; if(!file) return;
  const g = await load(`assets/${file}.gltf`).catch(()=>null);
  if(!g) return;

  // the character's own skeleton — the one the animations already drive
  let skel = null;
  actor.root.traverse(o => { if(!skel && o.isSkinnedMesh) skel = o.skeleton; });
  if(!skel) return;

  const added = [];
  g.scene.traverse(o => {
    if(!o.isSkinnedMesh) return;
    const m = new THREE.SkinnedMesh(o.geometry, o.material);
    m.castShadow = true; m.receiveShadow = true;
    m.material = Array.isArray(o.material) ? o.material.map(relight) : relight(o.material);
    const mats = Array.isArray(m.material) ? m.material : [m.material];
    for(const mm of mats){ if(mm && mm.map) mm.map.colorSpace = THREE.SRGBColorSpace; }
    // THE WHOLE TRICK: reuse the character's skeleton + the part's own bind matrix.
    m.bind(skel, o.bindMatrix);
    actor.model.add(m);
    added.push(m);
  });
  (actor._equip = actor._equip || {})[slot] = added;
  return added;
}
function unequipPart(actor, slot){
  const list = actor && actor._equip && actor._equip[slot];
  if(!list) return;
  for(const m of list){ if(m.parent) m.parent.remove(m); }
  delete actor._equip[slot];
}

/* ── RIGID GEAR ───────────────────────────────────────────────────────────────
   Free plate armour that isn't skinned to our rig, bolted on anyway.

   Why this is legitimate rather than a hack: real plate armour IS rigid. A steel
   cuirass does not deform with the torso, a helm does not deform with the skull.
   So parenting a solid mesh to a bone is physically what armour does. It only
   breaks down for cloth (skirts, capes), which must be skinned.

   The pieces here are loot ICONS from the RPG Items pack — authored to sit in a
   chest, not on a body — so nothing about their scale or offset is meaningful.
   Rather than hand-tune constants (which is what made face placement so fragile:
   any constant is wrong the moment a parent scale changes), every piece is fitted
   by MEASUREMENT at runtime: attach it, look at how wide it actually came out in
   world space, and correct. Offsets are expressed as fractions of the wearer's own
   measured body width, so they survive any change of character or scale. */
const RIGID_GEAR = {
  cuirass:  { file:'gear/Armor_Metal',   bone:/^(spine_03|Torso)$/i, wide:1.06, y: 0.02, z: 0.01 },
  cuirass2: { file:'gear/Armor_Metal2',  bone:/^(spine_03|Torso)$/i, wide:1.06, y: 0.00, z: 0.01 },
  cuirass3: { file:'gear/Armor_Black',   bone:/^(spine_03|Torso)$/i, wide:1.06, y: 0.00, z: 0.01 },
  cuirass4: { file:'gear/Armor_Golden',  bone:/^(spine_03|Torso)$/i, wide:1.06, y: 0.00, z: 0.01 },
  cuirass5: { file:'gear/Armor_Leather', bone:/^(spine_03|Torso)$/i, wide:1.02, y: 0.00, z: 0.01 },
  helm:     { file:'gear/Crown',         bone:/^Head$/i,     wide:0.46, y: 0.10, z: 0.00 },
  helm2:    { file:'gear/Crown2',        bone:/^Head$/i,     wide:0.48, y: 0.10, z: 0.00 },
  shield:   { file:'gear/Shield_Heater', bone:/^(hand_l|FistL)$/i,   wide:0.55, y: 0.00, z: 0.00,
              rot:[0, Math.PI/2, 0] },
  shield2:  { file:'gear/Shield_Round',  bone:/^(hand_l|FistL)$/i,   wide:0.52, y: 0.00, z: 0.00,
              rot:[0, Math.PI/2, 0] },
};

/* The wearer's shoulder width, in world metres.

   Measured from BONES, not from mesh bounds. A SkinnedMesh's geometry.boundingBox is
   the BIND pose — arms straight out — so bounding the mesh returns the arm span, not
   the shoulder width. That read 1.78m on a 1.75m character, which would have scaled
   every breastplate to roughly the size of the whole man. Bone world positions are
   driven by the live animation and have no such problem. */
function bodyWidth(actor){
  let L = null, R = null;
  actor.root.traverse(o => {
    if(!o.isBone) return;
    if(!L && /^(upperarm_l|UpperArmL)$/i.test(o.name)) L = o;
    if(!R && /^(upperarm_r|UpperArmR)$/i.test(o.name)) R = o;
  });
  if(!L || !R) return 0.45;
  actor.root.updateMatrixWorld(true);
  const a = new THREE.Vector3().setFromMatrixPosition(L.matrixWorld);
  const b = new THREE.Vector3().setFromMatrixPosition(R.matrixWorld);
  // shoulder-joint separation is narrower than the body; widen to a torso measure
  return Math.max(0.15, a.distanceTo(b) * 1.35);
}

async function equipRigid(actor, key){
  if(!actor) return;
  unequipRigid(actor, key);
  const C = RIGID_GEAR[key]; if(!C) return;
  const g = await load(`assets/${C.file}.glb`).catch(()=>null);
  if(!g) return;

  let bone = null;
  actor.root.traverse(o => { if(!bone && o.isBone && C.bone.test(o.name)) bone = o; });
  if(!bone) return;

  const piece = new THREE.Group();
  g.scene.traverse(o => {
    if(!o.isMesh) return;
    const m = new THREE.Mesh(o.geometry, relight(o.material.clone()));
    m.castShadow = true; m.receiveShadow = true;
    m.userData._gear = true;
    o.updateWorldMatrix(true, false);
    m.applyMatrix4(o.matrixWorld);          // bake the prop's own internal transform
    piece.add(m);
  });
  if(!piece.children.length) return;

  // Recentre the prop on its own bounding box, so 'position' means what it says
  // rather than being offset by wherever the artist happened to place the origin.
  const local = new THREE.Box3().setFromObject(piece);
  const mid = local.getCenter(new THREE.Vector3());
  for(const c of piece.children) c.position.sub(mid);

  if(C.rot) piece.rotation.set(C.rot[0], C.rot[1], C.rot[2]);
  bone.add(piece);
  actor.root.updateMatrixWorld(true);

  // MEASURE, then correct. We do not predict what the nested bone/bind/model scales
  // will do to this mesh — we attach it, look at the result in world space, and
  // divide. That makes the fit independent of every transform above it.
  const target = bodyWidth(actor) * C.wide;
  const now = new THREE.Box3().setFromObject(piece);
  const w = Math.max(1e-4, now.max.x - now.min.x);
  piece.scale.multiplyScalar(target / w);

  // Same trick for placement: nudge in WORLD metres, converted into bone-local space.
  actor.root.updateMatrixWorld(true);
  const off = new THREE.Vector3(0, C.y || 0, C.z || 0);
  if(off.lengthSq() > 0){
    const inv = new THREE.Matrix4().copy(bone.matrixWorld).invert();
    const o0 = new THREE.Vector3(0,0,0).applyMatrix4(bone.matrixWorld);
    const o1 = o0.clone().add(off);
    piece.position.copy(o1.applyMatrix4(inv));
  }
  (actor._rigid = actor._rigid || {})[key] = piece;
  return piece;
}
function unequipRigid(actor, key){
  const p = actor && actor._rigid && actor._rigid[key];
  if(!p) return;
  if(p.parent) p.parent.remove(p);
  delete actor._rigid[key];
}

function tintMats(actor, matchName, hex){
  if(!actor) return;
  const col = new THREE.Color(hex);
  actor.root.traverse(o => {
    if(!o.isMesh) return;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for(const m of mats){
      if(!m || !m.name || !matchName.test(m.name)) continue;
      if(!m.userData._baseCol) m.userData._baseCol = m.color ? m.color.clone() : new THREE.Color('#fff');
      if(m.color){ m.color.copy(col); m.needsUpdate = true; }
    }
  });
}

    else if(a==='look'){ await applyClassLook(b.dataset.k); return; }
    else if(a==='equip'){ const k=b.dataset.k;

    else if(a==='rigid'){ const k=b.dataset.k;

      else await equipRigid(hero,k); }

/* ─────────────  FACES  ─────────────
   The Quaternius atlases have NO facial features painted anywhere — the characters are
   deliberately blank-faced, and their UVs are scattered across the sheet so painting a
   face into the texture isn't reliable. So we build one from geometry and bind it to
   the head bone, which means it animates with the character. */
/* Paint the face INTO THE TEXTURE.
   Geometry eyes were a mistake: they read fine head-on but protrude as visible blobs
   from any other angle, because a flat feature set can't follow a curved skull. Painted
   pixels are part of the surface, so they cannot float, cannot poke through, and cost
   nothing to render.
   The trick is finding WHERE on the atlas the face lives: we take the head mesh's
   front-facing vertices, and for each feature's 3D position we look up the UV of the
   nearest vertex. That maps a point on the model to a point on the texture. */
/* Face as a FLAT DECAL on the head plane.
   Two dead ends got us here, both worth recording:
     - Sphere/box features PROTRUDE. They read fine head-on but from any other angle they
       are visibly detached blobs floating off the skull.
     - Painting into the texture is IMPOSSIBLE on these models: they are flat-shaded atlas
       samplers whose head UVs span the whole sheet (u .002-.990, v .035-.998), so each
       polygon grabs one solid swatch. There is no contiguous face region to draw on.
   What works: these heads are flat-fronted low-poly, so a single ZERO-THICKNESS quad laid
   on the face plane and aligned to its normal has no volume to stick out, and carries the
   whole face as one drawn texture. */
function faceDecalTexture(opt){
  const S = 256;
  const c = document.createElement('canvas'); c.width = c.height = S;
  const x = c.getContext('2d');
  x.clearRect(0,0,S,S);
  const eyeY = S*0.42, eyeDX = S*0.20, R = S*0.085;
  const drawEye = (cx) => {
    x.fillStyle = opt.sclera || '#f6f2e8';
    x.beginPath(); x.ellipse(cx, eyeY, R*1.15, R*0.86, 0, 0, Math.PI*2); x.fill();
    x.fillStyle = opt.pupil || '#1d1712';
    x.beginPath(); x.ellipse(cx, eyeY + R*0.05, R*0.46, R*0.56, 0, 0, Math.PI*2); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.9)';
    x.beginPath(); x.arc(cx - R*0.24, eyeY - R*0.26, R*0.15, 0, Math.PI*2); x.fill();
  };

  const toLocal = new THREE.Matrix4().copy(actor.root.matrixWorld).invert();
  const box = new THREE.Box3().setFromObject(actor.root).applyMatrix4(toLocal);
  const H = box.max.y - box.min.y;
  const lo = box.min.y + H*FACE.bandLo, hi = box.min.y + H*FACE.bandHi;
  const SKIP = /(sword|axe|bow|staff|dagger|shield|weapon|pad|pauldron|cape)/i;

    if(SKIP.test(o.name||'')) return;

    new THREE.MeshBasicMaterial({ map:_faceTex, transparent:true, depthWrite:false,

    acc.x,
    minY + (maxY - minY) * FACE.eyeY + wide*0.06,
    frontZ + 0.0015);
  const worldPos = localPos.applyMatrix4(actor.root.matrixWorld);
  const worldNrm = nAcc.clone().transformDirection(actor.root.matrixWorld).normalize();
  const ws = head.getWorldScale(new THREE.Vector3()).x || 1;
  m.position.copy(head.worldToLocal(worldPos.clone()));

/* ─────────────  MOB RESKINS  ─────────────
   One base mesh → several genuinely different creatures, for the many Bladefall mobs
   that share a silhouette (rock/ice/marble/iron constructs).

   The catch with these packs: flat-colour models collapse every UV to a single point,
   so a texture map does nothing — every vertex samples one pixel. So we GENERATE UVs
   from object-space position (a cheap triplanar-ish projection), then paint a real
   procedural surface: lava fissures, ice facets, marble veining, corroded iron. That,
   plus per-slot materials, added geometry and emissive light, is a new creature rather
   than a recolour. */
function reprojectUVs(root){
  root.traverse(o => {
    if(!o.isMesh || !o.geometry) return;
    const g = o.geometry;
    if(g.userData._uvFixed) return;
    const pos = g.attributes.position, nor = g.attributes.normal;
    if(!pos) return;
    g.computeBoundingBox();
    const bb = g.boundingBox, sz = new THREE.Vector3().subVectors(bb.max, bb.min);
    const sx = sz.x||1, sy = sz.y||1, sz2 = sz.z||1;
    const uv = new Float32Array(pos.count*2);
    for(let i=0;i<pos.count;i++){
      const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
      let nx=0, ny=1, nz=0;
      if(nor){ nx=Math.abs(nor.getX(i)); ny=Math.abs(nor.getY(i)); nz=Math.abs(nor.getZ(i)); }
      let u, v;
      if(ny >= nx && ny >= nz){ u = (x-bb.min.x)/sx; v = (z-bb.min.z)/sz2; }   // top/bottom
      else if(nx >= nz){        u = (z-bb.min.z)/sz2; v = (y-bb.min.y)/sy; }   // sides
      else {                    u = (x-bb.min.x)/sx;  v = (y-bb.min.y)/sy; }   // front/back
      uv[i*2] = u; uv[i*2+1] = v;
    }
    g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
    g.userData._uvFixed = true;
  });
}

      const r = S*(0.01+rnd()*0.06);

    }
    x.globalAlpha = 1;

      let px = rnd()*S, py = rnd()*S, a = rnd()*7;

    }

  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;

// ambient particles for skinned mobs (embers rising / frost drifting / steam)
function mobParticles(dt){
  for(const e of enemies){
    if(e.dead || !e.mobSkin || !e.mobSkin.embers) continue;
    const E = e.mobSkin.embers;
    e._emT = (e._emT || 0) + dt;
    if(e._emT < Math.max(0.45, E.rate*3)) continue;
    e._emT = 0;
    const sp = new THREE.Sprite(addMat(E.color, TEX.mote, 0.9));
    const s = E.size || 0.22; sp.scale.setScalar(s);
    sp.position.copy(e.root.position).add(new THREE.Vector3(
      (Math.random()-0.5)*0.7, 0.35 + Math.random()*0.9, (Math.random()-0.5)*0.7));
    scene.add(sp);
    const rise = (E.up==null?1.5:E.up) * (0.6+Math.random()*0.8);
    push({ life:0.95, t:0, step(k, d){
      sp.position.y += rise*d;
      sp.material.opacity = 0.9*(1-k);
      const q = s*(1 + k*0.5); sp.scale.setScalar(q);
    }, done(){ killObj(sp); } });
  }
}

let redesignParts = [];
function clearRedesign(){
  for(const p of redesignParts){
    if(p.bone && p.obj.parent) p.obj.parent.remove(p.obj);
    else scene.remove(p.obj);
    p.obj.traverse && p.obj.traverse(o => { if(o.isMesh||o.isSprite){
      if(o.geometry) o.geometry.dispose();
      const m=o.material; if(m) (Array.isArray(m)?m:[m]).forEach(x=>x&&x.dispose()); } });
  }
  redesignParts = [];
}
function applyRedesign(actor, sk){
  clearRedesign();
  const glowEyes = !!(sk && sk.redesign && /dreadknight|wraithblade/.test(sk.redesign));

  if(!sk || !sk.redesign || !REDESIGNS[sk.redesign]) return;
  const parts = REDESIGNS[sk.redesign](actor, sk);
  for(const p of parts){
    if(p.bone) p.bone.add(p.obj);
    else scene.add(p.obj);
  }
  redesignParts = parts;
}
function updateRedesign(t, dt){
  if(!redesignParts.length || !hero) return;
  const P = hero.root.position, yaw = hero.root.rotation.y;
  for(const p of redesignParts){
    if(p.bone) continue;                                    // bone-parented parts ride the rig
    const o = p.obj;
    if(p.sway){
      o.position.copy(P); o.rotation.y = yaw + Math.sin(t*2.2)*0.05;
      const lean = Math.min(0.5, vel.length()*0.06);
      o.rotation.x = lean;
    } else if(p.haloY != null){
      o.position.copy(P).setY(p.haloY + Math.sin(t*1.6)*0.05);
      o.rotation.z += (p.spin||1) * dt;
    } else if(p.orbit){
      o.position.copy(P).setY(p.orbitY + Math.sin(t*1.3)*0.08);
      o.rotation.y = t*0.8;
      o.children.forEach((c,i) => { c.rotation.x = t*1.7 + i; c.rotation.y = t*1.2; });
    } else if(p.auraY != null){
      o.position.copy(P).setY(p.auraY);
      const s = 2.0 + Math.sin(t*2.4)*0.16; o.scale.set(s,s,1);
    } else if(p.poolY != null){
      o.position.copy(P).setY(p.poolY);
      const s = 1.5 + Math.sin(t*1.8)*0.12; o.scale.set(s,s,1);
    } else if(p.trail){
      o.children.forEach((c,i) => {
        const lag = 0.10*(i+1);
        c.position.set(P.x - Math.sin(yaw)*lag*2.2, p.trailY - i*0.06, P.z - Math.cos(yaw)*lag*2.2);
        c.material.opacity = 0.55 * (1 - i/6);
      });
    } else {
      o.position.copy(P); o.rotation.y = yaw;               // pauldron spikes etc.
    }
  }
}

/* ─────────────  MIXAMO  ─────────────
   Mixamo characters are free for commercial use and ship rigged with faces and real
   textures, which is the gap every free low-poly pack left us with. They use their own
   bone naming ('mixamorig:Hips'), so our 86-clip library will not bind to them by name
   the way it binds to the UE-named rigs. Rather than hand-map in Blender, we rename the
   animation tracks at load: UE bone -> Mixamo bone. Both are ordinary humanoid skeletons,
   so this is a mechanical correspondence, not an approximation.

   POSITION tracks are dropped on purpose. Bone lengths differ between the two rigs, so a
   translation authored for one skeleton is simply wrong on the other and shows up as
   stretched or dislocated limbs. Rotations transfer cleanly; movement is code-driven here
   anyway, so we lose nothing by ignoring root motion. */
const UE_TO_MIXAMO = {
  pelvis:'mixamorig:Hips',
  spine_01:'mixamorig:Spine', spine_02:'mixamorig:Spine1', spine_03:'mixamorig:Spine2',
  neck_01:'mixamorig:Neck', Head:'mixamorig:Head',
  clavicle_l:'mixamorig:LeftShoulder', upperarm_l:'mixamorig:LeftArm',
  lowerarm_l:'mixamorig:LeftForeArm',  hand_l:'mixamorig:LeftHand',
  clavicle_r:'mixamorig:RightShoulder', upperarm_r:'mixamorig:RightArm',
  lowerarm_r:'mixamorig:RightForeArm',  hand_r:'mixamorig:RightHand',
  thigh_l:'mixamorig:LeftUpLeg',  calf_l:'mixamorig:LeftLeg',
  foot_l:'mixamorig:LeftFoot',    ball_l:'mixamorig:LeftToeBase',
  thigh_r:'mixamorig:RightUpLeg', calf_r:'mixamorig:RightLeg',
  foot_r:'mixamorig:RightFoot',   ball_r:'mixamorig:RightToeBase',
};
for(const [side, S] of [['l','Left'],['r','Right']]){
  for(const [ue, mx] of [['index','HandIndex'],['middle','HandMiddle'],['pinky','HandPinky'],
                         ['ring','HandRing'],['thumb','HandThumb']]){
    for(let i=1;i<=3;i++) UE_TO_MIXAMO[`${ue}_0${i}_${side}`] = `mixamorig:${S}${mx}${i}`;
  }
}
/* Resolve the map's target names against the bones the model ACTUALLY has.
   Loaders disagree about punctuation — three's FBXLoader strips the colon, so Mixamo's
   'mixamorig:Hips' arrives as 'mixamorigHips'. Hardcoding either spelling breaks the
   moment the other shows up, so match on a punctuation-free, case-free key instead. */
const boneKey = n => String(n).toLowerCase().replace(/[^a-z0-9]/g, '');
function resolveMap(root, map){
  const have = new Map();
  root.traverse(o => { if(o.isBone && !have.has(boneKey(o.name))) have.set(boneKey(o.name), o.name); });
  const out = {}; let hit = 0, miss = 0;
  for(const [ue, want] of Object.entries(map)){
    const real = have.get(boneKey(want));
    if(real){ out[ue] = real; hit++; } else miss++;
  }
  console.log(`[retarget] mapped ${hit} bones, ${miss} unmatched`);
  return out;
}
function retargetClips(clips, map){
  const out = [];
  for(const c of clips){
    const tracks = [];
    for(const tr of c.tracks){
      const i = tr.name.lastIndexOf('.');
      const node = tr.name.slice(0, i), prop = tr.name.slice(i + 1);
      const to = map[node];
      if(!to) continue;                 // bone has no counterpart — drop rather than guess
      if(prop === 'position') continue; // see note above: bone lengths differ
      const nt = tr.clone(); nt.name = to + '.' + prop; tracks.push(nt);
    }
    if(tracks.length) out.push(new THREE.AnimationClip(c.name, c.duration, tracks));
  }
  return out;
}
const fbxLoader = new FBXLoader();
const loadFBX = url => new Promise((res, rej) =>
  fbxLoader.load(url, o => { bump(); res(o); }, undefined, rej));

async function loadMixamoChar(def){
  const [obj, clips] = await Promise.all([
    loadFBX(`assets/mixamo/${def.file}.fbx`).catch(e => { console.warn('FBX fail', e); return null; }),
    loadUAL(),
  ]);
  if(!obj) return null;
  obj.traverse(o => {
    if(!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for(const m of mats){ if(m && m.map) m.map.colorSpace = THREE.SRGBColorSpace; }
  });
  /* Mixamo FBX arrives Z-up, so the character loads lying face-down. Actor then measures
     its bounding-box HEIGHT to normalise scale — which for a prone model is the body's
     thickness, so it also scaled them to giants. Stand it up inside a wrapper: Actor
     resets scale and position on the object it's handed, but not on its children, so the
     correction survives. */
  const rig = resolveMap(obj, UE_TO_MIXAMO);
  const wrap = new THREE.Group();
  obj.rotation.x = -Math.PI / 2;
  wrap.add(obj);

  return { scene: wrap, animations: retargetClips(clips, rig) };
}

/* ─────────────  ACTOR  ───────────── */
class Actor {
  constructor(gltf, def, targetH){
    this.def = def;
    this.targetH = targetH || HERO_H;
    this.root = new THREE.Group();
    const model = gltf.scene;
    // normalise: Quaternius rigs vary in unit scale — fit every hero to HERO_H.
    // Reset first so re-normalising an already-scaled scene is idempotent (setScalar
    // REPLACES scale, so measuring a scaled model and re-setting would double it).
    model.position.set(0,0,0); model.updateMatrixWorld(true);
    /* Escape hatch for rigs a loader has already sized. Nothing sets it today: Box3
       normalisation measured correctly on every character tested (all landed on 1.75m),
       and bypassing it produced heights of 76m / 117m / 550m. Kept as a hook, not a fix. */
    if(!(def && def.preScaled)){
      model.scale.set(1,1,1); model.updateMatrixWorld(true);
      const b = boxOf(model), size = b.getSize(new THREE.Vector3());
      const s = this.targetH / Math.max(0.0001, size.y);
      model.scale.setScalar(s);
    }
    const b2 = boxOf(model);
    model.position.y -= b2.min.y;                     // feet on the floor
    model.position.x -= (b2.min.x + b2.max.x)/2 ;
    model.position.z -= (b2.min.z + b2.max.z)/2 ;
    prep(model, { shadow:true });
    this.root.add(model);
    this.model = model;

    this.mixer = new THREE.AnimationMixer(model);
    this.clips = {};
    for(const c of gltf.animations) this.clips[c.name] = c;
    this.actions = {};
    this.current = null;
    this.locked = 0;                                   // seconds of non-interruptible action
    this.play('idle');
  }
  find(role){
    const want = this.def.clips[role] || [];
    for(const n of want) if(this.clips[n]) return this.clips[n];
    return null;
  }
  action(role, clipOverride){
    const clip = clipOverride || this.find(role);
    if(!clip) return null;
    const key = role + '|' + clip.name;
    if(!this.actions[key]){
      const a = this.mixer.clipAction(clip);
      this.actions[key] = a;
    }
    return this.actions[key];
  }
  play(role, { loop=true, fade=0.18, clip=null, speed=1 } = {}){
    const a = this.action(role, clip);
    if(!a || a === this.current) { if(a) a.timeScale = speed; return a; }
    a.reset();
    a.timeScale = speed;
    a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    a.clampWhenFinished = !loop;
    a.fadeIn(fade).play();
    if(this.current) this.current.fadeOut(fade);
    this.current = a;
    return a;
  }
  once(role, speed=1){
    const clip = this.find(role); if(!clip) return 0;
    this.play(role, { loop:false, fade:0.08, speed });
    const dur = clip.duration / speed;
    this.locked = dur * 0.82;                          // let the tail blend back to idle
    return dur;
  }
  /* ── upper-body layering ──
     Real Bladefall never roots you: p.atkTimer only drives the arm pose, the movement
     code never reads it, so you run and swing at the same time. Skeletal clips are
     full-body by default, so we synthesise an upper-body-only version by dropping every
     track that targets a leg/foot/hip bone. That plays OVER the locomotion instead of
     replacing it — swing while sprinting, exactly like the voxel game. */
  /* Which bones must the attack layer NEVER touch?
     Name matching is not enough: on this rig the chain is Root > Body > UpperLeg, and
     the attack clip animates Body — a PARENT of the legs — so the whole lower body
     inherited the swing even after the leg bones themselves were excluded. That parent/
     child mismatch is the bowlegged twist. So derive the set from the actual skeleton:
     every leg bone, everything beneath it, and every ancestor above it. */
  lowerBones(){
    if(this._lowerSet) return this._lowerSet;
    const LEGWORD = /(leg|thigh|shin|calf|knee|foot|ankle|toe|ball|poletarget)/i;
    const legs = [];
    this.root.traverse(o => { if(o.isBone && LEGWORD.test(o.name)) legs.push(o); });
    const set = new Set();
    const addBelow = b => { set.add(b.name); for(const c of b.children) if(c.isBone) addBelow(c); };
    for(const L of legs){
      addBelow(L);
      let c = L.parent;
      while(c && c.isBone){ set.add(c.name); c = c.parent; }   // ancestors drive the legs too
    }
    this._lowerSet = set;
    return set;
  }
  upperClip(clip){
    if(!clip) return null;
    if(!this._upper) this._upper = new Map();
    if(this._upper.has(clip.name)) return this._upper.get(clip.name);
    const lower = this.lowerBones();
    const tracks = clip.tracks.filter(t => !lower.has(t.name.split('.')[0]));
    const made = tracks.length && tracks.length < clip.tracks.length
      ? new THREE.AnimationClip(clip.name + '__upper', clip.duration, tracks)
      : null;
    this._upper.set(clip.name, made);
    return made;
  }
  /* play an action on the arms only; returns true if layering worked */
  layer(role, { speed=1, clip=null } = {}){
    const base = clip || this.find(role);
    const up = this.upperClip(base);
    if(!up) return false;
    if(this._layerAct){ this._layerAct.stop(); }
    const a = this.mixer.clipAction(up);
    a.reset(); a.timeScale = speed;
    a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = false;
    a.weight = 1; a.fadeIn(0.05).play();
    this._layerAct = a;
    this._layerT = up.duration / speed;
    return true;
  }
  update(dt){ this.mixer.update(dt); if(this.locked>0) this.locked -= dt; }
}

/* ─────────────  VFX TOOLKIT  ─────────────
   The old effects looked "voxelly" because they were square THREE.Points and hard-edged
   rings. Everything here is built from soft, additively-blended canvas textures instead:
   a radial falloff mote, a soft-edged ring, and a beam gradient. Additive blending is
   what makes light read as light rather than as coloured boxes. */
function canvasTex(draw, size){
  const c = document.createElement('canvas'); c.width = c.height = size || 128;
  draw(c.getContext('2d'), c.width);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true;
  return t;
}
const UNIT_PLANE = new THREE.PlaneGeometry(1,1);
const TEX = {
  mote: canvasTex((x,s) => {                       // soft glowing dot
    const g = x.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    g.addColorStop(0,   'rgba(255,255,255,1)');
    g.addColorStop(0.25,'rgba(255,255,255,0.85)');
    g.addColorStop(0.55,'rgba(255,255,255,0.28)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0,0,s,s);
  }, 128),
  ring: canvasTex((x,s) => {                       // soft annulus with a bright leading edge
    const g = x.createRadialGradient(s/2,s/2,s*0.20, s/2,s/2,s/2);
    g.addColorStop(0,   'rgba(255,255,255,0)');
    g.addColorStop(0.55,'rgba(255,255,255,0.10)');
    g.addColorStop(0.82,'rgba(255,255,255,0.95)');
    g.addColorStop(0.95,'rgba(255,255,255,0.35)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0,0,s,s);
  }, 256),
  beam: canvasTex((x,s) => {                       // vertical light shaft, hot core
    const g = x.createLinearGradient(0,0,s,0);
    g.addColorStop(0,   'rgba(255,255,255,0)');
    g.addColorStop(0.38,'rgba(255,255,255,0.55)');
    g.addColorStop(0.5, 'rgba(255,255,255,1)');
    g.addColorStop(0.62,'rgba(255,255,255,0.55)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0,0,s,s);
  }, 64),
  slash: canvasTex((x,s) => {                      // crescent sweep for melee arcs
    x.translate(s/2,s/2);
    for(let i=0;i<26;i++){
      const t = i/25, a0 = -1.15 + t*2.3;
      x.globalAlpha = Math.sin(t*Math.PI) * 0.95;
      x.strokeStyle = 'rgba(255,255,255,1)';
      x.lineWidth = 5 + Math.sin(t*Math.PI)*9;
      x.beginPath(); x.arc(0,0, s*0.36, a0, a0+0.1); x.stroke();
    }
  }, 256),
};
const _matCache = new Map();
function addMat(color, tex, opacity){
  // Sprites that share a material still cost a draw call each, so this is only for the
  // few one-off sprites; bulk particles go through THREE.Points below (1 draw call).
  const key = color + '|' + (tex ? tex.uuid : 'm');
  let m = _matCache.get(key);
  if(!m){
    m = new THREE.SpriteMaterial({ map:tex||TEX.mote, color:new THREE.Color(color),
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
    _matCache.set(key, m);
  }
  const c = m.clone();                    // clone shares the map/program, cheap
  if(opacity != null) c.opacity = opacity;
  return c;
}

const LIGHT_POOL = [];

function takeLight(){ const l = LIGHT_POOL[_lightRR++ % LIGHT_POOL.length]; return l; }

function groundQuad(tex, color, size, opacity){

      opacity:opacity==null?1:opacity, depthWrite:false, blending:THREE.AdditiveBlending,
      side:THREE.DoubleSide }));
  m.rotation.x = -Math.PI/2; m.scale.set(size,size,1);
  return m;
}

/* ─────────────  VFX  ─────────────
   Every effect is assembled from the soft additive primitives above and driven by a
   single update list. Each entry exposes step(k) where k runs 0..1 over its life. */
const vfx = [];
function push(o){ vfx.push(o); return o; }
function killObj(o){
  if(!o) return;
  scene.remove(o);
  if(o.geometry && o.geometry !== UNIT_PLANE) o.geometry.dispose();
  const m = o.material;
  if(m){ (Array.isArray(m)?m:[m]).forEach(x=>x && x.dispose()); }
}

/* soft expanding ground ring */
function ringWave(pos, color, maxR, life, y){
  const q = groundQuad(TEX.ring, color, 0.6, 1);
  q.position.copy(pos).setY((y==null?0.05:y));
  scene.add(q);
  return push({ life: life||0.85, t:0, step(k){
    const r = 0.6 + (maxR-0.6) * (1 - Math.pow(1-k, 2.2));   // fast out, ease to a stop
    q.scale.set(r, r, 1);
    q.material.opacity = Math.pow(1-k, 1.5);
  }, done(){ killObj(q); } });
}
/* a burst of soft motes — ONE THREE.Points draw call regardless of particle count.
   PointsMaterial takes the same soft radial texture, so it looks identical to the old
   per-sprite version while costing 1 draw call instead of N. */
function motes(pos, color, n, opt){
  opt = opt || {};
  n = Math.min(n, 48);
  const g = new THREE.BufferGeometry();
  const arr = new Float32Array(n*3);
  const vel3 = [];
  for(let i=0;i<n;i++){
    arr[i*3] = pos.x; arr[i*3+1] = pos.y; arr[i*3+2] = pos.z;
    const a = Math.random()*Math.PI*2;
    const rs = (opt.spread==null?3.4:opt.spread) * (0.35 + Math.random());
    vel3.push(new THREE.Vector3(Math.cos(a)*rs, (opt.up==null?3.2:opt.up)*(0.4+Math.random()), Math.sin(a)*rs));
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr,3));
  const mat = new THREE.PointsMaterial({ map:TEX.mote, color:new THREE.Color(color),
    size:(opt.size||0.42)*2.2, transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending, sizeAttenuation:true });
  const pts = new THREE.Points(g, mat);
  scene.add(pts);
  const grav = opt.grav==null ? 7.5 : opt.grav;
  return push({ life: opt.life||0.9, t:0, step(k, dt){
    for(let i=0;i<n;i++){
      const v = vel3[i];
      v.y -= grav*dt; v.x *= 0.965; v.z *= 0.965;
      arr[i*3] += v.x*dt; arr[i*3+1] += v.y*dt; arr[i*3+2] += v.z*dt;
      if(arr[i*3+1] < 0.06){ arr[i*3+1] = 0.06; v.y *= -0.28; }
    }
    g.attributes.position.needsUpdate = true;
    mat.opacity = Math.pow(1-k, 1.35);
  }, done(){ killObj(pts); } });
}
/* a flash of light that fades */
function flash(pos, color, power, life){
  const li = takeLight();
  li.color.set(color); li.position.copy(pos); li.visible = true;
  return push({ life: life||0.45, t:0, step(k){ li.intensity = (power||14) * Math.pow(1-k, 2); },
                done(){ li.intensity = 0; li.visible = false; } });
}
/* crescent slash sweeping around a point */
function slashArc(pos, color, radius, life, tilt, spin0){
  const m = new THREE.Mesh(UNIT_PLANE,
    new THREE.MeshBasicMaterial({ map:TEX.slash, color:new THREE.Color(color), transparent:true,
      depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide }));
  m.position.copy(pos);
  m.rotation.set(-Math.PI/2 + (tilt||0), 0, spin0||0);
  m.scale.setScalar(radius*2);
  scene.add(m);
  return push({ life: life||0.42, t:0, step(k){
    m.rotation.z = (spin0||0) + k*3.4;
    m.material.opacity = Math.sin((1-k)*Math.PI*0.9);
    const s = radius*2*(0.75 + k*0.5); m.scale.setScalar(s);
  }, done(){ killObj(m); } });
}
/* a travelling projectile. The trail is a single Points ring-buffer that follows the
   head, so a projectile costs 2 draw calls total instead of ~50 spawned sprites. */
const TRAIL_N = 14;
function projectile(from, dir, color, opt){
  opt = opt || {};
  const head = new THREE.Sprite(addMat(color, TEX.mote, 1));
  head.scale.setScalar(opt.size || 0.75);
  head.position.copy(from);
  scene.add(head);

  const tg = new THREE.BufferGeometry();
  const tarr = new Float32Array(TRAIL_N*3);
  for(let i=0;i<TRAIL_N;i++){ tarr[i*3]=from.x; tarr[i*3+1]=from.y; tarr[i*3+2]=from.z; }
  tg.setAttribute('position', new THREE.BufferAttribute(tarr,3));
  const tmat = new THREE.PointsMaterial({ map:TEX.mote, color:new THREE.Color(color),
    size:(opt.size||0.75)*1.5, transparent:true, opacity:0.7, depthWrite:false,
    blending:THREE.AdditiveBlending, sizeAttenuation:true });
  const trail = new THREE.Points(tg, tmat);
  scene.add(trail);

  const speed = opt.speed || 16, range = opt.range || 12;
  const life = range/speed;
  let write = 0;
  return push({ life, t:0, step(k, dt){
    head.position.addScaledVector(dir, speed*dt);
    // ring-buffer the trail so it lags behind the head
    tarr[write*3] = head.position.x; tarr[write*3+1] = head.position.y; tarr[write*3+2] = head.position.z;
    write = (write+1) % TRAIL_N;
    tg.attributes.position.needsUpdate = true;
    tmat.opacity = 0.7 * (1 - k*0.5);
    if(!opt.noDamage) for(const e of enemies){
      if(e.dead || e._hitBy === head.id) continue;
      if(e.root.position.distanceTo(head.position) < 1.3){
        e._hitBy = head.id;
        hurtEnemy(e, Math.round((opt.dmg||22) * (0.85+Math.random()*0.3)), Math.random()<0.25);
      }
    }
  }, done(){
    const pnt = head.position.clone();
    ringWave(pnt, color, 2.6, 0.5, 0.06);
    motes(pnt, color, 12, { spread:3.0, up:2.4, life:0.6, size:0.34 });
    if(!opt.quiet) flash(pnt, color, 9, 0.3);          // volleys skip the light
    killObj(head); killObj(trail);
  } });
}
/* vertical light column (beams, pillars, meteors landing) */
function pillar(pos, color, radius, height, life){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius*1.25, height, 18, 1, true),
    new THREE.MeshBasicMaterial({ map:TEX.beam, color:new THREE.Color(color), transparent:true,
      depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide }));
  m.position.copy(pos).setY(height/2);
  scene.add(m);
  return push({ life: life||0.6, t:0, step(k){
    m.material.opacity = Math.pow(1-k, 1.2);
    const w = 1 + k*0.5; m.scale.set(w,1,w);
    m.rotation.y += 0.06;
  }, done(){ killObj(m); } });
}
/* lingering cloud that ticks damage */
function cloud(pos, color, radius, life, dps){
  const grp = new THREE.Group(); grp.position.copy(pos); scene.add(grp);
  const puffs = [];
  for(let i=0;i<18;i++){
    const sp = new THREE.Sprite(addMat(color, TEX.mote, 0.55));
    const sc = radius*(0.5+Math.random()*0.7); sp.scale.set(sc,sc,1);
    const a = Math.random()*Math.PI*2, r = Math.random()*radius*0.8;
    sp.position.set(Math.cos(a)*r, 0.3+Math.random()*0.9, Math.sin(a)*r);
    puffs.push({ sp, a, r, ph: Math.random()*6 }); grp.add(sp);
  }
  let tick = 0;
  return push({ life: life||3.0, t:0, step(k, dt){
    for(const p of puffs){
      p.a += dt*0.5;
      p.sp.position.x = Math.cos(p.a)*p.r;
      p.sp.position.z = Math.sin(p.a)*p.r;
      p.sp.position.y += Math.sin(performance.now()*0.001 + p.ph)*dt*0.25;
      p.sp.material.opacity = 0.55 * Math.sin(Math.min(1,k*4)*Math.PI*0.5) * Math.pow(1-k, 0.7);
    }
    tick += dt;
    if(tick > 0.5 && dps){ tick = 0;
      for(const e of enemies){ if(e.dead) continue;
        if(e.root.position.distanceTo(grp.position) < radius) hurtEnemy(e, Math.round(dps), false); }
    }
  }, done(){ grp.children.forEach(killObj); scene.remove(grp); } });
}

function stepVFX(dt){
  for(let i=vfx.length-1;i>=0;i--){
    const f = vfx[i];
    f.t += dt;
    const k = Math.min(1, f.t / f.life);
    try{ f.step(k, dt); }catch(e){}
    if(f.t >= f.life){ try{ f.done && f.done(); }catch(e){} vfx.splice(i,1); }
  }
}

  for(const e of enemies){
    if(e.dead) continue;
    if(e.root.position.distanceTo(pos) <= radius) hurtEnemy(e, Math.round(dmg*(0.85+Math.random()*0.3)), crit);
  }
}

let camYaw = 0.0, camPitch = 0.34, camDist = 7.2;
let dragging = false, lastX = 0, lastY = 0, dragId = null;
function onDown(e){
  if(e.target.closest && e.target.closest('#touch, #classes')) return;
  dragging = true; dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
}
function onMove(e){
  if(!dragging || e.pointerId !== dragId) return;
  camYaw   -= (e.clientX - lastX) * 0.0055;
  camPitch  = Math.max(-0.15, Math.min(1.15, camPitch + (e.clientY - lastY) * 0.0042));
  lastX = e.clientX; lastY = e.clientY;
}
function onUp(e){ if(e.pointerId===dragId){ dragging = false; dragId = null; } }
canvas.addEventListener('pointerdown', onDown);
addEventListener('pointermove', onMove);
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);

(function stickSetup(){
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let id = null, cx=0, cy=0, R=52;
  const set = (dx,dy)=>{
    const d = Math.hypot(dx,dy), c = d>R ? R/d : 1;
    knob.style.transform = `translate(${dx*c}px,${dy*c}px)`;
    touchVec.set((dx*c)/R, (dy*c)/R);
  };
  stick.addEventListener('pointerdown', e=>{
    id = e.pointerId; const r = stick.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
    set(e.clientX-cx, e.clientY-cy); stick.setPointerCapture(id);
  });
  stick.addEventListener('pointermove', e=>{ if(e.pointerId!==id) return; set(e.clientX-cx, e.clientY-cy); });
  const end = e=>{ if(e.pointerId!==id) return; id=null; knob.style.transform=''; touchVec.set(0,0); };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
})();

/* ── floating HP bar (a sprite so it always faces the camera) ── */
function makeHpBar(){
  const cvs = document.createElement('canvas'); cvs.width = 128; cvs.height = 20;
  const tex = new THREE.CanvasTexture(cvs);
  const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, depthTest:false, transparent:true }));
  spr.scale.set(1.15, 0.18, 1);
  const draw = f => {
    const c = cvs.getContext('2d');
    c.clearRect(0,0,128,20);
    c.fillStyle = 'rgba(8,6,10,.82)'; c.fillRect(0,4,128,12);
    c.fillStyle = f > .5 ? '#5fd06a' : f > .22 ? '#e0b040' : '#e04a3a';
    c.fillRect(2,6,124*Math.max(0,f),8);
    c.strokeStyle = 'rgba(230,200,150,.55)'; c.lineWidth = 1.5; c.strokeRect(1,4.5,126,11);
    tex.needsUpdate = true;
  };
  draw(1);
  return { spr, draw };
}

/* ── damage numbers ──
   Previously every hit allocated a canvas AND a fresh GPU texture. A single Fan of
   Knives can land ~28 hits in one frame, so that was ~28 texture uploads mid-frame —
   the recurring stall. Now the glyphs are pre-rendered ONCE at boot and each number is
   assembled from cached digit sprites: zero allocation per hit. */
const GLYPHS = '0123456789+';
const _glyphMat = { normal:{}, crit:{} };
(function buildGlyphs(){
  for(const crit of [false, true]){
    for(const ch of GLYPHS){
      const c = document.createElement('canvas'); c.width = 64; c.height = 80;
      const x = c.getContext('2d');
      x.font = 'bold ' + (crit ? 62 : 52) + 'px system-ui, sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.lineWidth = 8; x.strokeStyle = 'rgba(0,0,0,.9)';
      x.strokeText(ch, 32, 40);
      x.fillStyle = crit ? '#ffd24a' : '#fff2e0';
      x.fillText(ch, 32, 40);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      _glyphMat[crit ? 'crit' : 'normal'][ch] =
        new THREE.SpriteMaterial({ map:t, depthTest:false, transparent:true });
    }
  }
})();
const dmgTexts = [];
function damageNumber(pos, amount, crit){
  const str = String(amount);
  const set = _glyphMat[crit ? 'crit' : 'normal'];
  const grp = new THREE.Group();
  const w = crit ? 0.34 : 0.28;
  for(let i=0;i<str.length && i<5;i++){
    const m = set[str[i]];
    if(!m) continue;
    const sp = new THREE.Sprite(m.clone());          // clone shares map + program
    sp.scale.set(w, w*1.25, 1);
    sp.position.x = (i - (str.length-1)/2) * w * 0.72;
    grp.add(sp);
  }
  grp.position.copy(pos);
  scene.add(grp);
  dmgTexts.push({ spr:grp, t:0, life:0.85, vy:1.7 });
}

/* ── enemies ── */
async function spawnEnemy(x, z, mIdx){
  const M = (typeof mIdx === 'string')
    ? (MONSTERS.find(q => q.label === mIdx) || MONSTERS[0])
    : MONSTERS[mIdx % MONSTERS.length];
  const g = await load(`assets/monsters/${M.file}.glb`).catch(()=>null);
  if(!g) return null;
  // Quaternius exports name clips "CharacterArmature|Idle" — normalise so RIGS can find them
  for(const c of g.animations) c.name = c.name.split('|').pop();
  const e = new Actor(g, { clips: RIGS[M.rig] || RIGS.ground }, M.h * MOB_SCALE);
  if(M.flyY) e.root.position.y = M.flyY;
  if(M.skin) applyMobSkin(e, M.skin);
  e.root.position.set(x, 0, z);
  e.def2 = M;
  e.maxHp = M.hp; e.hp = M.hp; e.dead = false; e.hitFlash = 0; e.swingCd = 1 + Math.random()*2;
  const bar = makeHpBar();
  bar.spr.position.y = M.h + 0.42;
  e.root.add(bar.spr);
  e.bar = bar;
  scene.add(e.root);
  enemies.push(e);
  return e;
}
function hurtEnemy(e, amount, crit){
  if(e.dead) return;
  e.hp -= amount;
  e.bar.draw(Math.max(0, e.hp / e.maxHp));
  damageNumber(e.root.position.clone().add(new THREE.Vector3((Math.random()-.5)*.5, 2.0, 0)), amount, crit);
  if(e.hp <= 0){
    e.dead = true;
    e.once('death', 1.0);
    e.bar.spr.visible = false;
    kills++; updateKills();
    setTimeout(()=>{                              // fade out, then respawn it so there's always something to fight
      scene.remove(e.root);
      const i = enemies.indexOf(e); if(i>=0) enemies.splice(i,1);
      disposeTree(e.root);
      const spot = ENEMY_SPOTS[Math.floor(Math.random()*ENEMY_SPOTS.length)];
      spawnEnemy(spot.x + (Math.random()-.5)*2.5, spot.z + (Math.random()-.5)*2.5, spot.m);
    }, 2600);
  } else {
    e.once('hit', 1.2);
    e.hitFlash = 0.16;
  }
}
function updateKills(){
  const el = document.getElementById('kills');
  if(el) el.textContent = kills === 0 ? '' : (kills + (kills===1 ? ' foe felled' : ' foes felled'));
}

/* ── hero health ── */
let heroHp = 100, heroMaxHp = 100, hurtCd = 0;
function updateHeroHp(){
  const f = Math.max(0, heroHp/heroMaxHp);
  const fill = document.getElementById('hpfill'), txt = document.getElementById('hptxt');
  if(fill){ fill.style.width = (f*100)+'%';
    fill.style.background = f > .5 ? 'linear-gradient(90deg,#4fae5c,#7ad06a)'
                          : f > .22 ? 'linear-gradient(90deg,#b8862a,#e0b040)'
                                    : 'linear-gradient(90deg,#a33228,#e04a3a)'; }
  if(txt) txt.textContent = Math.max(0, Math.round(heroHp)) + ' / ' + heroMaxHp;
}
function hurtHero(amount){
  if(hurtCd > 0 || rollT > 0) return;                 // i-frames while rolling
  hurtCd = 0.55;
  heroHp = Math.max(0, heroHp - amount);
  updateHeroHp();
  document.body.animate(
    [{ filter:'brightness(1.5) saturate(.6)' }, { filter:'none' }],
    { duration:180, easing:'ease-out' });
  if(hero) hero.once('hit', 1.3);
  if(heroHp <= 0){                                    // no death screen in a slice — just get back up
    heroHp = heroMaxHp; updateHeroHp();
    if(hero) hero.root.position.set(0, 0, 4);
    for(const e of enemies) e.swingCd = 2.5;
  }
}

/* ── hero actions ── */
function strike(reach, arc, dmgMin, dmgMax){      // damage everything in a cone in front of the hero
  const fx = Math.sin(hero.root.rotation.y), fz = Math.cos(hero.root.rotation.y);
  for(const e of enemies){
    if(e.dead) continue;
    const dx = e.root.position.x - hero.root.position.x;
    const dz = e.root.position.z - hero.root.position.z;
    const d = Math.hypot(dx, dz);
    if(d > reach) continue;
    if(d > 0.3 && (dx*fx + dz*fz)/d < arc) continue;
    const crit = Math.random() < 0.22;
    const dmg = Math.round((dmgMin + Math.random()*(dmgMax-dmgMin)) * (crit ? 2 : 1));
    hurtEnemy(e, dmg, crit);
  }
}
function doAttack(){
  if(!hero || hero.locked>0 || rollT>0) return;
  const list = heroDef.clips.attack.filter(n=>hero.clips[n]);
  const name = list.length ? list[atkFlip++ % list.length] : null;
  if(!name) return;
  const clip = hero.clips[name];
  if(hero.layer('attack', { speed:ATK_SPEED, clip })){
    hero.locked = 0;                                    // arms only — legs keep running
    hero.swingT = clip.duration/ATK_SPEED*0.8;
  } else {                                              // rig has no usable bone names
    hero.play('attack', { loop:false, fade:.07, clip, speed:ATK_SPEED });
    hero.locked = clip.duration/ATK_SPEED*0.55;
  }
  setTimeout(()=>{ if(hero) strike(2.5, 0.25, 9, 16); }, 110);   // land the hit mid-swing
}
function doRoll(){
  if(!hero || rollT>0 || hero.locked>0 || !grounded) return;
  const d = moveDir();
  rollDir.copy(d.lengthSq()>0.01 ? d : new THREE.Vector3(Math.sin(hero.root.rotation.y),0,Math.cos(hero.root.rotation.y)));
  rollT = 0.62; hero.once('roll', 1.15);
}
function doJump(){
  if(!hero || !grounded || rollT>0) return;
  vy = JUMP_V; grounded = false;
}
const skillCd = [0,0,0,0];
let _sbT = 0;
function castSkill(i){
  if(!hero || hero.locked>0 || rollT>0) return;
  const kit = SKILLS[heroDef.id] || SKILLS.Warrior;
  const S = kit[i]; if(!S) return;
  if(skillCd[i] > 0) return;
  skillCd[i] = S.cd;
  if(!hero.layer('skill', { speed:1.0 })) hero.once('skill', 1.0);
  const yaw = hero.root.rotation.y;
  const fwd = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const p = hero.root.position.clone();
  setTimeout(()=>{ try{ S.cast(p, fwd); }catch(e){ console.error(e); } }, 150);
  paintSkillBar();
}
function doSkill(){ castSkill(0); }

function moveDir(){
  let x = 0, z = 0;
  if(keys.KeyW||keys.ArrowUp) z -= 1;
  if(keys.KeyS||keys.ArrowDown) z += 1;
  if(keys.KeyA||keys.ArrowLeft) x -= 1;
  if(keys.KeyD||keys.ArrowRight) x += 1;
  x += touchVec.x; z += touchVec.y;
  const v = new THREE.Vector3(x, 0, z);
  if(v.lengthSq() > 1) v.normalize();
  // camera-relative
  return v.applyAxisAngle(new THREE.Vector3(0,1,0), camYaw);
}

const braziers = [];   // fire-baskets get a live flame + light
async function scatterProps(){
  let seed = 20260728;
  const rnd = () => { seed = (seed*1664525 + 1013904223) & 0x7fffffff; return seed / 0x7fffffff; };
  for(const P of PROP_PLAN){
    const g = await load(`assets/props/${P.file}.glb`).catch(()=>null);
    if(!g) continue;
    const base = prep(g.scene);
    // normalise each prop to a sane metre scale, then apply its artistic multiplier
    const bb = new THREE.Box3().setFromObject(base), bs = bb.getSize(new THREE.Vector3());
    const norm = 1 / Math.max(0.001, Math.max(bs.x, bs.y, bs.z));
    for(let i=0;i<P.n;i++){
      const inst = base.clone(true);                     // props are static meshes — clone is safe here
      const a = (i / P.n) * Math.PI*2 + rnd()*0.5;
      const r = roomHalf * P.ringR * (0.92 + rnd()*0.12);
      inst.scale.setScalar(norm * P.scale);
      inst.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
      const nb = new THREE.Box3().setFromObject(inst);
      inst.position.y -= nb.min.y;                        // sit on the floor
      inst.rotation.y = P.faceIn ? (-a + Math.PI/2) : rnd()*Math.PI*2;
      scene.add(inst);
    }
  }
  // ── Fantasy Props MegaKit (Quaternius) — the detailed dressing near the fight floor ──
  const QPLAN = [
    { file:'Barrel',        ringR:0.72, n:4, scale:1.0 },

    { file:'Anvil_Log',     ringR:0.58, n:1, scale:1.1 },
    { file:'Workbench',     ringR:0.62, n:1, scale:1.1 },
    { file:'WeaponStand',   ringR:0.64, n:2, scale:1.1 },
    { file:'Cauldron',      ringR:0.60, n:1, scale:1.1 },
    { file:'Table_Large',   ringR:0.76, n:1, scale:1.0 },
    { file:'Bench',         ringR:0.78, n:2, scale:1.0 },
    { file:'Bookcase_2',    ringR:0.86, n:2, scale:1.1 },
    { file:'Banner_1',      ringR:0.92, n:3, scale:1.6, faceIn:true },
    { file:'Banner_2',      ringR:0.92, n:3, scale:1.6, faceIn:true },
    { file:'Torch_Metal',   ringR:0.92, n:6, scale:1.2, faceIn:true },
    { file:'Pot_1',         ringR:0.68, n:3, scale:0.9 },
    { file:'Vase_2',        ringR:0.70, n:2, scale:0.9 },
    { file:'Bucket_Wooden_1', ringR:0.64, n:2, scale:0.8 },
    { file:'Chain_Coil',    ringR:0.74, n:2, scale:0.9 },
    { file:'Dummy',         ringR:0.82, n:2, scale:1.2 },
  ];
  for(const P of QPLAN){
    const g2 = await load(`assets/qprops/${P.file}.gltf`).catch(()=>null);
    if(!g2) continue;
    const base = prep(g2.scene, { shadow:false });
    const bb = new THREE.Box3().setFromObject(base), bs = bb.getSize(new THREE.Vector3());
    const norm = 1 / Math.max(0.001, Math.max(bs.x, bs.y, bs.z));
    for(let i=0;i<P.n;i++){
      const inst = base.clone(true);
      const a = (i / P.n) * Math.PI*2 + rnd()*0.7 + 0.4;
      const r = roomHalf * P.ringR * (0.9 + rnd()*0.16);
      inst.scale.setScalar(norm * P.scale);
      inst.position.set(Math.cos(a)*r, 0, Math.sin(a)*r);
      const nb = new THREE.Box3().setFromObject(inst);
      inst.position.y -= nb.min.y;
      inst.rotation.y = P.faceIn ? (-a + Math.PI/2) : rnd()*Math.PI*2;
      scene.add(inst);
    }
  }
  await addChests();

  // fire baskets flanking the centre — real light sources
  const fb = await load('assets/props/fire-basket.glb').catch(()=>null);
  if(fb){
    const base = prep(fb.scene, { shadow:false });

const chests = [];
async function addChests(){
  const g = await load('assets/qprops/Chest_Wood.gltf').catch(()=>null);
  const coinG = await load('assets/qprops/Coin_Pile.gltf').catch(()=>null);
  const potG  = await load('assets/qprops/Potion_1.gltf').catch(()=>null);
  if(!g) return;
  const base = prep(g.scene, { shadow:false });
  const bb = new THREE.Box3().setFromObject(base), bs = bb.getSize(new THREE.Vector3());
  const norm = 0.95 / Math.max(0.001, Math.max(bs.x, bs.y, bs.z));
  for(const [cx,cz] of [[-7.5,-1.5],[7.5,-1.5],[0,-9.0]]){
    const inst = base.clone(true);
    inst.scale.setScalar(norm);
    inst.position.set(cx, 0, cz);
    const nb = new THREE.Box3().setFromObject(inst);
    inst.position.y -= nb.min.y;
    inst.rotation.y = Math.atan2(-cx, -cz);
    scene.add(inst);
