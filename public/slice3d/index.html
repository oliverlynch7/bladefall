};
let redesignParts = [];
function clearRedesign(){
  for(const p of redesignParts){
    if(p.bone && p.obj.parent) p.obj.parent.remove(p.obj);
    else scene.remove(p.obj);
    p.obj.traverse && p.obj.traverse(o => { if(o.isMesh||o.isSprite){
      if(o.geometry) o.geometry.dispose();
      const m=o.material; if(m) (Array.isArray(m)?m:[m]).forEach(x=>x&&x.dispose()); } });
  }
  redesignParts = [];
}
function applyRedesign(actor, sk){
  clearRedesign();
  const glowEyes = !!(sk && sk.redesign && /dreadknight|wraithblade/.test(sk.redesign));

  if(!sk || !sk.redesign || !REDESIGNS[sk.redesign]) return;
  const parts = REDESIGNS[sk.redesign](actor, sk);
  for(const p of parts){
    if(p.bone) p.bone.add(p.obj);
    else scene.add(p.obj);
  }
  redesignParts = parts;
}
function updateRedesign(t, dt){
  if(!redesignParts.length || !hero) return;
  const P = hero.root.position, yaw = hero.root.rotation.y;
  for(const p of redesignParts){
    if(p.bone) continue;                                    // bone-parented parts ride the rig
    const o = p.obj;
    if(p.sway){
      o.position.copy(P); o.rotation.y = yaw + Math.sin(t*2.2)*0.05;
      const lean = Math.min(0.5, vel.length()*0.06);
      o.rotation.x = lean;
    } else if(p.haloY != null){
      o.position.copy(P).setY(p.haloY + Math.sin(t*1.6)*0.05);
      o.rotation.z += (p.spin||1) * dt;
    } else if(p.orbit){
      o.position.copy(P).setY(p.orbitY + Math.sin(t*1.3)*0.08);
      o.rotation.y = t*0.8;
      o.children.forEach((c,i) => { c.rotation.x = t*1.7 + i; c.rotation.y = t*1.2; });
    } else if(p.auraY != null){
      o.position.copy(P).setY(p.auraY);
      const s = 2.0 + Math.sin(t*2.4)*0.16; o.scale.set(s,s,1);
    } else if(p.poolY != null){
      o.position.copy(P).setY(p.poolY);
      const s = 1.5 + Math.sin(t*1.8)*0.12; o.scale.set(s,s,1);
    } else if(p.trail){
      o.children.forEach((c,i) => {
        const lag = 0.10*(i+1);
        c.position.set(P.x - Math.sin(yaw)*lag*2.2, p.trailY - i*0.06, P.z - Math.cos(yaw)*lag*2.2);
        c.material.opacity = 0.55 * (1 - i/6);
      });
    } else {
      o.position.copy(P); o.rotation.y = yaw;               // pauldron spikes etc.
    }
  }
}

let _ualClips = null;
/* The six RPG characters share an IDENTICAL 32-bone skeleton, so any clip from any of
   them binds to all of them by bone name — the same zero-retargeting mechanism the UAL
   rigs use. Individually they ship ~12 clips each; pooled there are 26 distinct ones.
   Loading the pool gives every class the full set (Bow_Shoot, Dagger_Attack, Spell2,
   Sword_Attack, Monk's unarmed Attack/Attack2, Roll, ...) instead of its own dozen. */
const RPG_POOL = ['Warrior','Rogue','Ranger','Wizard','Cleric','Monk'];
let _rpgClips = null;
async function loadRPGPool(){
  if(_rpgClips) return _rpgClips;
  const gs = await Promise.all(RPG_POOL.map(n => load(`assets/chars/${n}.gltf`).catch(()=>null)));
  const seen = new Set(); _rpgClips = [];
  for(const g of gs){ if(!g) continue;
    for(const c of g.animations){ if(seen.has(c.name)) continue; seen.add(c.name); _rpgClips.push(c); } }
  console.log('DIAG rpgpool clips=' + _rpgClips.length);
  return _rpgClips;
}
async function loadRPGChar(def){
  const [g, pool] = await Promise.all([
    load(`assets/chars/${def.model || def.id}.gltf`).catch(()=>null), loadRPGPool(),
  ]);
  if(!g) return null;
  return { scene: g.scene, animations: pool };
}

async function loadUAL(){
  if(_ualClips) return _ualClips;
  const [a,b] = await Promise.all([
    load('assets/base/UAL1_Standard.glb').catch(()=>null),
    load('assets/base/UAL2_Standard.glb').catch(()=>null),
  ]);
  _ualClips = [].concat(a?a.animations:[], b?b.animations:[]);
  return _ualClips;
}
// Load a base character and graft the shared animation library onto it. Three.js binds
// animation tracks to nodes BY NAME, and these rigs share the exact UE bone naming, so
// no retargeting step is required.
async function loadBaseChar(def){
  const oi = Math.min(outfitIdx[def.id] || 0, (def.outfits||[]).length - 1);
  const file = def.outfits ? def.outfits[Math.max(0,oi)].file : `base/${def.file}`;
  const [body, clips] = await Promise.all([
    load(`assets/${file}.gltf`).catch(()=>null),
    loadUAL(),
  ]);
  if(!body) return null;
  return { scene: body.scene, animations: clips };
}

/* ─────────────  MIXAMO  ─────────────
   Mixamo characters are free for commercial use and ship rigged with faces and real
   textures, which is the gap every free low-poly pack left us with. They use their own
   bone naming ('mixamorig:Hips'), so our 86-clip library will not bind to them by name
   the way it binds to the UE-named rigs. Rather than hand-map in Blender, we rename the
   animation tracks at load: UE bone -> Mixamo bone. Both are ordinary humanoid skeletons,
   so this is a mechanical correspondence, not an approximation.

   POSITION tracks are dropped on purpose. Bone lengths differ between the two rigs, so a
   translation authored for one skeleton is simply wrong on the other and shows up as
   stretched or dislocated limbs. Rotations transfer cleanly; movement is code-driven here
   anyway, so we lose nothing by ignoring root motion. */
const UE_TO_MIXAMO = {
  pelvis:'mixamorig:Hips',
  spine_01:'mixamorig:Spine', spine_02:'mixamorig:Spine1', spine_03:'mixamorig:Spine2',
  neck_01:'mixamorig:Neck', Head:'mixamorig:Head',
  clavicle_l:'mixamorig:LeftShoulder', upperarm_l:'mixamorig:LeftArm',
  lowerarm_l:'mixamorig:LeftForeArm',  hand_l:'mixamorig:LeftHand',
  clavicle_r:'mixamorig:RightShoulder', upperarm_r:'mixamorig:RightArm',
  lowerarm_r:'mixamorig:RightForeArm',  hand_r:'mixamorig:RightHand',
  thigh_l:'mixamorig:LeftUpLeg',  calf_l:'mixamorig:LeftLeg',
  foot_l:'mixamorig:LeftFoot',    ball_l:'mixamorig:LeftToeBase',
  thigh_r:'mixamorig:RightUpLeg', calf_r:'mixamorig:RightLeg',
  foot_r:'mixamorig:RightFoot',   ball_r:'mixamorig:RightToeBase',
};
for(const [side, S] of [['l','Left'],['r','Right']]){
  for(const [ue, mx] of [['index','HandIndex'],['middle','HandMiddle'],['pinky','HandPinky'],
                         ['ring','HandRing'],['thumb','HandThumb']]){
    for(let i=1;i<=3;i++) UE_TO_MIXAMO[`${ue}_0${i}_${side}`] = `mixamorig:${S}${mx}${i}`;
  }
}
/* Resolve the map's target names against the bones the model ACTUALLY has.
   Loaders disagree about punctuation — three's FBXLoader strips the colon, so Mixamo's
   'mixamorig:Hips' arrives as 'mixamorigHips'. Hardcoding either spelling breaks the
   moment the other shows up, so match on a punctuation-free, case-free key instead. */
const boneKey = n => String(n).toLowerCase().replace(/[^a-z0-9]/g, '');
function resolveMap(root, map){
  const have = new Map();
  root.traverse(o => { if(o.isBone && !have.has(boneKey(o.name))) have.set(boneKey(o.name), o.name); });
  const out = {}; let hit = 0, miss = 0;
  for(const [ue, want] of Object.entries(map)){
    const real = have.get(boneKey(want));
    if(real){ out[ue] = real; hit++; } else miss++;
  }
  console.log(`[retarget] mapped ${hit} bones, ${miss} unmatched`);
  return out;
}
function retargetClips(clips, map){
  const out = [];
  for(const c of clips){
    const tracks = [];
    for(const tr of c.tracks){
      const i = tr.name.lastIndexOf('.');
      const node = tr.name.slice(0, i), prop = tr.name.slice(i + 1);
      const to = map[node];
      if(!to) continue;                 // bone has no counterpart — drop rather than guess
      if(prop === 'position') continue; // see note above: bone lengths differ
      const nt = tr.clone(); nt.name = to + '.' + prop; tracks.push(nt);
    }
    if(tracks.length) out.push(new THREE.AnimationClip(c.name, c.duration, tracks));
  }
  return out;
}
const fbxLoader = new FBXLoader();
const loadFBX = url => new Promise((res, rej) =>
  fbxLoader.load(url, o => { bump(); res(o); }, undefined, rej));

let _ualSrc = null;
// The rig the UAL clips were authored against. retargetClip needs it as the SOURCE so it
// can work out how each bone's rest orientation differs from the Mixamo rig's.
async function ualSource(){
  if(_ualSrc) return _ualSrc;
  const g = await load('assets/base/Superhero_Male_FullBody.gltf').catch(()=>null);
  if(g){
    g.scene.updateMatrixWorld(true);
    // retargetClip reads source.skeleton, so it needs the SkinnedMesh itself — handing it
    // the scene wrapper threw "Cannot read properties of undefined (reading 'bones')".
    g.scene.traverse(o => { if(!_ualSrc && o.isSkinnedMesh) _ualSrc = o; });
  }
  return _ualSrc;
}

async function loadMixamoChar(def){
  const [obj, clips, src] = await Promise.all([
    loadFBX(`assets/mixamo/${def.file}.fbx`).catch(e => { console.warn('FBX fail', e); return null; }),
    loadUAL(), ualSource(),
  ]);
  if(!obj) return null;
  obj.traverse(o => {
    if(!o.isMesh) return;
    o.castShadow = true; o.receiveShadow = true;
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    for(const m of mats){ if(m && m.map) m.map.colorSpace = THREE.SRGBColorSpace; }
  });

  /* Mixamo FBX is Z-up, so the character loads lying face-down. Stand it up first —
     everything below measures, and measuring a prone model gives nonsense. */
  const wrap = new THREE.Group();
  wrap.add(obj);

  /* SIZE AND GROUND FROM THE SKELETON, here, before Actor ever sees the model.

     Box3 is the wrong instrument: a SkinnedMesh draws where its BONES are, but Box3
     reports the geometry's BIND-space bounds, and for these rigs they disagree wildly.
     Measured: all three characters reported an identical 1.75m box while their skeletons
     spanned 1.80m, 1.86m and 5.34m — that 3x is why Arissa rendered huge. The same
     disagreement left every foot bone below zero (-0.36 / -0.76 / -2.05), which is the
     sinking: the box sat on the floor, the visible pixels did not.

     Doing it here (rather than after Actor) means we own the transform outright, so
     nothing downstream re-measures a stale box and undoes it. def.preScaled tells Actor
     to keep its hands off. */
  const findBone = re => { let b = null;
    obj.traverse(o => { if(!b && o.isBone && re.test(o.name.toLowerCase().replace(/[^a-z]/g,''))) b = o; });
    return b; };
  const head = findBone(/head$/), foot = findBone(/(leftfoot|rightfoot)$/);
  const yOf = b => { wrap.updateMatrixWorld(true);
    return new THREE.Vector3().setFromMatrixPosition(b.matrixWorld).y; };

  /* Work out which way is up by MEASURING, not by assuming. Mixamo exports are not
     consistent: two of these three are Z-up and load face-down, but the Paladin is
     already Y-up, so a blanket -90 deg X rotation stood two of them up and turned the
     third upside down (head-to-foot span came back as -1.565). Try the four right-angle
     rotations and keep whichever puts the head furthest ABOVE the feet. */
  if(head && foot){
    let best = null;
    for(const rx of [0, -Math.PI/2, Math.PI/2, Math.PI]){
      obj.rotation.x = rx;
      const span = yOf(head) - yOf(foot);
      if(best === null || span > best.span) best = { rx, span };
    }
    obj.rotation.x = best.rx;
    console.log(`DIAG upright ${def.id} rx=${best.rx.toFixed(2)} span=${best.span.toFixed(3)}`);
  }

  if(head && foot){
    /* three caches parsed assets, so switching classes hands back the SAME object. A
       relative adjustment then stacks on the previous one — that is how Arissa's "raw"
       span came back as 0.128 and she ended up ~1000x oversized. Snapshot the original
       transform once and always recompute from it, which makes this idempotent. */
    if(obj.userData._fit0 === undefined){
      obj.userData._fit0 = { s: obj.scale.x, y: obj.position.y };
    }
    obj.scale.setScalar(obj.userData._fit0.s);
    obj.position.y = obj.userData._fit0.y;
    const raw = yOf(head) - yOf(foot);
    if(raw > 1e-6){
      obj.scale.setScalar(obj.userData._fit0.s * (HERO_H / raw));
      const span = yOf(head) - yOf(foot);
      obj.position.y = obj.userData._fit0.y - yOf(foot);
      console.log(`DIAG fit ${def.id} rawSpan=${raw.toFixed(3)} -> span=${span.toFixed(3)} foot=${yOf(foot).toFixed(4)}`);
    }
  } else {
    console.log(`DIAG fit ${def.id} MISSING head=${!!head} foot=${!!foot}`);
  }

  /* Retarget properly, with SkeletonUtils, rather than by renaming tracks.

     Renaming alone is what mangled the torso: it assumes both skeletons share a rest pose,
     and they don't. Feeding a UE bone's rotation straight into a Mixamo bone whose rest
     orientation differs twists the joint, which showed up worst around the hips because
     that is where the two rigs disagree most. retargetClip samples the source rig and
     re-expresses each pose in the target's own rest frame, so the difference cancels out.

     Only the clips this class actually references get baked — retargeting all 85 would
     cost far more time than the ~9 a class uses. */
  let target = null;
  obj.traverse(o => { if(!target && o.isSkinnedMesh) target = o; });
  let animations = [];
  if(target && src){
    const have = new Map();
    obj.traverse(o => { if(o.isBone && !have.has(boneKey(o.name))) have.set(boneKey(o.name), o.name); });
    const names = {};                       // names[targetBone] = sourceBone
    let mapped = 0;
    for(const [ue, mx] of Object.entries(UE_TO_MIXAMO)){
      const real = have.get(boneKey(mx));
      if(real){ names[real] = ue; mapped++; }
    }
    const want = new Set(Object.values(def.clips || {}).flat());
    const t0 = performance.now(); let failMsg = '';
    for(const c of clips){
      if(!want.has(c.name)) continue;
      try {
        const rc = SkeletonUtils.retargetClip(target, src, c, { names, fps: 30 });
        /* retargetClip emits SKELETON-relative track names: '.bones[mixamorigHips].quaternion'.
           That form only binds when the AnimationMixer is rooted on the SkinnedMesh itself.
           Our mixer is rooted on the model group, so none of them resolved and the character
           just stood in its T-pose. Rewrite to the object-path form, which binds from any
           ancestor. Position tracks are dropped: retargetClip bakes hip translation in the
           SOURCE rig's units, which on a centimetre-scale Mixamo rig flings the character. */
        rc.tracks = rc.tracks
          .map(t => { t.name = t.name.replace(/^\.bones\[(.+?)\]\./, '$1.'); return t; })
          .filter(t => !/\.position$/.test(t.name));
        animations.push(rc);
      }
      catch(e){ if(!failMsg) failMsg = c.name + ': ' + e.message; }
    }
    console.log(`DIAG retarget ${def.id}: ${mapped} bones, ${animations.length}/${want.size} clips in ${Math.round(performance.now()-t0)}ms${failMsg?' FAIL='+failMsg:''}`);
  }
  if(!animations.length) animations = retargetClips(clips, resolveMap(obj, UE_TO_MIXAMO));
  return { scene: wrap, animations };
}


/* ─────────────  EYES  ─────────────
   These models were authored with a nose and a mouth but NO eyes, so eyes have to be
   ADDED — the exact task I have repeatedly got wrong, because judging placement needs a
   pair of working eyes of my own and I only get one still frame every couple of minutes.

   So this does not try to be clever. It does two things:
     1. Anchors to geometry the ARTIST authored — the head bone and the measured nose tip —
        rather than to numbers I invented. That gets it into the right neighbourhood.
     2. Exposes every remaining number as a live control, so the final call is made by
        someone who can actually see it. Values persist to localStorage and can be dumped
        with __SLICE.eyeDump() to be baked in permanently once they're right.

   Placement is in HEAD-LOCAL space and scaled by head size, so one set of numbers should
   carry across all six characters instead of needing per-model tuning. */
const EYE = {
  on: true,
  /* Oliver's tuned Warrior values, 2026-07-29. These are the shipping defaults now —
     everything below was dialled in on a real head at real size, which beats any number
     I would have guessed. `flip` is true because the derived face direction comes out
     inverted on this rig; that is what the toggle exists for. */
  spread: 0.13,
  height: -0.185,
  depth:  -0.075,
  size:   0.072,
  squash: 0.66,
  tilt:   0.17,
  white:  '#f2efe6',
  iris:   '#9b2c2c',
  pupil:  '#000000',
  irisSz: 0.52,
  showWhite: true,
  /* Lateral shift of the whole pair. `spread` moves the eyes apart from each other;
     this slides both together. The Monk needs it because his head geometry is not
     centred on its own bone, so centring the pair on the measured head still lands
     them off to one side. Separate control, because they are separate problems. */
  offX: 0,
  /* Face-plane alignment. On the Rogue and Monk the face is not perpendicular to the
     head's forward axis — it is turned slightly. Pushing both eyes along one shared FWD
     vector then drives one INTO the mesh while the other bulges out, which no per-eye
     control can fix because the two eyes are behaving correctly relative to each other;
     it is the PLANE that is wrong. These rotate the whole RIGHT/UP/FWD frame so 'forward'
     means perpendicular to the actual face. Shared by eyes and mouth, since they describe
     the head rather than any one feature. */
  faceYaw: 0,
  facePitch: 0,
  onTop: false,
  flip: true,
};
/* Saved PER MODEL. The six bodies have genuinely different head shapes and beards, so one
   set of numbers will not fit all of them — tune each once and it sticks. */
const EYE_DEFAULT = JSON.parse(JSON.stringify(EYE));
let EYE_ALL = {};
try { EYE_ALL = JSON.parse(localStorage.getItem('bf_eye') || '{}'); } catch(e){}
const eyeModel = () => {
  // guarded: heroDef is declared later in the file, so anything running at module-init
  // time would otherwise hit the temporal dead zone and take the whole page down
  try { return (heroDef && (heroDef.model || heroDef.id)) || 'Warrior'; }
  catch(e){ return 'Warrior'; }
};
function eyeLoadFor(model){
  const pre = (FACE_PRESETS[model] || {}).eye || {};
  Object.assign(EYE, EYE_DEFAULT, pre, cleanFace(EYE_ALL[model] || {}, EYE_DEFAULT));
}
const eyeSave = () => {
  EYE_ALL[eyeModel()] = cleanFace(JSON.parse(JSON.stringify(EYE)), EYE_DEFAULT);
  try { localStorage.setItem('bf_eye', JSON.stringify(EYE_ALL)); } catch(e){}
};

/* Measure the head from the model instead of assuming: which bone, how wide, where the
   face points, and where the nose sticks out. Everything else is expressed relative to
   these, which is why one set of slider values works on all six bodies. */
function headMetrics(actor){
  let head = null;
  actor.root.traverse(o => { if(!head && o.isBone && /^head$/i.test(o.name.replace(/[^a-z]/gi,''))) head = o; });
  if(!head) return null;
  actor.root.updateMatrixWorld(true);

  /* Which vertices are the HEAD?

     This was the bug behind every bad face placement. The old code took "whichever mesh
     has the most vertices" and called it the head — on these models that is the BODY, so
     width, height and the front surface were all measurements of the whole character.
     Eyes then got positioned with body-sized offsets and floated off beside the skull.

     The models already answer this question properly: they are skinned, so every vertex
     records which bone drives it. Vertices weighted to the head bone ARE the head. That
     is the artist's own definition, not a heuristic of mine. */
  const inv = new THREE.Matrix4().copy(head.matrixWorld).invert();
  const v = new THREE.Vector3(), local = new THREE.Vector3();
  let minX=1e9,maxX=-1e9, minY=1e9,maxY=-1e9, minZ=1e9,maxZ=-1e9, n=0;
  const pts = [];

  actor.root.traverse(o => {
    if(!o.isSkinnedMesh || o.userData._eye || o.userData._weap) return;
    const geo = o.geometry, pos = geo.attributes.position;
    const si = geo.attributes.skinIndex, sw = geo.attributes.skinWeight;
    if(!pos || !si || !sw || !o.skeleton) return;
    const bi = o.skeleton.bones.indexOf(head);
    if(bi < 0) return;
    const toLocal = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    for(let i=0;i<pos.count;i++){
      let wgt = 0;
      for(let k=0;k<4;k++){
        if(si.getComponent(i,k) === bi) wgt += sw.getComponent(i,k);
      }
      if(wgt < 0.5) continue;                    // mostly-head vertices only
      v.fromBufferAttribute(pos, i); local.copy(v).applyMatrix4(toLocal);
      minX=Math.min(minX,local.x); maxX=Math.max(maxX,local.x);
      minY=Math.min(minY,local.y); maxY=Math.max(maxY,local.y);
      minZ=Math.min(minZ,local.z); maxZ=Math.max(maxZ,local.z);
      pts.push(local.x, local.y, local.z); n++;
    }
  });

  if(n < 20) return null;                        // no usable head data — do not guess

  const w = Math.max(1e-4, maxX-minX);
  const h = Math.max(1e-4, maxY-minY);
  const d = Math.max(1e-4, maxZ-minZ);
  const cz = (minZ + maxZ) / 2;

  /* Face direction — derived, not guessed.

     Every heuristic I tried here disagreed between characters (comparing |maxZ| to |minZ|,
     then counting vertex mass either side of centre) and produced dir=-1 on the Warrior
     and dir=+1 on the Monk. That inconsistency is nonsense: all six share ONE skeleton, so
     the way a head faces relative to its own bone is necessarily the same for all of them.

     So stop inspecting the mesh and ask the rig. Take the direction the character's body
     faces and express it in head-local coordinates. That is one deterministic answer, it
     is identical across all six models, and it cannot flip based on a beard. */
  const rootQ = new THREE.Quaternion(); actor.root.getWorldQuaternion(rootQ);
  const headQ = new THREE.Quaternion(); head.getWorldQuaternion(headQ);
  const FWD = new THREE.Vector3(0, 0, 1).applyQuaternion(rootQ)
                .applyQuaternion(headQ.clone().invert()).normalize();
  const UP  = new THREE.Vector3(0, 1, 0).applyQuaternion(rootQ)
                .applyQuaternion(headQ.clone().invert()).normalize();
  let RIGHT = new THREE.Vector3().crossVectors(UP, FWD).normalize();
  // turn the frame to match the real face plane (see EYE.faceYaw / facePitch)
  if(EYE.faceYaw){
    FWD.applyAxisAngle(UP, EYE.faceYaw).normalize();
    RIGHT = new THREE.Vector3().crossVectors(UP, FWD).normalize();
  }
  if(EYE.facePitch){
    FWD.applyAxisAngle(RIGHT, EYE.facePitch).normalize();
  }
  const centre = new THREE.Vector3((minX+maxX)/2, (minY+maxY)/2, cz);

  // brow line: eyes sit a little above the middle of a head
  const eyeY = minY + h * 0.58;
  return { head, w, h, d, cz, minY, maxY, eyeY, centre, FWD, UP, RIGHT, verts: n };
}

function clearEyes(actor){
  if(!actor || !actor._eyes) return;
  for(const m of actor._eyes){ if(m.parent) m.parent.remove(m); }
  actor._eyes = null;
}

function addEyes(actor, useSaved){
  if(!actor) return null;
  clearEyes(actor);
  if(useSaved !== false) eyeLoadFor(eyeModel());
  if(!EYE.on) return null;
  const M = headMetrics(actor);
  if(!M) return null;
  const SGN = EYE.flip ? -1 : 1;

  const made = [];
  const mk = (geo, col) => {
    const m = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({
      color: col, depthTest: !EYE.onTop, depthWrite: !EYE.onTop }));
    m.userData._eye = true; m.renderOrder = EYE.onTop ? 999 : 3;
    return m;
  };
  const R = M.w * EYE.size;
  for(const side of [-1, 1]){
    const g = new THREE.Group(); g.userData._eye = true;
    /* Iris and pupil are flat DISCS stacked just proud of the sclera, not spheres nested
       inside it. As spheres the pupil sat entirely within the iris sphere's volume; with
       depth testing off, draw order hid the problem, but the moment 'draw through head'
       was unticked the iris correctly occluded the pupil and it vanished. Discs cannot
       intersect each other, so the layering holds in both modes.

       They keep depthTest (so the head still hides the eye when you look from behind) but
       skip depthWrite and use renderOrder to stack, which avoids z-fighting against the
       sclera surface they sit on. */
    const frontZ = R * 0.55;
    if(EYE.showWhite){
      const w = mk(new THREE.SphereGeometry(1, 14, 10), EYE.white);
      w.scale.set(R, R*EYE.squash, frontZ); g.add(w);
    }
    const irR = R * EYE.irisSz * 0.9;
    const ir = mk(new THREE.CircleGeometry(1, 20), EYE.iris);
    ir.scale.setScalar(irR);
    ir.position.z = frontZ * 0.995;
    ir.material.depthWrite = false; ir.renderOrder = (EYE.onTop ? 999 : 3) + 1;
    g.add(ir);
    const pu = mk(new THREE.CircleGeometry(1, 16), EYE.pupil);
    pu.scale.setScalar(irR * 0.5);
    pu.position.z = frontZ * 1.02;
    pu.material.depthWrite = false; pu.renderOrder = (EYE.onTop ? 999 : 3) + 2;
    g.add(pu);

    /* Build the position from the head's own basis vectors: sideways along RIGHT, up
       along UP, outward along FWD. Works whichever way the bone happens to be oriented. */
    g.position.copy(M.centre)
      .addScaledVector(M.RIGHT, (side * EYE.spread + EYE.offX) * M.w)
      .addScaledVector(M.UP,    (M.eyeY - (M.minY + M.h/2)) + M.h * EYE.height)
      .addScaledVector(M.FWD,   SGN * (M.d * (0.5 + EYE.depth)));
    g.lookAt(g.position.clone().addScaledVector(M.FWD, SGN * 10));
    g.rotateZ(-side * EYE.tilt);
    M.head.add(g);
    made.push(g);
  }
  actor._eyes = made;
  return { headVerts:M.verts, w:+M.w.toFixed(3), h:+M.h.toFixed(3), d:+M.d.toFixed(3),
           fwd:[+M.FWD.x.toFixed(2), +M.FWD.y.toFixed(2), +M.FWD.z.toFixed(2)] };
}


/* ─────────────  MOUTH  ─────────────
   Same architecture as the eyes, because that one worked: anchor to measured head
   geometry, express every offset as a fraction of head size, render through the head
   while tuning, save per model, and leave the final placement to someone who can see it.

   Mii-style shapes are drawn to a canvas rather than modelled. A mouth is a flat mark on
   a face, so a transparent plane carrying a drawn shape gives us any expression we like

  shape: 'line',
  y: -0.465,

  Ranger: {

    mouth: { shape:'line', y:-0.52,  z:0.095, width:0.34, height:0.20, color:'#5a2f28' },
  },
  Wizard: {
    eye:   { spread:0.195, height:-0.225, depth:0.02,   size:0.088, squash:0.62, tilt:0,
             iris:'#3a6ea5', pupil:'#101014', flip:false },
    mouth: { shape:'flat', y:-0.495, z:0.075, width:0.31, height:0.26, color:'#483e3c' },
  },
  Cleric: {
    eye:   { spread:0.23,  height:-0.21,  depth:0.095,  size:0.076, squash:0.62, tilt:0,
             iris:'#3a6ea5', pupil:'#101014', flip:false },
    mouth: { shape:'smile', y:-0.465, z:0.135, width:0.34, height:0.20, color:'#5a2f28' },
  },
  // Monk and Rogue not yet tuned — they fall back to the Warrior-derived base.
};

/* Saved settings from before the slider-scoping fix contain a stray "undefined" key: the
   eye handlers were bound to every range/colour input in the panel, so mouth and weapon
   edits wrote into EYE. Drop anything that is not a real field rather than carrying
   garbage forward. */
function cleanFace(obj, ref){
  const out = {};
  for(const k of Object.keys(ref)) if(k in obj) out[k] = obj[k];
  return out;
}

const MOUTH_DEFAULT = JSON.parse(JSON.stringify(MOUTH));
let MOUTH_ALL = {};
try { MOUTH_ALL = JSON.parse(localStorage.getItem('bf_mouth') || '{}'); } catch(e){}
function mouthLoadFor(model){
  const pre = (FACE_PRESETS[model] || {}).mouth || {};
  Object.assign(MOUTH, MOUTH_DEFAULT, pre, cleanFace(MOUTH_ALL[model] || {}, MOUTH_DEFAULT));
}
const mouthSave = () => {
  MOUTH_ALL[eyeModel()] = cleanFace(JSON.parse(JSON.stringify(MOUTH)), MOUTH_DEFAULT);
  try { localStorage.setItem('bf_mouth', JSON.stringify(MOUTH_ALL)); } catch(e){}
};
const _mouthTex = {};

/* Draw one Mii-style mouth. Everything is in a 0..1 box so the plane's own scale controls
   the real size; nothing here needs to know how big the head is. */
function mouthTexture(shape, color){
  const key = shape + '|' + color;
  if(_mouthTex[key]) return _mouthTex[key];
  const S = 256, c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  x.clearRect(0,0,S,S);
  x.strokeStyle = color; x.fillStyle = color;
  x.lineCap = 'round'; x.lineJoin = 'round';
  const LW = S*0.085; x.lineWidth = LW;
  const cx = S/2, cy = S/2, w = S*0.34, h = S*0.22;
  const curve = (dip) => {
    x.beginPath();
    x.moveTo(cx-w, cy - dip*0.5);
    x.quadraticCurveTo(cx, cy + dip, cx+w, cy - dip*0.5);
    x.stroke();
  };
  if(shape === 'line' || shape === 'flat'){
    x.beginPath(); x.moveTo(cx-w, cy); x.lineTo(cx+w, cy); x.stroke();
  } else if(shape === 'smile'){
    curve(h*1.5);
  } else if(shape === 'frown'){
    curve(-h*1.5);
  } else if(shape === 'smirk'){
    x.beginPath(); x.moveTo(cx-w, cy+h*0.35);
    x.quadraticCurveTo(cx, cy+h*0.55, cx+w, cy-h*0.5); x.stroke();
  } else if(shape === 'o'){
    x.beginPath(); x.ellipse(cx, cy, w*0.46, h*1.15, 0, 0, Math.PI*2); x.fill();
  } else if(shape === 'open'){
    x.beginPath(); x.ellipse(cx, cy, w*0.72, h*1.5, 0, 0, Math.PI*2); x.fill();
  } else if(shape === 'grin'){
    // filled crescent — a wide open smile
    x.beginPath();
    x.moveTo(cx-w, cy-h*0.35);
    x.quadraticCurveTo(cx, cy+h*2.0, cx+w, cy-h*0.35);
    x.closePath(); x.fill();
  } else if(shape === 'teeth'){
    x.beginPath();
    x.moveTo(cx-w, cy-h*0.35);
    x.quadraticCurveTo(cx, cy+h*2.0, cx+w, cy-h*0.35);
    x.closePath(); x.fill();
    x.strokeStyle = '#f4efe4'; x.lineWidth = LW*0.85;
    x.beginPath(); x.moveTo(cx-w*0.82, cy-h*0.18); x.lineTo(cx+w*0.82, cy-h*0.18); x.stroke();
  }
  (window.__mouthCanvases = window.__mouthCanvases || {})[shape] = c;
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = 4;
  _mouthTex[key] = t;
  return t;
}

function clearMouth(actor){
  if(!actor || !actor._mouth) return;
  if(actor._mouth.parent) actor._mouth.parent.remove(actor._mouth);
  actor._mouth = null;
}

function addMouth(actor, useSaved){
  if(!actor) return null;
  clearMouth(actor);
  if(useSaved !== false) mouthLoadFor(eyeModel());
  if(!MOUTH.on) return null;
  const M = headMetrics(actor);
  if(!M) return null;

  const tex = mouthTexture(MOUTH.shape, MOUTH.color);
  const mat = new THREE.MeshBasicMaterial({
    map: tex, transparent: true, alphaTest: 0.04,
    depthTest: !MOUTH.onTop, depthWrite: false, side: THREE.DoubleSide,
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(1,1), mat);
  m.userData._eye = true;                       // excluded from head measurement
  m.renderOrder = MOUTH.onTop ? 999 : 3;
  const MSGN = MOUTH.flip ? -1 : 1;
  m.scale.set(M.w * MOUTH.width, M.w * MOUTH.height, 1);
  m.position.copy(M.centre)
    .addScaledVector(M.RIGHT, MOUTH.offX * M.w)
    .addScaledVector(M.UP,  (M.eyeY - (M.minY + M.h/2)) + M.h * MOUTH.y)
    .addScaledVector(M.FWD, MSGN * (M.d * (0.5 + MOUTH.z)));
  m.lookAt(m.position.clone().addScaledVector(M.FWD, MSGN * 10));
  M.head.add(m);
  actor._mouth = m;
  return { shape: MOUTH.shape, w:+M.w.toFixed(3) };
}


/* ─────────────  WEAPONS  ─────────────
   The easy case, and worth saying why: the artist BUILT an attachment point. Every one of
   these rigs has a `Weapon.R` bone with the character's own weapon parented to it at a
   hand-authored offset. So we never have to invent how a sword sits in a fist — we read
   the transform the artist already chose and reuse it for whatever we hang there instead.

   That is the same principle that made hair and armour work first try, and it is the
   opposite of what made faces so painful.

   The only thing left to compute is SIZE, because a scythe is not a dagger. We measure
   the built-in weapon's length, measure the new one's, and scale to match — then a
   per-weapon `len` multiplier lets a two-hander read longer than the stock sword. */
const WEAPONS = ['Arrow', 'Axe', 'Axe_Double', 'Axe_Double_Golden', 'Axe_Small', 'Bow_Evil', 'Bow_Golden', 'Bow_Wooden', 'Bow_Wooden2', 'Claymore', 'Dagger', 'Dagger_2', 'Dagger_Golden', 'Hammer_Double', 'Hammer_Double_Golden', 'Hammer_Small', 'Scythe', 'Shield_Celtic_Golden', 'Shield_Heater', 'Shield_Heater_2', 'Shield_Round', 'Shield_Round_2', 'Spear', 'Sword', 'Sword_2', 'Sword_Big', 'Sword_Golden', 'Sword_big_Golden'];
// how long each should be relative to the character's stock weapon
const WEAPON_LEN = {
  Claymore:1.45, Sword_Big:1.4, Sword_big_Golden:1.4, Scythe:1.6, Spear:1.7,
  Hammer_Double:1.25, Hammer_Double_Golden:1.25, Axe_Double:1.2, Axe_Double_Golden:1.2,
  Dagger:0.62, Dagger_2:0.62, Dagger_Golden:0.62, Arrow:0.7,
  Bow_Wooden:1.15, Bow_Wooden2:1.15, Bow_Golden:1.15, Bow_Evil:1.15,
};
/* fwd/up/side slide the weapon along the grip. Rotation alone cannot do this: the hand
   stays put, so a spear can be aimed but not pushed through the fist to sit further
   forward. All three are fractions of the weapon's own length, so they behave the same
   on a dagger and on a scythe. */

/* ─────────────  WEAPON RULES  ─────────────
   Oliver's call, and it is a scoping decision more than a design one: a class may only
   equip weapons that suit its archetype. 28 weapons across 6 bodies is 168 combinations to
   position by hand; restricting each weapon to the archetype it belongs on collapses that
   to roughly 28. It also reads as a real RPG rule rather than a limitation.

   Grouped by BODY, because the body is what determines the hand and the grip — two classes
   sharing a model share their weapon list and their tuning for free. */
const ARCHETYPE_WEAPONS = {
  Warrior: [/^Sword/, /^Claymore/, /^Axe/, /^Hammer/, /^Spear/, /^Scythe/, /^Shield/],
  Cleric:  [/^Hammer/, /^Sword$/, /^Sword_2$/, /^Shield/],
  Rogue:   [/^Dagger/, /^Sword$/, /^Sword_2$/],
  Ranger:  [/^Bow/, /^Arrow/, /^Spear/, /^Dagger/],
  Wizard:  [/^Scythe/, /^Spear/, /^Dagger$/],
  Monk:    [],                       // unarmed by design
};
function weaponsFor(model){
  const rules = ARCHETYPE_WEAPONS[model];
  if(!rules) return WEAPONS.slice();
  return WEAPONS.filter(w => rules.some(re => re.test(w)));
}

/* Tuned transforms, keyed by WEAPON rather than by class. That is the point of the rule
   above: a weapon lives on one archetype, so one set of numbers is enough for it
   everywhere it can appear. */
const WEAPON_PRESETS = {
  // Oliver, tuned on the Warrior body, 2026-07-29
  Scythe: { len:1.20, pitch:3.14, yaw:0.26, roll:-2.84,
            fwd:-0.04, up:0.01, side:-0.17, grip:0.29 },
};

const WEAP = { on:false, name:'Sword', len:1.0, roll:0, pitch:0, yaw:0,
               fwd:0, up:0, side:0, grip:0.72, hideStock:true };
const WEAP_DEFAULT = JSON.parse(JSON.stringify(WEAP));
let WEAP_ALL = {};
try { WEAP_ALL = JSON.parse(localStorage.getItem('bf_weap') || '{}'); } catch(e){}
/* Keyed by weapon name, not by model: the archetype rule guarantees a weapon only ever
   appears on one body, so its tuning is the same everywhere it shows up. */
function weapLoadFor(_model){
  const n = WEAP.name;
  Object.assign(WEAP, WEAP_DEFAULT, WEAPON_PRESETS[n] || {}, WEAP_ALL[n] || {}, { name: n });
}
const weapSave = () => {
  WEAP_ALL[WEAP.name] = JSON.parse(JSON.stringify(WEAP));
  try { localStorage.setItem('bf_weap', JSON.stringify(WEAP_ALL)); } catch(e){}
};

const _lenOf = obj => {
  const b = new THREE.Box3().setFromObject(obj), sz = b.getSize(new THREE.Vector3());
  return Math.max(sz.x, sz.y, sz.z) || 1;
};

/* The bone, the artist's stock weapon, and the transform they gave it. */
function weaponRig(actor){
  let bone = null;
  actor.root.traverse(o => { if(!bone && o.isBone && /^weaponr$/i.test(o.name.replace(/[^a-z]/gi,''))) bone = o; });
  if(!bone) return null;
  let stock = null;
  for(const c of bone.children){ if(!c.isBone && !c.userData._weap){ stock = c; break; } }
  return { bone, stock };
}

/* Sweep the bone for EVERY attached weapon, not just the one we happen to be tracking.
   Tracking a single reference was not enough: equipWeapon awaits a model load, so dragging
   a slider fires several overlapping calls that each clear (finding nothing yet), each
   load, and each parent a new weapon to the hand. Only the last was recorded, so every
   earlier copy stayed in the scene — a fan of ~40 scythes — and subsequent edits could no
   longer remove what was actually visible. */
function clearWeapon(actor){
  if(!actor) return;
  /* Sweep the WHOLE actor, not just the weapon bone. Belt and braces: if any future path
     ever parents a weapon somewhere unexpected, this still finds it, so a stray copy can
     never accumulate again. Cheap — it is a handful of nodes. */
  const strays = [];
  actor.root.traverse(o => { if(o.userData && o.userData._weap) strays.push(o); });
  for(const o of strays){ if(o.parent) o.parent.remove(o); }
  const rig = weaponRig(actor);
  if(rig && rig.stock) rig.stock.visible = true;    // restore the character's own weapon
  actor._weap = null;
}

let _weapSeq = 0;
async function equipWeapon(actor, useSaved){
  if(!actor) return null;
  const seq = ++_weapSeq;              // anything older than this is stale
  clearWeapon(actor);
  if(useSaved !== false) weapLoadFor(eyeModel());
  if(!WEAP.on) return null;
  // archetype rule — the Monk is unarmed, and a wizard does not swing a claymore
  const allowed = weaponsFor(eyeModel());
  if(allowed.length && !allowed.includes(WEAP.name)) WEAP.name = allowed[0];
  if(!allowed.length) return null;
  const rig = weaponRig(actor);
  if(!rig) return null;

  const g = await load(`assets/weapons/${WEAP.name}.glb`).catch(()=>null);
  // a newer request started while this one was loading — drop this result on the floor
  if(seq !== _weapSeq) return null;
  if(!g) return null;

  const holder = new THREE.Group();
  holder.userData._weap = true;
  const wmats = [];
  g.scene.traverse(o => {
    if(!o.isMesh) return;
    const m = new THREE.Mesh(o.geometry, relight(o.material.clone()));
    m.castShadow = true; m.userData._weap = true;
    o.updateWorldMatrix(true, false); m.applyMatrix4(o.matrixWorld);
    (Array.isArray(m.material) ? m.material : [m.material]).forEach(mm => mm && wmats.push(mm));
    holder.add(m);
  });
  if(!holder.children.length) return null;

  /* This pack shipped OBJ-only and was batch-converted, which carried very dim diffuse
     values across (a steel blade came through at 0.21 grey, some parts at 0.02). Against
     this scene's lighting they render as black silhouettes. Lift the whole weapon by ONE
     factor derived from its brightest material, so gold still reads brighter than steel
     and steel brighter than wood — normalising each material separately would flatten
     exactly the contrast that makes them readable. */
  let peak = 0;
  for(const mm of wmats){ if(mm.color) peak = Math.max(peak, mm.color.r, mm.color.g, mm.color.b); }
  if(peak > 1e-3 && peak < 0.72){
    const k = 0.72 / peak;
    for(const mm of wmats){ if(mm.color) mm.color.multiplyScalar(k); }
  }

  // centre on its own origin so rotation behaves predictably
  const bb = new THREE.Box3().setFromObject(holder);
  const mid = bb.getCenter(new THREE.Vector3());
  const sz  = bb.getSize(new THREE.Vector3());
  const axis = (sz.y >= sz.x && sz.y >= sz.z) ? 'y' : (sz.x >= sz.z ? 'x' : 'z');
  for(const c of holder.children){ c.position.sub(mid); }
  // pivot at the grip end rather than the middle, so it sits in the fist not through it
  const half = (axis === 'y' ? sz.y : axis === 'x' ? sz.x : sz.z) / 2;
  for(const c of holder.children){ c.position[axis] += half * (WEAP.grip * 2); }

  const wrap = new THREE.Group();
  wrap.userData._weap = true;
  wrap.add(holder);

  // COPY THE ARTIST'S PLACEMENT rather than inventing one
  if(rig.stock){
    wrap.position.copy(rig.stock.position);
    wrap.quaternion.copy(rig.stock.quaternion);
    wrap.scale.copy(rig.stock.scale);
  }
  if(seq !== _weapSeq) return null;
  clearWeapon(actor);                  // belt and braces: nothing else may be attached
  rig.bone.add(wrap);
  actor.root.updateMatrixWorld(true);

  // match the stock weapon's on-screen length, then apply the per-weapon multiplier
  const want = (rig.stock ? _lenOf(rig.stock) : 0.8) * (WEAPON_LEN[WEAP.name] || 1) * WEAP.len;
  const got  = _lenOf(wrap);
  if(got > 1e-5) wrap.scale.multiplyScalar(want / got);

  holder.rotation.set(WEAP.pitch, WEAP.yaw, WEAP.roll);
  // slide along the grip, in units of the weapon's own length so it scales sensibly
  const reach = Math.max(sz.x, sz.y, sz.z);
  holder.position.set(WEAP.side * reach, WEAP.up * reach, WEAP.fwd * reach);
  if(rig.stock && WEAP.hideStock) rig.stock.visible = false;
  actor._weap = wrap;
  return { name: WEAP.name, stock: !!rig.stock, want:+want.toFixed(3), got:+got.toFixed(3) };
}


/* ─────────────  SAFE ZONE  ─────────────
   Oliver needs somewhere to stand and actually look at his character without being chewed
   on. A ring near spawn: step inside and enemies stop pathing to you and stop swinging.
   They still wander and animate, so the scene stays alive to look at. */
const SAFE = { x: 0, z: 9.5, r: 4.2 };
const inSafeZone = p => !!p && Math.hypot(p.x - SAFE.x, p.z - SAFE.z) <= SAFE.r;

function buildSafeZone(scene){
  const g = new THREE.Group();
  const disc = new THREE.Mesh(
    new THREE.CircleGeometry(SAFE.r, 48),
    new THREE.MeshBasicMaterial({ color:0x64d8a0, transparent:true, opacity:0.10,
                                  depthWrite:false, side:THREE.DoubleSide }));
  disc.rotation.x = -Math.PI/2; disc.position.y = 0.02; g.add(disc);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(SAFE.r*0.965, SAFE.r, 64),
    new THREE.MeshBasicMaterial({ color:0x8affc8, transparent:true, opacity:0.55,
                                  depthWrite:false, side:THREE.DoubleSide }));
  ring.rotation.x = -Math.PI/2; ring.position.y = 0.03; g.add(ring);
  g.position.set(SAFE.x, 0, SAFE.z);
  scene.add(g);
  return g;
}


/* ─────────────  CHARACTER CREATOR  ─────────────
   The player-facing half of the face system, and deliberately NOT the same panel as the
   dev tuner.

   Engines keep editor tools out of the shipped build for good reason, and the same split
   applies here: the tuner exposes everything, including things that can only make a
   character look broken. The creator exposes only what is safe to hand a player.

   Per Oliver: up/down, width and height are adjustable; FORWARD/BACK is not, because that
   is the one axis where a wrong value detaches the face from the head. Everything a player
   can reach here produces a face that still reads as a face — the range is silly, in the
   Mii sense, but never broken.

   Intended use in the real game: once at new-save creation, and afterwards at a mirror in
   the hub for gold. */
const CREATOR = {
  open: false,
  // what a player may change, and the bounds they may change it within
  rows: [
    ['spread', 'Eye spacing',  0.06, 0.26, 0.005],
    ['offX',   'Eye shift',   -0.30, 0.30, 0.005],
    ['height', 'Eye height',  -1.60, 0.10, 0.005],
    ['size',   'Eye size',     0.045, 0.115, 0.002],
    ['squash', 'Eye shape',    0.35, 1.05, 0.01 ],
    ['tilt',   'Eye tilt',    -0.35, 0.35, 0.01 ],
    ['faceYaw','Face angle',  -0.60, 0.60, 0.01],
  ],
  mouthRows: [
    ['y',      'Mouth height', -2.00, -0.15, 0.005],
    ['offX',   'Mouth shift',  -0.30, 0.30, 0.005],
    ['width',  'Mouth width',   0.14, 0.46, 0.005],
    ['height', 'Mouth size',    0.12, 0.42, 0.005],
  ],
  irises: ['#3a6ea5','#2f6b45','#6b4a2a','#9b2c2c','#4a3a6b','#2a2a2a','#7a6a2a','#5a8ea5'],
};

function buildCreator(){
  const el = document.getElementById('creator'); if(!el) return;
  const row = (k, lbl, mn, mx, st, val, tag) =>
    `<label>${lbl}</label><div class="rw">
       <input type="range" data-${tag}="${k}" min="${mn}" max="${mx}" step="${st}" value="${val}">
     </div>`;
  el.innerHTML =
    `<h5>Appearance</h5>` +
    CREATOR.rows.map(([k,l,mn,mx,st]) => row(k,l,mn,mx,st,EYE[k],'ck')).join('') +
    `<label>Eye colour</label><div class="shapes">` +
      CREATOR.irises.map(c => `<button class="sw2${EYE.iris===c?' sel':''}" data-iris="${c}" style="background:${c}"></button>`).join('') +
    `</div>` +
    CREATOR.mouthRows.map(([k,l,mn,mx,st]) => row(k,l,mn,mx,st,MOUTH[k],'cm')).join('') +
    `<label>Mouth</label><div class="shapes">` +
      MOUTH_SHAPES.map(sh => `<button data-cmouth="${sh}" class="${MOUTH.shape===sh?'sel':''}">${sh}</button>`).join('') +
    `</div>
     <div class="btns"><button data-c="rand">Randomise</button><button data-c="done">Done</button></div>`;

  el.querySelectorAll('input[data-ck]').forEach(i =>
    i.addEventListener('input', () => { EYE[i.dataset.ck] = +i.value; addEyes(hero, false); eyeSave(); }));
  el.querySelectorAll('input[data-cm]').forEach(i =>
    i.addEventListener('input', () => { MOUTH[i.dataset.cm] = +i.value; addMouth(hero, false); mouthSave(); }));
  el.querySelectorAll('[data-iris]').forEach(b =>
    b.addEventListener('click', () => { EYE.iris = b.dataset.iris;
      el.querySelectorAll('[data-iris]').forEach(x => x.classList.toggle('sel', x === b));
      addEyes(hero, false); eyeSave(); }));
  el.querySelectorAll('[data-cmouth]').forEach(b =>
    b.addEventListener('click', () => { MOUTH.shape = b.dataset.cmouth;
      el.querySelectorAll('[data-cmouth]').forEach(x => x.classList.toggle('sel', x === b));
      addMouth(hero, false); mouthSave(); }));
  el.querySelector('[data-c="rand"]').addEventListener('click', () => {
    const pick = (mn,mx,st) => mn + Math.round(Math.random()*(mx-mn)/st)*st;
    for(const [k,,mn,mx,st] of CREATOR.rows)      EYE[k]   = +pick(mn,mx,st).toFixed(3);
    for(const [k,,mn,mx,st] of CREATOR.mouthRows) MOUTH[k] = +pick(mn,mx,st).toFixed(3);
    EYE.iris = CREATOR.irises[(Math.random()*CREATOR.irises.length)|0];
    MOUTH.shape = MOUTH_SHAPES[(Math.random()*MOUTH_SHAPES.length)|0];
    buildCreator(); addEyes(hero, false); addMouth(hero, false); eyeSave(); mouthSave();
  });
  el.querySelector('[data-c="done"]').addEventListener('click', () => toggleCreator(false));
}
function toggleCreator(on){
  const el = document.getElementById('creator'), btn = document.getElementById('creatorBtn');
  if(!el) return;
  CREATOR.open = (on === undefined) ? !CREATOR.open : on;
  if(CREATOR.open) buildCreator();
  el.classList.toggle('open', CREATOR.open);
  if(btn) btn.style.display = CREATOR.open ? 'none' : 'block';
}


/* ─────────────  ANIMATION BROWSER  ─────────────
   All 26 pooled clips, one tap each. Oliver asked to see what the full library can do;
   the class definitions only reference about nine of them, so most of what we have has
   never been on screen. */
function buildAnimBar(){
  const el = document.getElementById('animbar'); if(!el || !hero) return;
  const names = Object.keys(hero.clips || {}).sort();
  el.innerHTML = '<b>ANIMATIONS</b>' + names.map(n =>
    `<button data-clip="${n}">${n.replace(/_/g,' ')}</button>`).join('');
  el.querySelectorAll('[data-clip]').forEach(b =>
    b.addEventListener('click', () => {
      const c = hero.clips[b.dataset.clip];
      if(!c) return;
      hero.play(null, { clip: c, loop: true, fade: 0.15 });
      hero.locked = 3.0;                      // hold it long enough to actually watch
      el.querySelectorAll('[data-clip]').forEach(x => x.classList.toggle('sel', x === b));
    }));
}
function toggleAnimBar(on){
  const el = document.getElementById('animbar'), btn = document.getElementById('animBtn');
  if(!el) return;
  const open = (on === undefined) ? !el.classList.contains('open') : on;
  if(open) buildAnimBar();
  el.classList.toggle('open', open);
  if(btn) btn.style.display = open ? 'none' : 'block';
}

/* ─────────────  ACTOR  ───────────── */
class Actor {
  constructor(gltf, def, targetH){
    this.def = def;
    this.targetH = targetH || HERO_H;
    this.root = new THREE.Group();
    const model = gltf.scene;
    // normalise: Quaternius rigs vary in unit scale — fit every hero to HERO_H.
    // Reset first so re-normalising an already-scaled scene is idempotent (setScalar
    // REPLACES scale, so measuring a scaled model and re-setting would double it).
    model.position.set(0,0,0); model.updateMatrixWorld(true);
    /* Escape hatch for rigs a loader has already sized. Nothing sets it today: Box3
       normalisation measured correctly on every character tested (all landed on 1.75m),
       and bypassing it produced heights of 76m / 117m / 550m. Kept as a hook, not a fix. */
    if(!(def && def.preScaled)){
      model.scale.set(1,1,1); model.updateMatrixWorld(true);
      const b = boxOf(model), size = b.getSize(new THREE.Vector3());
      const s = this.targetH / Math.max(0.0001, size.y);
      model.scale.setScalar(s);
    }
    // Pre-fitted rigs (Mixamo) are already scaled and grounded from their SKELETON at
    // load; re-grounding them off this bind-space box threw them hundreds of units up.
    if(!(def && def.preScaled)){
      const b2 = boxOf(model);
      model.position.y -= b2.min.y;                   // feet on the floor
      model.position.x -= (b2.min.x + b2.max.x)/2 ;
      model.position.z -= (b2.min.z + b2.max.z)/2 ;
    }
    prep(model, { shadow:true });
    this.root.add(model);
    this.model = model;

    this.mixer = new THREE.AnimationMixer(model);
    this.clips = {};
    for(const c of gltf.animations) this.clips[c.name] = c;
    this.actions = {};
    this.current = null;
    this.locked = 0;                                   // seconds of non-interruptible action
    this.play('idle');
  }
  find(role){
    const want = this.def.clips[role] || [];
    for(const n of want) if(this.clips[n]) return this.clips[n];
    return null;
  }
  action(role, clipOverride){
    const clip = clipOverride || this.find(role);
    if(!clip) return null;
    const key = role + '|' + clip.name;
    if(!this.actions[key]){
      const a = this.mixer.clipAction(clip);
      this.actions[key] = a;
    }
    return this.actions[key];
  }
  play(role, { loop=true, fade=0.18, clip=null, speed=1 } = {}){
    const a = this.action(role, clip);
    if(!a || a === this.current) { if(a) a.timeScale = speed; return a; }
    a.reset();
    a.timeScale = speed;
    a.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    a.clampWhenFinished = !loop;
    a.fadeIn(fade).play();
    if(this.current) this.current.fadeOut(fade);
    this.current = a;
    return a;
  }
  once(role, speed=1){
    const clip = this.find(role); if(!clip) return 0;
    this.play(role, { loop:false, fade:0.08, speed });
    const dur = clip.duration / speed;
    this.locked = dur * 0.82;                          // let the tail blend back to idle
    return dur;
  }
  /* ── upper-body layering ──
     Real Bladefall never roots you: p.atkTimer only drives the arm pose, the movement
     code never reads it, so you run and swing at the same time. Skeletal clips are
     full-body by default, so we synthesise an upper-body-only version by dropping every
     track that targets a leg/foot/hip bone. That plays OVER the locomotion instead of
     replacing it — swing while sprinting, exactly like the voxel game. */
  /* Which bones must the attack layer NEVER touch?
     Name matching is not enough: on this rig the chain is Root > Body > UpperLeg, and
     the attack clip animates Body — a PARENT of the legs — so the whole lower body
     inherited the swing even after the leg bones themselves were excluded. That parent/
     child mismatch is the bowlegged twist. So derive the set from the actual skeleton:
     every leg bone, everything beneath it, and every ancestor above it. */
  lowerBones(){
    if(this._lowerSet) return this._lowerSet;
    const LEGWORD = /(leg|thigh|shin|calf|knee|foot|ankle|toe|ball|poletarget)/i;
    const legs = [];
    this.root.traverse(o => { if(o.isBone && LEGWORD.test(o.name)) legs.push(o); });
    const set = new Set();
    const addBelow = b => { set.add(b.name); for(const c of b.children) if(c.isBone) addBelow(c); };
    for(const L of legs){
      addBelow(L);
      let c = L.parent;
      while(c && c.isBone){ set.add(c.name); c = c.parent; }   // ancestors drive the legs too
    }
    this._lowerSet = set;
    return set;
  }
  upperClip(clip){
    if(!clip) return null;
    if(!this._upper) this._upper = new Map();
    if(this._upper.has(clip.name)) return this._upper.get(clip.name);
    const lower = this.lowerBones();
    const tracks = clip.tracks.filter(t => !lower.has(t.name.split('.')[0]));
    const made = tracks.length && tracks.length < clip.tracks.length
      ? new THREE.AnimationClip(clip.name + '__upper', clip.duration, tracks)
      : null;
    this._upper.set(clip.name, made);
    return made;
  }
  /* play an action on the arms only; returns true if layering worked */
  layer(role, { speed=1, clip=null } = {}){
    const base = clip || this.find(role);
    const up = this.upperClip(base);
    if(!up) return false;
    if(this._layerAct){ this._layerAct.stop(); }
    const a = this.mixer.clipAction(up);
    a.reset(); a.timeScale = speed;
    a.setLoop(THREE.LoopOnce, 1); a.clampWhenFinished = false;
    a.weight = 1; a.fadeIn(0.05).play();
    this._layerAct = a;
    this._layerT = up.duration / speed;
    return true;
  }
  update(dt){ this.mixer.update(dt); if(this.locked>0) this.locked -= dt; }
}

/* ─────────────  VFX TOOLKIT  ─────────────
   The old effects looked "voxelly" because they were square THREE.Points and hard-edged
   rings. Everything here is built from soft, additively-blended canvas textures instead:
   a radial falloff mote, a soft-edged ring, and a beam gradient. Additive blending is
   what makes light read as light rather than as coloured boxes. */
function canvasTex(draw, size){
  const c = document.createElement('canvas'); c.width = c.height = size || 128;
  draw(c.getContext('2d'), c.width);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.needsUpdate = true;
  return t;
}
const UNIT_PLANE = new THREE.PlaneGeometry(1,1);
const TEX = {
  mote: canvasTex((x,s) => {                       // soft glowing dot
    const g = x.createRadialGradient(s/2,s/2,0, s/2,s/2,s/2);
    g.addColorStop(0,   'rgba(255,255,255,1)');
    g.addColorStop(0.25,'rgba(255,255,255,0.85)');
    g.addColorStop(0.55,'rgba(255,255,255,0.28)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0,0,s,s);
  }, 128),
  ring: canvasTex((x,s) => {                       // soft annulus with a bright leading edge
    const g = x.createRadialGradient(s/2,s/2,s*0.20, s/2,s/2,s/2);
    g.addColorStop(0,   'rgba(255,255,255,0)');
    g.addColorStop(0.55,'rgba(255,255,255,0.10)');
    g.addColorStop(0.82,'rgba(255,255,255,0.95)');
    g.addColorStop(0.95,'rgba(255,255,255,0.35)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0,0,s,s);
  }, 256),
  beam: canvasTex((x,s) => {                       // vertical light shaft, hot core
    const g = x.createLinearGradient(0,0,s,0);
    g.addColorStop(0,   'rgba(255,255,255,0)');
    g.addColorStop(0.38,'rgba(255,255,255,0.55)');
    g.addColorStop(0.5, 'rgba(255,255,255,1)');
    g.addColorStop(0.62,'rgba(255,255,255,0.55)');
    g.addColorStop(1,   'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0,0,s,s);
  }, 64),
  slash: canvasTex((x,s) => {                      // crescent sweep for melee arcs
    x.translate(s/2,s/2);
    for(let i=0;i<26;i++){
      const t = i/25, a0 = -1.15 + t*2.3;
      x.globalAlpha = Math.sin(t*Math.PI) * 0.95;
      x.strokeStyle = 'rgba(255,255,255,1)';
      x.lineWidth = 5 + Math.sin(t*Math.PI)*9;
      x.beginPath(); x.arc(0,0, s*0.36, a0, a0+0.1); x.stroke();
    }
  }, 256),
};
const _matCache = new Map();
function addMat(color, tex, opacity){
  // Sprites that share a material still cost a draw call each, so this is only for the
  // few one-off sprites; bulk particles go through THREE.Points below (1 draw call).
  const key = color + '|' + (tex ? tex.uuid : 'm');
  let m = _matCache.get(key);
  if(!m){
    m = new THREE.SpriteMaterial({ map:tex||TEX.mote, color:new THREE.Color(color),
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
    _matCache.set(key, m);
  }
  const c = m.clone();                    // clone shares the map/program, cheap
  if(opacity != null) c.opacity = opacity;
  return c;
}
// ── pooled lights: each PointLight adds a real cost to every lit material, so cap them ──
const LIGHT_POOL = [];
for(let i=0;i<2;i++){ const l = new THREE.PointLight('#ffffff', 0, 14, 2); l.visible=false; scene.add(l); LIGHT_POOL.push(l); }
let _lightRR = 0;
function takeLight(){ const l = LIGHT_POOL[_lightRR++ % LIGHT_POOL.length]; return l; }
// a flat, camera-independent quad lying on the ground (for rings / decals)
function groundQuad(tex, color, size, opacity){
  const m = new THREE.Mesh(UNIT_PLANE,
    new THREE.MeshBasicMaterial({ map:tex, color:new THREE.Color(color), transparent:true,
      opacity:opacity==null?1:opacity, depthWrite:false, blending:THREE.AdditiveBlending,
      side:THREE.DoubleSide }));
  m.rotation.x = -Math.PI/2; m.scale.set(size,size,1);
  return m;
}

/* ─────────────  VFX  ─────────────
   Every effect is assembled from the soft additive primitives above and driven by a
   single update list. Each entry exposes step(k) where k runs 0..1 over its life. */
const vfx = [];
function push(o){ vfx.push(o); return o; }
function killObj(o){
  if(!o) return;
  scene.remove(o);
  if(o.geometry && o.geometry !== UNIT_PLANE) o.geometry.dispose();
  const m = o.material;
  if(m){ (Array.isArray(m)?m:[m]).forEach(x=>x && x.dispose()); }
}

/* soft expanding ground ring */
function ringWave(pos, color, maxR, life, y){
  const q = groundQuad(TEX.ring, color, 0.6, 1);
  q.position.copy(pos).setY((y==null?0.05:y));
  scene.add(q);
  return push({ life: life||0.85, t:0, step(k){
    const r = 0.6 + (maxR-0.6) * (1 - Math.pow(1-k, 2.2));   // fast out, ease to a stop
    q.scale.set(r, r, 1);
    q.material.opacity = Math.pow(1-k, 1.5);
  }, done(){ killObj(q); } });
}
/* a burst of soft motes — ONE THREE.Points draw call regardless of particle count.
   PointsMaterial takes the same soft radial texture, so it looks identical to the old
   per-sprite version while costing 1 draw call instead of N. */
function motes(pos, color, n, opt){
  opt = opt || {};
  n = Math.min(n, 48);
  const g = new THREE.BufferGeometry();
  const arr = new Float32Array(n*3);
  const vel3 = [];
  for(let i=0;i<n;i++){
    arr[i*3] = pos.x; arr[i*3+1] = pos.y; arr[i*3+2] = pos.z;
    const a = Math.random()*Math.PI*2;
    const rs = (opt.spread==null?3.4:opt.spread) * (0.35 + Math.random());
    vel3.push(new THREE.Vector3(Math.cos(a)*rs, (opt.up==null?3.2:opt.up)*(0.4+Math.random()), Math.sin(a)*rs));
  }
  g.setAttribute('position', new THREE.BufferAttribute(arr,3));
  const mat = new THREE.PointsMaterial({ map:TEX.mote, color:new THREE.Color(color),
    size:(opt.size||0.42)*2.2, transparent:true, depthWrite:false,
    blending:THREE.AdditiveBlending, sizeAttenuation:true });
  const pts = new THREE.Points(g, mat);
  scene.add(pts);
  const grav = opt.grav==null ? 7.5 : opt.grav;
  return push({ life: opt.life||0.9, t:0, step(k, dt){
    for(let i=0;i<n;i++){
      const v = vel3[i];
      v.y -= grav*dt; v.x *= 0.965; v.z *= 0.965;
      arr[i*3] += v.x*dt; arr[i*3+1] += v.y*dt; arr[i*3+2] += v.z*dt;
      if(arr[i*3+1] < 0.06){ arr[i*3+1] = 0.06; v.y *= -0.28; }
    }
    g.attributes.position.needsUpdate = true;
    mat.opacity = Math.pow(1-k, 1.35);
  }, done(){ killObj(pts); } });
}
/* a flash of light that fades */
function flash(pos, color, power, life){
  const li = takeLight();
  li.color.set(color); li.position.copy(pos); li.visible = true;
  return push({ life: life||0.45, t:0, step(k){ li.intensity = (power||14) * Math.pow(1-k, 2); },
                done(){ li.intensity = 0; li.visible = false; } });
}
/* crescent slash sweeping around a point */
function slashArc(pos, color, radius, life, tilt, spin0){
  const m = new THREE.Mesh(UNIT_PLANE,
    new THREE.MeshBasicMaterial({ map:TEX.slash, color:new THREE.Color(color), transparent:true,
      depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide }));
  m.position.copy(pos);
  m.rotation.set(-Math.PI/2 + (tilt||0), 0, spin0||0);
  m.scale.setScalar(radius*2);
  scene.add(m);
  return push({ life: life||0.42, t:0, step(k){
    m.rotation.z = (spin0||0) + k*3.4;
    m.material.opacity = Math.sin((1-k)*Math.PI*0.9);
    const s = radius*2*(0.75 + k*0.5); m.scale.setScalar(s);
  }, done(){ killObj(m); } });
}
/* a travelling projectile. The trail is a single Points ring-buffer that follows the
   head, so a projectile costs 2 draw calls total instead of ~50 spawned sprites. */
const TRAIL_N = 14;
function projectile(from, dir, color, opt){
  opt = opt || {};
  const head = new THREE.Sprite(addMat(color, TEX.mote, 1));
  head.scale.setScalar(opt.size || 0.75);
  head.position.copy(from);
  scene.add(head);

  const tg = new THREE.BufferGeometry();
  const tarr = new Float32Array(TRAIL_N*3);
  for(let i=0;i<TRAIL_N;i++){ tarr[i*3]=from.x; tarr[i*3+1]=from.y; tarr[i*3+2]=from.z; }
  tg.setAttribute('position', new THREE.BufferAttribute(tarr,3));
  const tmat = new THREE.PointsMaterial({ map:TEX.mote, color:new THREE.Color(color),
    size:(opt.size||0.75)*1.5, transparent:true, opacity:0.7, depthWrite:false,
    blending:THREE.AdditiveBlending, sizeAttenuation:true });
  const trail = new THREE.Points(tg, tmat);
  scene.add(trail);

  const speed = opt.speed || 16, range = opt.range || 12;
  const life = range/speed;
  let write = 0;
  return push({ life, t:0, step(k, dt){
    head.position.addScaledVector(dir, speed*dt);
    // ring-buffer the trail so it lags behind the head
    tarr[write*3] = head.position.x; tarr[write*3+1] = head.position.y; tarr[write*3+2] = head.position.z;
    write = (write+1) % TRAIL_N;
    tg.attributes.position.needsUpdate = true;
    tmat.opacity = 0.7 * (1 - k*0.5);
    if(!opt.noDamage) for(const e of enemies){
      if(e.dead || e._hitBy === head.id) continue;
      if(e.root.position.distanceTo(head.position) < 1.3){
        e._hitBy = head.id;
        hurtEnemy(e, Math.round((opt.dmg||22) * (0.85+Math.random()*0.3)), Math.random()<0.25);
      }
    }
  }, done(){
    const pnt = head.position.clone();
    ringWave(pnt, color, 2.6, 0.5, 0.06);
    motes(pnt, color, 12, { spread:3.0, up:2.4, life:0.6, size:0.34 });
    if(!opt.quiet) flash(pnt, color, 9, 0.3);          // volleys skip the light
    killObj(head); killObj(trail);
  } });
}
/* vertical light column (beams, pillars, meteors landing) */
function pillar(pos, color, radius, height, life){
  const m = new THREE.Mesh(new THREE.CylinderGeometry(radius, radius*1.25, height, 18, 1, true),
    new THREE.MeshBasicMaterial({ map:TEX.beam, color:new THREE.Color(color), transparent:true,
      depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide }));
  m.position.copy(pos).setY(height/2);
  scene.add(m);
  return push({ life: life||0.6, t:0, step(k){
    m.material.opacity = Math.pow(1-k, 1.2);
    const w = 1 + k*0.5; m.scale.set(w,1,w);
    m.rotation.y += 0.06;
  }, done(){ killObj(m); } });
}
/* lingering cloud that ticks damage */
function cloud(pos, color, radius, life, dps){
  const grp = new THREE.Group(); grp.position.copy(pos); scene.add(grp);
  const puffs = [];
  for(let i=0;i<18;i++){
    const sp = new THREE.Sprite(addMat(color, TEX.mote, 0.55));
    const sc = radius*(0.5+Math.random()*0.7); sp.scale.set(sc,sc,1);
    const a = Math.random()*Math.PI*2, r = Math.random()*radius*0.8;
    sp.position.set(Math.cos(a)*r, 0.3+Math.random()*0.9, Math.sin(a)*r);
    puffs.push({ sp, a, r, ph: Math.random()*6 }); grp.add(sp);
  }
  let tick = 0;
  return push({ life: life||3.0, t:0, step(k, dt){
    for(const p of puffs){
      p.a += dt*0.5;
      p.sp.position.x = Math.cos(p.a)*p.r;
      p.sp.position.z = Math.sin(p.a)*p.r;
      p.sp.position.y += Math.sin(performance.now()*0.001 + p.ph)*dt*0.25;
      p.sp.material.opacity = 0.55 * Math.sin(Math.min(1,k*4)*Math.PI*0.5) * Math.pow(1-k, 0.7);
    }
    tick += dt;
    if(tick > 0.5 && dps){ tick = 0;
      for(const e of enemies){ if(e.dead) continue;
        if(e.root.position.distanceTo(grp.position) < radius) hurtEnemy(e, Math.round(dps), false); }
    }
  }, done(){ grp.children.forEach(killObj); scene.remove(grp); } });
}

function stepVFX(dt){
  for(let i=vfx.length-1;i>=0;i--){
    const f = vfx[i];
    f.t += dt;
    const k = Math.min(1, f.t / f.life);
    try{ f.step(k, dt); }catch(e){}
    if(f.t >= f.life){ try{ f.done && f.done(); }catch(e){} vfx.splice(i,1); }
  }
}

/* ── the 1-4 skill kits ── */
function aoeDamage(pos, radius, dmg, crit){
  for(const e of enemies){
    if(e.dead) continue;
    if(e.root.position.distanceTo(pos) <= radius) hurtEnemy(e, Math.round(dmg*(0.85+Math.random()*0.3)), crit);
  }
}

// camera orbit (drag) — works for mouse and, outside the touch widgets, for fingers
let camYaw = 0.0, camPitch = 0.34, camDist = 7.2;
let dragging = false, lastX = 0, lastY = 0, dragId = null;
function onDown(e){
  if(e.target.closest && e.target.closest('#touch, #classes')) return;
  dragging = true; dragId = e.pointerId; lastX = e.clientX; lastY = e.clientY;
}
function onMove(e){
  if(!dragging || e.pointerId !== dragId) return;
  camYaw   -= (e.clientX - lastX) * 0.0055;
  camPitch  = Math.max(-0.15, Math.min(1.15, camPitch + (e.clientY - lastY) * 0.0042));
  lastX = e.clientX; lastY = e.clientY;
}
function onUp(e){ if(e.pointerId===dragId){ dragging = false; dragId = null; } }
canvas.addEventListener('pointerdown', onDown);
addEventListener('pointermove', onMove);
addEventListener('pointerup', onUp);
addEventListener('pointercancel', onUp);
addEventListener('wheel', e => { camDist = Math.max(3, Math.min(16, camDist + Math.sign(e.deltaY)*0.6)); }, {passive:true});

(function stickSetup(){
  const stick = document.getElementById('stick'), knob = document.getElementById('knob');
  let id = null, cx=0, cy=0, R=52;
  const set = (dx,dy)=>{
    const d = Math.hypot(dx,dy), c = d>R ? R/d : 1;
    knob.style.transform = `translate(${dx*c}px,${dy*c}px)`;
    touchVec.set((dx*c)/R, (dy*c)/R);
  };
  stick.addEventListener('pointerdown', e=>{
    id = e.pointerId; const r = stick.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
    set(e.clientX-cx, e.clientY-cy); stick.setPointerCapture(id);
  });
  stick.addEventListener('pointermove', e=>{ if(e.pointerId!==id) return; set(e.clientX-cx, e.clientY-cy); });
  const end = e=>{ if(e.pointerId!==id) return; id=null; knob.style.transform=''; touchVec.set(0,0); };
  stick.addEventListener('pointerup', end); stick.addEventListener('pointercancel', end);
})();

    tex.needsUpdate = true;
  };
  draw(1);
  return { spr, draw };
}

/* ── damage numbers ──
   Previously every hit allocated a canvas AND a fresh GPU texture. A single Fan of
   Knives can land ~28 hits in one frame, so that was ~28 texture uploads mid-frame —
   the recurring stall. Now the glyphs are pre-rendered ONCE at boot and each number is
   assembled from cached digit sprites: zero allocation per hit. */
const GLYPHS = '0123456789+';
const _glyphMat = { normal:{}, crit:{} };
(function buildGlyphs(){
  for(const crit of [false, true]){
    for(const ch of GLYPHS){
      const c = document.createElement('canvas'); c.width = 64; c.height = 80;
      const x = c.getContext('2d');
      x.font = 'bold ' + (crit ? 62 : 52) + 'px system-ui, sans-serif';
      x.textAlign = 'center'; x.textBaseline = 'middle';
      x.lineWidth = 8; x.strokeStyle = 'rgba(0,0,0,.9)';
      x.strokeText(ch, 32, 40);
      x.fillStyle = crit ? '#ffd24a' : '#fff2e0';
      x.fillText(ch, 32, 40);
      const t = new THREE.CanvasTexture(c);
      t.colorSpace = THREE.SRGBColorSpace;
      _glyphMat[crit ? 'crit' : 'normal'][ch] =
        new THREE.SpriteMaterial({ map:t, depthTest:false, transparent:true });
    }
  }
})();
const dmgTexts = [];
function damageNumber(pos, amount, crit){
  const str = String(amount);
  const set = _glyphMat[crit ? 'crit' : 'normal'];
  const grp = new THREE.Group();
  const w = crit ? 0.34 : 0.28;
  for(let i=0;i<str.length && i<5;i++){
    const m = set[str[i]];
    if(!m) continue;
    const sp = new THREE.Sprite(m.clone());          // clone shares map + program
    sp.scale.set(w, w*1.25, 1);
    sp.position.x = (i - (str.length-1)/2) * w * 0.72;
    grp.add(sp);
  }
  grp.position.copy(pos);
  scene.add(grp);
  dmgTexts.push({ spr:grp, t:0, life:0.85, vy:1.7 });
}

/* ── enemies ── */
async function spawnEnemy(x, z, mIdx){
  const M = (typeof mIdx === 'string')
    ? (MONSTERS.find(q => q.label === mIdx) || MONSTERS[0])
    : MONSTERS[mIdx % MONSTERS.length];
  const g = await load(`assets/monsters/${M.file}.glb`).catch(()=>null);
  if(!g) return null;
  // Quaternius exports name clips "CharacterArmature|Idle" — normalise so RIGS can find them
  for(const c of g.animations) c.name = c.name.split('|').pop();
  const e = new Actor(g, { clips: RIGS[M.rig] || RIGS.ground }, M.h * MOB_SCALE);
  if(M.flyY) e.root.position.y = M.flyY;
  if(M.skin) applyMobSkin(e, M.skin);
  e.root.position.set(x, 0, z);
  e.def2 = M;
  e.maxHp = M.hp; e.hp = M.hp; e.dead = false; e.hitFlash = 0; e.swingCd = 1 + Math.random()*2;
  const bar = makeHpBar();
  bar.spr.position.y = M.h + 0.42;
  e.root.add(bar.spr);
  e.bar = bar;
  scene.add(e.root);
  enemies.push(e);
  return e;
}
function hurtEnemy(e, amount, crit){
  if(e.dead) return;
  e.hp -= amount;
  e.bar.draw(Math.max(0, e.hp / e.maxHp));
  damageNumber(e.root.position.clone().add(new THREE.Vector3((Math.random()-.5)*.5, 2.0, 0)), amount, crit);
  if(e.hp <= 0){
    e.dead = true;
    e.once('death', 1.0);
    e.bar.spr.visible = false;
    kills++; updateKills();
    setTimeout(()=>{                              // fade out, then respawn it so there's always something to fight
      scene.remove(e.root);
      const i = enemies.indexOf(e); if(i>=0) enemies.splice(i,1);
      disposeTree(e.root);
      const spot = ENEMY_SPOTS[Math.floor(Math.random()*ENEMY_SPOTS.length)];
      spawnEnemy(spot.x + (Math.random()-.5)*2.5, spot.z + (Math.random()-.5)*2.5, spot.m);
    }, 2600);
  } else {
    e.once('hit', 1.2);
    e.hitFlash = 0.16;
  }
}
function updateKills(){
  const el = document.getElementById('kills');
  if(el) el.textContent = kills === 0 ? '' : (kills + (kills===1 ? ' foe felled' : ' foes felled'));
}

/* ── hero health ── */
let heroHp = 100, heroMaxHp = 100, hurtCd = 0;
function updateHeroHp(){
  const f = Math.max(0, heroHp/heroMaxHp);
  const fill = document.getElementById('hpfill'), txt = document.getElementById('hptxt');
  if(fill){ fill.style.width = (f*100)+'%';
    fill.style.background = f > .5 ? 'linear-gradient(90deg,#4fae5c,#7ad06a)'
                          : f > .22 ? 'linear-gradient(90deg,#b8862a,#e0b040)'
                                    : 'linear-gradient(90deg,#a33228,#e04a3a)'; }
  if(txt) txt.textContent = Math.max(0, Math.round(heroHp)) + ' / ' + heroMaxHp;
}
function hurtHero(amount){
  if(hurtCd > 0 || rollT > 0) return;                 // i-frames while rolling
  hurtCd = 0.55;
  heroHp = Math.max(0, heroHp - amount);
  updateHeroHp();
  document.body.animate(
    [{ filter:'brightness(1.5) saturate(.6)' }, { filter:'none' }],
    { duration:180, easing:'ease-out' });
  if(hero) hero.once('hit', 1.3);
  if(heroHp <= 0){                                    // no death screen in a slice — just get back up
    heroHp = heroMaxHp; updateHeroHp();
    if(hero) hero.root.position.set(0, 0, 4);
    for(const e of enemies) e.swingCd = 2.5;
  }
}

/* ── hero actions ── */
function strike(reach, arc, dmgMin, dmgMax){      // damage everything in a cone in front of the hero
  const fx = Math.sin(hero.root.rotation.y), fz = Math.cos(hero.root.rotation.y);
  for(const e of enemies){
    if(e.dead) continue;
    const dx = e.root.position.x - hero.root.position.x;
    const dz = e.root.position.z - hero.root.position.z;
    const d = Math.hypot(dx, dz);
    if(d > reach) continue;
    if(d > 0.3 && (dx*fx + dz*fz)/d < arc) continue;
    const crit = Math.random() < 0.22;
    const dmg = Math.round((dmgMin + Math.random()*(dmgMax-dmgMin)) * (crit ? 2 : 1));
    hurtEnemy(e, dmg, crit);
  }
}
function doAttack(){
  if(!hero || hero.locked>0 || rollT>0) return;
  const list = heroDef.clips.attack.filter(n=>hero.clips[n]);
  const name = list.length ? list[atkFlip++ % list.length] : null;
  if(!name) return;
  const clip = hero.clips[name];
  if(hero.layer('attack', { speed:ATK_SPEED, clip })){
    hero.locked = 0;                                    // arms only — legs keep running
    hero.swingT = clip.duration/ATK_SPEED*0.8;
  } else {                                              // rig has no usable bone names
    hero.play('attack', { loop:false, fade:.07, clip, speed:ATK_SPEED });
    hero.locked = clip.duration/ATK_SPEED*0.55;
  }
  setTimeout(()=>{ if(hero) strike(2.5, 0.25, 9, 16); }, 110);   // land the hit mid-swing
}
function doRoll(){
  if(!hero || rollT>0 || hero.locked>0 || !grounded) return;
  const d = moveDir();
  rollDir.copy(d.lengthSq()>0.01 ? d : new THREE.Vector3(Math.sin(hero.root.rotation.y),0,Math.cos(hero.root.rotation.y)));
  rollT = 0.62; hero.once('roll', 1.15);
}
function doJump(){
  if(!hero || !grounded || rollT>0) return;
  vy = JUMP_V; grounded = false;
}
const skillCd = [0,0,0,0];
let _sbT = 0;
function castSkill(i){
  if(!hero || hero.locked>0 || rollT>0) return;
  const kit = SKILLS[heroDef.id] || SKILLS.Warrior;
  const S = kit[i]; if(!S) return;
  if(skillCd[i] > 0) return;
  skillCd[i] = S.cd;
  if(!hero.layer('skill', { speed:1.0 })) hero.once('skill', 1.0);
  const yaw = hero.root.rotation.y;
  const fwd = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const p = hero.root.position.clone();
  setTimeout(()=>{ try{ S.cast(p, fwd); }catch(e){ console.error(e); } }, 150);
  paintSkillBar();
}
function doSkill(){ castSkill(0); }

function moveDir(){
  let x = 0, z = 0;
  if(keys.KeyW||keys.ArrowUp) z -= 1;
  if(keys.KeyS||keys.ArrowDown) z += 1;
  if(keys.KeyA||keys.ArrowLeft) x -= 1;
  if(keys.KeyD||keys.ArrowRight) x += 1;
  x += touchVec.x; z += touchVec.y;
  const v = new THREE.Vector3(x, 0, z);
  if(v.lengthSq() > 1) v.normalize();
  // camera-relative
  return v.applyAxisAngle(new THREE.Vector3(0,1,0), camYaw);
}

/* ─────────────  SHADER PREWARM  ─────────────
   The "freeze for a moment, then smooth forever" stall is GPU shader compilation: the
   first time a material variant is drawn, the driver compiles its program and BLOCKS
   the frame. Every VFX primitive introduces a new variant, so the first cast of each
   skill stalled. Here we instantiate one of every variant up front, force the compile
   and the texture uploads while the loading screen is still showing, then throw them
   away — so gameplay never meets an uncompiled shader. */
async function warmupVFX(){
  const warm = new THREE.Group();
  warm.position.copy(camera.position).add(new THREE.Vector3(0, -400, 0));   // offscreen but in-scene
  const P = new THREE.Vector3();

  // every texture used by the VFX layer -> force the GPU upload
  for(const k in TEX){ try{ renderer.initTexture(TEX[k]); }catch(e){} }

  // 1. sprite + additive (heads, glows, damage numbers)
  for(const t of [TEX.mote, TEX.ring, TEX.beam, TEX.slash]){
    const sp = new THREE.Sprite(addMat('#ffffff', t, 1)); sp.scale.setScalar(0.01); warm.add(sp);
  }
  // 2. points + additive (motes bursts and projectile trails)
  for(const size of [0.4, 1.5]){
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array([0,0,0]), 3));
    warm.add(new THREE.Points(g, new THREE.PointsMaterial({ map:TEX.mote, color:0xffffff,
      size, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, sizeAttenuation:true })));
  }
  // 3. ground quads / beams / slashes (MeshBasic + map + additive + DoubleSide)
  for(const t of [TEX.ring, TEX.slash, TEX.beam]){
    const m = new THREE.Mesh(new THREE.PlaneGeometry(0.01,0.01),
      new THREE.MeshBasicMaterial({ map:t, transparent:true, depthWrite:false,
        blending:THREE.AdditiveBlending, side:THREE.DoubleSide }));
    warm.add(m);
  }
  // 4. pillar (open-ended cylinder, additive)
  warm.add(new THREE.Mesh(new THREE.CylinderGeometry(0.01,0.01,0.02,18,1,true),
    new THREE.MeshBasicMaterial({ map:TEX.beam, transparent:true, depthWrite:false,
      blending:THREE.AdditiveBlending, side:THREE.DoubleSide })));
  // 5. plain additive box (bolt segments)
  warm.add(new THREE.Mesh(new THREE.BoxGeometry(0.01,0.01,0.01),
    new THREE.MeshBasicMaterial({ color:0xffffff, transparent:true, depthWrite:false })));
  // 6. canvas-sprite variant (damage numbers use their own CanvasTexture)
  { const c = document.createElement('canvas'); c.width = c.height = 8;
    c.getContext('2d').fillRect(0,0,8,8);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map:new THREE.CanvasTexture(c),
      depthTest:false, transparent:true }));
    sp.scale.setScalar(0.01); warm.add(sp); }

  scene.add(warm);
  try{ renderer.compile(scene, camera); }catch(e){}
  renderer.render(scene, camera);                 // force the programs to actually run once
  await new Promise(r => requestAnimationFrame(r));
  renderer.render(scene, camera);
  scene.remove(warm);
  warm.traverse(o => {
    if(o.geometry) o.geometry.dispose();
    const m = o.material; if(m) (Array.isArray(m)?m:[m]).forEach(x=>x&&x.dispose());
  });
}

  const [room, wallA, torchProp] = await Promise.all([
