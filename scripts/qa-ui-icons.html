<!doctype html><meta charset="utf-8"><title>UI icon QA</title><style>body{margin:0;background:#111;color:#eee;font:14px monospace}#status{padding:12px}iframe{border:0;width:100%;height:900px}</style><div id="status">Running real-game icon and old-save checks…</div><iframe id="game"></iframe><script>
const f=document.querySelector('iframe'),status=document.querySelector('#status');let phase=0,before;
const wait=ms=>new Promise(r=>setTimeout(r,ms));const assert=(v,s)=>{if(!v)throw Error(s)};
f.onload=async()=>{try{const w=f.contentWindow;for(let i=0;i<300&&!w.__BF3;i++)await wait(100);const b=w.__BF3;assert(b,'game boot');await b.briarReady;b.loadMode('rl');
if(!phase){b.meta.classId='pyromancer';b.meta.classUnlocked.pyromancer=true;b.meta.classes.pyromancer={rank:10,xp:0,ch:Object.fromEntries([2,3,4,5,6,7,8,9].map(r=>[r,b.CLASS2.pyromancer['r'+r].a.id]))};b.meta.gold=12345;b.meta.heroName='Icon QA';b.meta.hubTutDone=true;b.meta.introSeen=true;b.meta.dialogueTTS=false;b.meta.petOwned=['shepherd'];b.persist();before=JSON.stringify({classId:b.meta.classId,rank:b.meta.classes.pyromancer,gold:b.meta.gold,name:b.meta.heroName,pets:b.meta.petOwned});phase=1;f.src='index.html?mute=1';return;}
assert(before===JSON.stringify({classId:b.meta.classId,rank:b.meta.classes.pyromancer,gold:b.meta.gold,name:b.meta.heroName,pets:b.meta.petOwned}),'pre-change save preservation');

for(const name of w.BFUIIcons.names){const im=new Image();im.src='icons/ui/'+name+'.png';await im.decode();assert(im.naturalWidth===256,name);}
b.enterWaystation();b.openHubMenu();assert(w.document.querySelector('img[src*="destination-storm-coast"]'),'Storm Coast art');assert(w.document.querySelector('img[src*="destination-rift-hall"]'),'Rift Hall art');
b.openPause();w.document.querySelector('#optBtn').click();assert(w.document.querySelectorAll('.settingsSection .bf-ui-icon').length===5,'five settings icons');
b.enterWaystation();w.BFEmotes.open();assert(w.document.querySelectorAll('#emoteWheel .bf-ui-icon').length===5,'five emotes');w.BFEmotes.close();
for(const cid of ['pirate','monk','reaper'])assert(b.itemStaticAv(b.intrinsicWeapon(cid)).includes('equipment-'+cid),'signature '+cid);
b.openCharacterStats(()=>{});assert(w.document.querySelector('[data-icon="action-allocate-stats"]'),'stats icon');
b.enterWaystation();b.openWardrobe();assert(w.document.querySelector('[data-icon="action-class-appearance"]'),'appearance icon');
b.enterWaystation();b.openJournal();assert(w.document.querySelector('[data-icon="journal"]'),'journal icon');b.closeJournal();
if(new URLSearchParams(location.search).get('view')==='emotes-only'){b.enterWaystation();w.BFEmotes.open();status.textContent='Emote visual review';return;}
b.enterZone(5);await wait(4000);b.startVoyage();for(let i=0;i<100&&!w.document.querySelector('#voyagehud');i++){b.update(.016);b.render();await wait(100);}assert(w.document.querySelectorAll('#voyagehud .bf-ui-icon').length===6,'six voyage icons: '+w.document.querySelectorAll('#voyagehud .bf-ui-icon').length);
b.enterWaystation();
const view=new URLSearchParams(location.search).get('view');
if(view==='emotes')w.BFEmotes.open();else if(view==='settings'){b.openPause();w.document.querySelector('#optBtn').click();}else b.openHubMenu();
status.textContent='PASS: all 37 images decoded; destination menu, five settings sections, five emotes, three built-in weapons, stat allocation, appearances journal and six voyage icons; pre-change save preserved.';document.title='PASS — UI icons';
}catch(e){status.textContent='FAIL: '+e.stack;document.title='FAIL — UI icons';}};f.src='_qa-prechange.html?mute=1';
</script>
